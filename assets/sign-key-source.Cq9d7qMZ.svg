<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sgnk-title sgnk-desc" id="sign-key-source-root">
        <title id="sgnk-title">公钥来源与 genesis 回退</title>
        <desc id="sgnk-desc">启动时读外部 Flash 扇区 132/133 的 IAPK 公钥记录，任一槽通过魔数、版本与 CRC32 校验则取写入序号大者作为生效公钥；两槽都无效时回退到 ROM 内固化的 genesis 公钥，启动打印标明来源。</desc>
        <defs>
      <style>#sign-key-source-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; }
      #sign-key-source-root { font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--color-ink); }
      #sign-key-source-root .diagram-container { width: 100%; overflow-x: auto; }
      #sign-key-source-root .n { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
      #sign-key-source-root .s { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
      #sign-key-source-root .m { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
      #sign-key-source-root .k { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
      #sign-key-source-root .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }</style>
          <marker id="sign-key-source-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="sign-key-source-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <style>
          .n  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
          .s  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
          .m  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
          .k  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
          .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }
        </style>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== 连线（先画线） ===== -->
        <line x1="430" y1="100" x2="430" y2="128" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#sign-key-source-arrow)"/>
        <line x1="430" y1="184" x2="430" y2="212" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#sign-key-source-arrow)"/>

        <!-- 有有效记录 -> 取序号大者 -->
        <line x1="430" y1="304" x2="430" y2="332" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#sign-key-source-arrow)"/>
        <rect x="438" y="310" width="28" height="18" fill="#f5f5f5"/>
        <text class="s" x="452" y="324">有</text>

        <!-- 无 -> 回退 genesis -->
        <path d="M 552 260 L 744 260 Q 752 260 752 268 L 752 332"
              fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#sign-key-source-arrow)"/>
        <rect x="620" y="250" width="28" height="18" fill="#f5f5f5"/>
        <text class="s" x="634" y="264">无</text>

        <line x1="430" y1="388" x2="430" y2="416" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#sign-key-source-arrow)"/>
        <line x1="752" y1="388" x2="752" y2="416" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#sign-key-source-arrow)"/>

        <!-- ===== 节点 ===== -->
        <rect x="308" y="56" width="244" height="44" rx="22" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.8"/>
        <text class="n" x="430" y="84" text-anchor="middle">bootloader / app 启动</text>

        <rect x="280" y="128" width="300" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.75"/>
        <text class="n" x="296" y="152">读公钥记录（双槽乒乓）</text>
        <text class="m" x="296" y="171">W25Q128 扇区 132 / 133 · 0x084000 / 0x085000</text>

        <polygon points="430,214 552,260 430,306 308,260" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.8"/>
        <text class="n" x="430" y="256" text-anchor="middle">记录校验通过？</text>
        <text class="m" x="430" y="276" text-anchor="middle">IAPK 魔数 · 版本 · CRC32</text>

        <rect x="280" y="332" width="300" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.75"/>
        <text class="n" x="296" y="356">取写入序号大者</text>
        <text class="m" x="296" y="375">seq 最大者 · 32B 公钥进缓存</text>

        <rect x="602" y="332" width="300" height="56" rx="6" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.6"/>
        <text class="n" x="618" y="356">回退 genesis 公钥</text>
        <text class="m" x="618" y="375">s_genesis_pk · ROM 固化 32B</text>

        <rect x="280" y="416" width="300" height="52" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.6"/>
        <text class="m" x="430" y="438" text-anchor="middle">iap_key_from_flash() == 1</text>
        <text class="s" x="430" y="457" text-anchor="middle">启动打印：public key ... (from flash)</text>

        <rect x="602" y="416" width="300" height="52" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.6"/>
        <text class="m" x="752" y="438" text-anchor="middle">iap_key_from_flash() == 0</text>
        <text class="s" x="752" y="457" text-anchor="middle">启动打印：public key ... (genesis)</text>

        <!-- ===== 注释 ===== -->
        <text class="nt" x="60" y="530">改公钥不靠固件命令：PC 工具生成整条 64B 记录，</text>
        <text class="nt" x="60" y="552">用既有 spiflash write 分两条写入。记录坏了不要紧，</text>
        <text class="nt" x="60" y="574">genesis 是最后的锚点——它换了就必须重烧固件。</text>

        <!-- ===== 图例 ===== -->
        <line x1="56" y1="596" x2="924" y2="596" stroke="#2d3142" stroke-opacity="0.14" stroke-width="1"/>
        <text class="k" x="56" y="620">LEGEND</text>
        <rect x="136" y="608" width="14" height="12" rx="2" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.4"/>
        <text class="s" x="158" y="619">兜底路径：ROM 出厂锚点</text>
        <path d="M 344 614 L 380 614" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#sign-key-source-arrow)"/>
        <text class="s" x="390" y="619">状态判定与缓存</text>
      </svg>
