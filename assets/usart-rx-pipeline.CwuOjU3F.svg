<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-labelledby="rxTitle rxDesc" id="usart-rx-pipeline-root">
  <title id="rxTitle">串口接收的分层结构</title>
  <desc id="rxDesc">中断上下文只负责收字节并装配成行或交给字节流消费者，主循环上下文负责取行、取帧事件与执行命令。</desc>

  <rect x="0" y="0" width="940" height="430" fill="#f5f5f5"/>
  <defs>
    <marker id="usart-rx-pipeline-ra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d3142"/>
    </marker>
    <marker id="usart-rx-pipeline-rac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
    </marker>
  </defs>

  <text x="40" y="36" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="10" letter-spacing="2" fill="#4f5d75">RX PIPELINE</text>

  <!-- 中断上下文 -->
  <rect x="40" y="56" width="860" height="140" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="56" y="80" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#4f5d75">中断上下文（每字节 87 µs，只做 O(1)）</text>

  <rect x="60" y="96" width="200" height="76" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
  <text x="160" y="124" text-anchor="middle" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#2d3142">USART1 中断</text>
  <text x="160" y="146" text-anchor="middle" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75">取走 DR 并重新武装</text>

  <rect x="320" y="96" width="240" height="76" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
  <text x="440" y="124" text-anchor="middle" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#2d3142">行装配状态机</text>
  <text x="440" y="146" text-anchor="middle" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75">200 字节缓冲，严格 \r\n</text>

  <rect x="620" y="96" width="260" height="76" rx="6" fill="#f7e3dc" stroke="#bf4520" stroke-width="1.4"/>
  <text x="750" y="124" text-anchor="middle" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#2d3142">字节流消费者（可选）</text>
  <text x="750" y="146" text-anchor="middle" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75">iap_rx_byte：转到帧状态机</text>

  <path d="M 260 134 L 320 134" fill="none" stroke="#2d3142" stroke-width="1.4" marker-end="url(#usart-rx-pipeline-ra)"/>
  <path d="M 560 134 L 620 134" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#usart-rx-pipeline-rac)"/>
  <text x="590" y="124" text-anchor="middle" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#bf4520">sink</text>

  <!-- 主循环上下文 -->
  <rect x="40" y="252" width="860" height="140" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="56" y="276" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#4f5d75">主循环上下文（1 ms 一拍，可以慢）</text>

  <rect x="60" y="292" width="240" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="180" y="320" text-anchor="middle" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#2d3142">usart1_get_line()</text>
  <text x="180" y="342" text-anchor="middle" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75">取走整行，清完成标志</text>

  <rect x="340" y="292" width="240" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="460" y="320" text-anchor="middle" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#2d3142">iap_rx_poll()</text>
  <text x="460" y="342" text-anchor="middle" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75">上报帧事件、算 CRC32</text>

  <rect x="620" y="292" width="260" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="750" y="320" text-anchor="middle" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#2d3142">usart1_cmd_poll()</text>
  <text x="750" y="342" text-anchor="middle" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75">执行已识别的命令</text>

  <path d="M 440 172 L 180 292" fill="none" stroke="#2d3142" stroke-width="1.2" marker-end="url(#usart-rx-pipeline-ra)"/>
  <path d="M 750 172 L 460 292" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#usart-rx-pipeline-rac)"/>
  <path d="M 440 172 L 750 292" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#usart-rx-pipeline-ra)"/>

  <text x="40" y="416" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75">上行两条通道共用同一个字节入口：有 sink 时走帧状态机，没有 sink 时才拼行；命令识别始终并行进行。</text>
</svg>
