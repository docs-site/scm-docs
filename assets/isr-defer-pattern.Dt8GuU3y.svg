<svg id="isr-defer-pattern-root" viewBox="0 0 1280 612" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="isr-defer-pattern-title isr-defer-pattern-desc">
        <title id="isr-defer-pattern-title">ISR 置标志、主循环干重活的前后台分工</title>
        <desc id="isr-defer-pattern-desc">分层图：中断服务函数只做读数据寄存器、清中断标志、置 volatile 软件标志三件事，通过软件标志交接给主循环，解析、打印与长计算全部延后处理。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap');
      #isr-defer-pattern-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace; }
      #isr-defer-pattern-root { font-family: var(--font-sans); color: var(--color-ink); }</style>

          <marker id="isr-defer-pattern-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="isr-defer-pattern-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows -->
        <line x1="424" y1="236" x2="472" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#isr-defer-pattern-arrow)"/>
        <line x1="808" y1="236" x2="856" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#isr-defer-pattern-arrow)"/>
        <path d="M1024 288 V320 H648 Q640,320 640,328 V344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#isr-defer-pattern-arrow)"/>
        <line x1="640" y1="408" x2="640" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#isr-defer-pattern-arrow)"/>

        <!-- Arrow labels -->
        <rect x="648" y="424" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="680" y="436" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">轮询读取</text>

        <!-- ISR 条 -->
        <rect x="88" y="64" width="1104" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="88" y="64" width="1104" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="640" y="94" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace" text-anchor="middle">ISR · XXX_IRQHandler</text>
        <text x="640" y="118" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">只做三件事，做完立刻返回——耗时与数据内容无关，恒定 O(1)</text>

        <!-- 三件事 -->
        <rect x="88" y="184" width="336" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="88" y="184" width="336" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="256" y="222" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">① 读数据寄存器</text>
        <text x="256" y="250" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace" text-anchor="middle">USART1->DR / GPIO->IDR</text>

        <rect x="472" y="184" width="336" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="472" y="184" width="336" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="640" y="222" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">② 清中断标志</text>
        <text x="640" y="250" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">按参考手册要求的方式清</text>

        <rect x="856" y="184" width="336" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="856" y="184" width="336" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="1024" y="222" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">③ 置软件标志</text>
        <text x="1024" y="250" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace" text-anchor="middle">rx_done = 1;</text>

        <!-- 交接标志（focal） -->
        <rect x="472" y="344" width="336" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="472" y="344" width="336" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="640" y="370" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace" text-anchor="middle">volatile uint8_t rx_done</text>
        <text x="640" y="392" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">前后台的交接点——不加 volatile 主循环可能永远看不见</text>

        <!-- 主循环条 -->
        <rect x="88" y="456" width="1104" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="88" y="456" width="1104" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="640" y="490" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace" text-anchor="middle">while (1) { if (rx_done) { ... } }</text>
        <text x="640" y="518" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">解析 · 打印 · 长计算 · 状态机推进——重活全部延后到这里</text>

        <text x="88" y="586" fill="#5a6580" font-size="12" font-weight="400" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">重活延后，中断响应永远不被拖长；多字节数据先入缓冲区，主循环整批消费，避免 ISR 与主循环争抢同一份数据。</text>
      </svg>
