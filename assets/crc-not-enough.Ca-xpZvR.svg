<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crca-title crca-desc" id="crc-not-enough-root">
        <title id="crca-title">为什么 CRC 挡不住蓄意篡改</title>
        <desc id="crca-desc">上半部是正常链路：发送端算 CRC、接收端重算比对。下半部是攻击路径：截获帧、篡改载荷、用同一个公开算法重算 CRC 后填回，接收端校验依然通过，说明 CRC 只能证明字节没变错、不能证明字节是谁给的。</desc>
        <defs>
      <style>#crc-not-enough-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; }
      #crc-not-enough-root { font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--color-ink); }
      #crc-not-enough-root .diagram-container { width: 100%; overflow-x: auto; }
      #crc-not-enough-root .n { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
      #crc-not-enough-root .s { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
      #crc-not-enough-root .m { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
      #crc-not-enough-root .k { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
      #crc-not-enough-root .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }</style>
          <marker id="crc-not-enough-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="crc-not-enough-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <style>
          .n  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
          .s  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
          .m  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
          .k  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
          .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }
        </style>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== 连线（先画线） ===== -->
        <!-- 正常链路 -->
        <line x1="304" y1="128" x2="348" y2="128" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#crc-not-enough-arrow)"/>
        <line x1="592" y1="128" x2="636" y2="128" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#crc-not-enough-arrow)"/>

        <!-- 信道 -> 攻击者截获（虚线） -->
        <path d="M 470 160 L 470 244" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#crc-not-enough-arrow)"/>
        <rect x="478" y="192" width="44" height="18" fill="#f5f5f5"/>
        <text class="s" x="500" y="206">截获</text>

        <!-- 攻击链 -->
        <line x1="304" y1="300" x2="348" y2="300" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#crc-not-enough-arrow)"/>
        <line x1="592" y1="300" x2="636" y2="300" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#crc-not-enough-arrow)"/>

        <!-- 伪装帧 -> 接收端（accent 虚线向上） -->
        <line x1="784" y1="344" x2="784" y2="160" stroke="#bf4520" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#crc-not-enough-arrow-accent)"/>
        <rect x="792" y="248" width="108" height="18" fill="#f5f5f5"/>
        <text class="s" x="846" y="262" text-anchor="middle">校验依然通过</text>

        <!-- ===== 节点 ===== -->
        <!-- 上排：正常链路 -->
        <rect x="60" y="100" width="244" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.75"/>
        <text class="n" x="76" y="124">发送端</text>
        <text class="m" x="76" y="143">算 CRC32 · 填进帧头</text>

        <rect x="352" y="100" width="240" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.5"/>
        <text class="n" x="368" y="124">信道（局域网）</text>
        <text class="m" x="368" y="143">WiFi / 串口 / TCP</text>

        <rect x="640" y="100" width="244" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.75"/>
        <text class="n" x="656" y="124">接收端</text>
        <text class="m" x="656" y="143">重算比对 · 相等则收下</text>

        <!-- 下排：攻击链 -->
        <rect x="60" y="272" width="244" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.6"/>
        <text class="n" x="76" y="296">截获合法帧</text>
        <text class="m" x="76" y="315">帧头 CRC 是真值的</text>

        <rect x="352" y="272" width="240" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.6"/>
        <text class="n" x="368" y="296">篡改载荷</text>
        <text class="m" x="368" y="315">植入恶意代码 · 任意字节</text>

        <rect x="640" y="272" width="288" height="72" rx="6" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.6"/>
        <text class="n" x="656" y="298">用同一个公开算法重算 CRC</text>
        <text class="m" x="656" y="318">zlib 参数写在协议里 · 无需密钥</text>
        <text class="s" x="656" y="336">把新值填回帧头，一气呵成</text>

        <!-- ===== 注释 ===== -->
        <text class="nt" x="60" y="440">CRC 是一本任何人都读得懂的"说明书"：它只回答"字节变没变"，</text>
        <text class="nt" x="60" y="462">不回答"字节是谁给的"。要绑定"谁"，需要一个私钥才算得出的值。</text>

        <!-- ===== 图例 ===== -->
        <line x1="56" y1="512" x2="924" y2="512" stroke="#2d3142" stroke-opacity="0.14" stroke-width="1"/>
        <text class="k" x="56" y="536">LEGEND</text>
        <rect x="136" y="524" width="14" height="12" rx="2" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.4"/>
        <text class="s" x="158" y="535">CRC 失去意义的环节</text>
        <path d="M 356 530 L 392 530" fill="none" stroke="#bf4520" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#crc-not-enough-arrow-accent)"/>
        <text class="s" x="402" y="535">伪装帧的回流路径</text>
        <path d="M 568 530 L 604 530" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#crc-not-enough-arrow)"/>
        <text class="s" x="614" y="535">攻击者的介入点</text>
      </svg>
