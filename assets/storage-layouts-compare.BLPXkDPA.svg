<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="storage-layouts-compare-title storage-layouts-compare-desc" id="storage-layouts-compare-root">
        <title id="storage-layouts-compare-title">三种存储布局对比</title>
        <desc id="storage-layouts-compare-desc">三栏对比：A/B 双区把系统放两份、新固件写非活动区；Recovery 模式用独立最小系统在升级时刷写主系统；单区复制只留一个 App 区，新固件先落暂存区再覆盖。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap');
      #storage-layouts-compare-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace; }
      #storage-layouts-compare-root { font-family: var(--font-sans); color: var(--color-ink); }</style>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <text x="64" y="52" fill="#5a6580" font-size="13" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">A/B 双区</text>
        <text x="64" y="70" fill="#8a94a8" font-size="12" font-weight="400" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">掉电安全 · 回滚原生</text>

        <text x="440" y="52" fill="#5a6580" font-size="13" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">Recovery 模式</text>
        <text x="440" y="70" fill="#8a94a8" font-size="12" font-weight="400" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">升级期间不可用 · 不能回滚</text>

        <text x="816" y="52" fill="#5a6580" font-size="13" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">单区 + 暂存复制</text>
        <text x="816" y="70" fill="#8a94a8" font-size="12" font-weight="400" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">复制中掉电变砖 · 没有旧版本</text>

        <!-- 第一栏：A/B 双区 -->
        <rect x="64" y="88" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.24" stroke-width="1"/>
        <text x="80" y="112" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">Bootloader</text>
        <text x="80" y="130" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">16 KB</text>

        <rect x="64" y="152" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.24" stroke-width="1"/>
        <text x="80" y="176" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">系统 A</text>
        <text x="80" y="194" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">运行中</text>

        <rect x="64" y="216" width="320" height="56" rx="6" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/>
        <text x="80" y="240" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">系统 B</text>
        <text x="80" y="258" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">写入中，新固件落这里</text>

        <rect x="64" y="280" width="320" height="56" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-opacity="0.45" stroke-width="1"/>
        <text x="80" y="304" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">参数区</text>
        <text x="80" y="322" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">"下次启 B" 标志</text>

        <!-- 第二栏：Recovery -->
        <rect x="440" y="88" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.24" stroke-width="1"/>
        <text x="456" y="112" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">Bootloader</text>
        <text x="456" y="130" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">16 KB</text>

        <rect x="440" y="152" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.24" stroke-width="1"/>
        <text x="456" y="176" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">Recovery 系统</text>
        <text x="456" y="194" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">最小系统，升级时进入</text>

        <rect x="440" y="216" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.24" stroke-width="1"/>
        <text x="456" y="240" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">主系统</text>
        <text x="456" y="258" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">被 Recovery 擦写</text>

        <!-- 第三栏：单区 + 暂存 -->
        <rect x="816" y="88" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.24" stroke-width="1"/>
        <text x="832" y="112" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">Bootloader</text>
        <text x="832" y="130" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">16 KB</text>

        <rect x="816" y="152" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.28" stroke-width="1"/>
        <text x="832" y="176" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">App 区（唯一）</text>
        <text x="832" y="194" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">单一链接地址，被覆盖</text>

        <rect x="816" y="216" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.24" stroke-width="1"/>
        <text x="832" y="240" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">暂存区</text>
        <text x="832" y="258" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">新固件先落到这儿</text>
</svg>
