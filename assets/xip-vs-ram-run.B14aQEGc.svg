<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="xip-vs-ram-run-title xip-vs-ram-run-desc" id="xip-vs-ram-run-root">
        <title id="xip-vs-ram-run-title">XIP 执行与 RAM 运行的地址关系</title>
        <desc id="xip-vs-ram-run-desc">对比图：XIP 方案下两个槽位各自绑定运行地址、需要编译两份镜像；RAM 运行方案下两个槽位仅作存储，由 Bootloader 拷贝到固定 RAM 地址运行。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #xip-vs-ram-run-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace; }
      #xip-vs-ram-run-root { font-family: var(--font-sans); color: var(--color-ink); }
      #xip-vs-ram-run-root .diagram-container { width: 100%; overflow-x: auto; }
      #xip-vs-ram-run-root .diagram-container { overflow-x: visible; }</style>
          <marker id="xip-vs-ram-run-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="xip-vs-ram-run-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="xip-vs-ram-run-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="40" y="100" width="580" height="520" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="68" y="104" width="80" height="16" rx="2" fill="#f5f5f5"/>
        <text x="108" y="116" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">XIP 就地执行</text>

        <rect x="660" y="100" width="580" height="520" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="688" y="104" width="80" height="16" rx="2" fill="#f5f5f5"/>
        <text x="728" y="116" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">RAM 运行</text>

        <!-- Arrows: left panel -->
        <line x1="200" y1="264" x2="200" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#xip-vs-ram-run-arrow)"/>
        <line x1="460" y1="264" x2="460" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#xip-vs-ram-run-arrow)"/>
        <rect x="212" y="332" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="236" y="344" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">取指</text>
        <rect x="472" y="332" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="496" y="344" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">取指</text>

        <!-- Arrows: right panel -->
        <line x1="820" y1="264" x2="820" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#xip-vs-ram-run-arrow)"/>
        <line x1="1080" y1="264" x2="1080" y2="416" stroke="#bf4520" stroke-width="1.4" marker-end="url(#xip-vs-ram-run-arrow-accent)"/>
        <rect x="832" y="332" width="96" height="16" rx="2" fill="#f5f5f5"/>
        <text x="880" y="344" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">拷贝</text>
        <rect x="1092" y="332" width="144" height="16" rx="2" fill="#f5f5f5"/>
        <text x="1164" y="344" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Bootloader 拷贝</text>

        <!-- Left: 槽 A 镜像 -->
        <rect x="90" y="200" width="220" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="90" y="200" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="200" y="226" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">镜像 A</text>
        <text x="200" y="246" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">链接地址 0x08004000</text>

        <!-- Left: 槽 B 镜像 -->
        <rect x="350" y="200" width="220" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="350" y="200" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="460" y="226" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">镜像 B</text>
        <text x="460" y="246" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">链接地址 0x08040000</text>

        <!-- Left: CPU 就地取指 -->
        <rect x="90" y="416" width="480" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="90" y="416" width="480" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="330" y="442" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">CPU 就地取指执行</text>
        <text x="330" y="462" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">运行地址 = 存储地址，两个槽位各需一份镜像</text>

        <!-- Right: 槽 A 镜像（仅存储） -->
        <rect x="710" y="200" width="220" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="710" y="200" width="220" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="820" y="226" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">槽 A 中的镜像</text>
        <text x="820" y="246" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">仅作存储</text>

        <!-- Right: 槽 B 镜像（仅存储） -->
        <rect x="970" y="200" width="220" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="970" y="200" width="220" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="1080" y="226" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">槽 B 中的镜像</text>
        <text x="1080" y="246" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">仅作存储</text>

        <!-- Right: RAM 运行区 (focal) -->
        <rect x="710" y="416" width="480" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="710" y="416" width="480" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="950" y="442" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">RAM 运行区</text>
        <text x="950" y="462" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">单一链接地址，存储位置与运行地址解耦</text>
      </svg>
