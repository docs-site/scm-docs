<?xml version="1.0" encoding="UTF-8"?>

<svg id="iap-jump-architecture-root" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iap-jump-architecture-title iap-jump-architecture-desc">
        <title id="iap-jump-architecture-title">IAP 跳转的存储布局与取值路径</title>
        <desc id="iap-jump-architecture-desc">架构图：展示 STM32 内部 FLASH 中 Bootloader 与 APP 两张中断向量表的布局，以及硬件复位取向量与 IAP 软件跳转时内核 MSP、PC、VTOR 的取值路径。</desc>
        <defs>
          <marker id="iap-jump-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="iap-jump-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="iap-jump-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- FLASH zone -->
        <rect x="360" y="80" width="544" height="320" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="384" y="84" width="124" height="12" rx="2" fill="#f5f5f5"/>
        <text x="392" y="93" fill="#5a6580" font-size="10" font-family="'Geist Mono',ui-monospace,monospace" letter-spacing="0.14em">INTERNAL FLASH</text>

        <!-- Arrows -->
        <path d="M 392,184 H 256 Q 248,184 248,192 V 232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#iap-jump-architecture-arrow)"/>
        <path d="M 392,320 H 272" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#iap-jump-architecture-arrow-accent)"/>
        <path d="M 272,352 H 392" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#iap-jump-architecture-arrow)"/>
        <path d="M 168,408 V 452 Q 168,460 176,460 H 392" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#iap-jump-architecture-arrow)"/>

        <!-- Arrow labels -->
        <rect x="278" y="160" width="92" height="16" rx="2" fill="#f5f5f5"/>
        <text x="324" y="171" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">硬件复位取向量</text>
        <rect x="286" y="296" width="92" height="16" rx="2" fill="#f5f5f5"/>
        <text x="332" y="307" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">软件跳转取向量</text>
        <rect x="296" y="360" width="72" height="16" rx="2" fill="#f5f5f5"/>
        <text x="332" y="371" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">设置 VTOR</text>
        <rect x="248" y="432" width="88" height="16" rx="2" fill="#f5f5f5"/>
        <text x="292" y="443" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">MSP 指向栈顶</text>

        <!-- Kernel node -->
        <rect x="64" y="232" width="208" height="176" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="232" width="208" height="176" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="168" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">Cortex-M3 内核</text>
        <line x1="88" y1="284" x2="248" y2="284" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
        <text x="88" y="312" fill="#4f5d75" font-size="11" font-family="'Geist Mono',ui-monospace,monospace">MSP</text>
        <text x="132" y="312" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">主栈指针</text>
        <text x="88" y="340" fill="#4f5d75" font-size="11" font-family="'Geist Mono',ui-monospace,monospace">PC</text>
        <text x="132" y="340" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">程序计数器</text>
        <text x="88" y="368" fill="#4f5d75" font-size="11" font-family="'Geist Mono',ui-monospace,monospace">VTOR</text>
        <text x="132" y="368" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">向量表基址</text>

        <!-- Bootloader vector table (store) -->
        <rect x="392" y="136" width="232" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="392" y="136" width="232" height="96" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <text x="508" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">Bootloader 向量表</text>
        <text x="508" y="188" fill="#4f5d75" font-size="11" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">0X08000000</text>
        <text x="508" y="208" fill="#5a6580" font-size="11" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">+0X00 MSP</text>
        <text x="508" y="224" fill="#5a6580" font-size="11" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">+0X04 RESET</text>

        <!-- Bootloader code (backend) -->
        <rect x="648" y="136" width="224" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="648" y="136" width="224" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="760" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">Bootloader 程序</text>
        <text x="760" y="196" fill="#4f5d75" font-size="11" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">main() → IAP</text>

        <!-- APP vector table (focal) -->
        <rect x="392" y="272" width="232" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="392" y="272" width="232" height="96" rx="6" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1.2"/>
        <text x="508" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">APP 向量表</text>
        <text x="508" y="324" fill="#4f5d75" font-size="11" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">0X08000000 + X</text>
        <text x="508" y="344" fill="#5a6580" font-size="11" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">+0X00 MSP</text>
        <text x="508" y="360" fill="#5a6580" font-size="11" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">+0X04 RESET</text>

        <!-- APP code (backend) -->
        <rect x="648" y="272" width="224" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="648" y="272" width="224" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="760" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">APP 程序</text>
        <text x="760" y="332" fill="#4f5d75" font-size="11" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">Reset_Handler → main()</text>

        <!-- SRAM node (store) -->
        <rect x="392" y="432" width="232" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="392" y="432" width="232" height="56" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <text x="508" y="456" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">SRAM · APP 栈区</text>
        <text x="508" y="474" fill="#4f5d75" font-size="11" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">0X20000000</text>

        <!-- Legend -->
        <line x1="64" y1="540" x2="896" y2="540" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="64" y="560" fill="#4f5d75" font-size="10" font-family="'Geist Mono',ui-monospace,monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="170" y1="556" x2="202" y2="556" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="212" y="560" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">硬件复位路径</text>
        <line x1="330" y1="556" x2="362" y2="556" stroke="#bf4520" stroke-width="1.2"/>
        <text x="372" y="560" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">软件跳转路径</text>
        <line x1="490" y1="556" x2="522" y2="556" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="532" y="560" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">配置 / 指向</text>
      </svg>
