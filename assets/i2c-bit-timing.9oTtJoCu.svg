<?xml version="1.0" encoding="UTF-8"?>
  <svg viewBox="0 0 940 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="i2c-bit-title i2c-bit-desc">
    <title id="i2c-bit-title">I2C 一位数据的相位与一个字节的 9 个脉冲</title>
    <desc id="i2c-bit-desc">上栏放大一位数据: SCL 由主机产生, 从机在 SCL 低电平期间换位, 主机在 SCL 高电平期间采样; 下栏一个字节共 9 个脉冲, 前 8 位由从机驱动 SDA, 第 9 位由主机回应。</desc>
    <rect width="100%" height="100%" fill="#fbfaf8"/>
    <text x="96" y="52" fill="#2d3142" font-size="13" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="start" font-weight="600">① 一位数据（放大）· SCL 由主机产生</text>
    <rect x="300" y="100" width="260" height="125" fill="#3451b2" fill-opacity="0.05"/>
    <text x="430" y="92" fill="#3451b2" font-size="12" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">采样窗口：SCL 高电平期间数据有效</text>
    <text x="76" y="129" fill="#2d3142" font-size="12" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" text-anchor="end" font-weight="600">SCL</text>
    <text x="76" y="204" fill="#2d3142" font-size="12" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" text-anchor="end" font-weight="600">SDA</text>
    <polyline points="96,140 300,140 300,110 560,110 560,140 860,140" fill="none" stroke="#4f5d75" stroke-width="1.5"/>
    <polyline points="96,185 200,185 200,215 620,215 620,185 860,185" fill="none" stroke="#2d3142" stroke-width="1.5"/>
    <line x1="200" y1="179" x2="200" y2="229" stroke="#bf4520" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.55"/>
    <text x="200" y="249" fill="#bf4520" font-size="12" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">从机在此换位</text>
    <line x1="620" y1="179" x2="620" y2="229" stroke="#bf4520" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.55"/>
    <text x="620" y="249" fill="#bf4520" font-size="12" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">从机在此换位</text>
    <circle cx="430" cy="215" r="4" fill="#3451b2"/>
    <text x="444" y="206" fill="#3451b2" font-size="12" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="start">主机读到 0</text>
    <text x="96" y="292" fill="#2d3142" font-size="13" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="start" font-weight="600">② 一个字节 = 9 个脉冲</text>
    <rect x="96" y="300" width="576" height="106" fill="#3451b2" fill-opacity="0.05"/>
    <rect x="672" y="300" width="72" height="106" fill="#bf4520" fill-opacity="0.06"/>
    <text x="76" y="336" fill="#2d3142" font-size="12" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" text-anchor="end" font-weight="600">SCL</text>
    <text x="76" y="388" fill="#2d3142" font-size="12" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" text-anchor="end" font-weight="600">SDA</text>
    <polyline points="96,344 128,344 128,320 168,320 168,344 200,344 200,320 240,320 240,344 272,344 272,320 312,320 312,344 344,344 344,320 384,320 384,344 416,344 416,320 456,320 456,344 488,344 488,320 528,320 528,344 560,344 560,320 600,320 600,344 632,344 632,320 672,320 672,344 704,344 704,320 744,320 744,344" fill="none" stroke="#4f5d75" stroke-width="1.5"/>
    <polyline points="96,396 112,396 112,372 168,372 184,372 184,396 240,396 256,396 256,372 312,372 384,372 400,372 400,396 456,396 528,396 544,396 544,372 600,372 672,372 688,372 688,396 744,396" fill="none" stroke="#2d3142" stroke-width="1.5"/>
    <text x="384" y="426" fill="#3451b2" font-size="12" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">前 8 位：从机驱动 SDA</text>
    <text x="708" y="426" fill="#bf4520" font-size="12" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">第 9 位：主机回 ACK</text>
  </svg>
