<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sgnp-title sgnp-desc" id="sign-pipeline-root">
        <title id="sgnp-title">全链路三处验签点</title>
        <desc id="sgnp-desc">PC 用私钥对帧签名，经串口、TCP 或 WiFi-TFTP 三条通道进入设备；设备在收帧校验、下载落槽前、go flash 擦写前三处验同一个签名，任何一处失败，后续动作都不会发生。</desc>
        <defs>
      <style>#sign-pipeline-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; }
      #sign-pipeline-root { font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--color-ink); }
      #sign-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      #sign-pipeline-root .n { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
      #sign-pipeline-root .s { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
      #sign-pipeline-root .m { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
      #sign-pipeline-root .k { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
      #sign-pipeline-root .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }</style>
          <marker id="sign-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="sign-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <style>
          .n  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
          .s  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
          .m  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
          .k  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
          .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }
        </style>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== 连线（先画线） ===== -->
        <!-- PC -> 通道 -->
        <line x1="252" y1="144" x2="300" y2="144" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#sign-pipeline-arrow)"/>
        <rect x="258" y="118" width="36" height="18" fill="#f5f5f5"/>
        <text class="s" x="276" y="132" text-anchor="middle">签名帧</text>

        <!-- 通道 -> 三道关（扇出，独立接入点） -->
        <line x1="492" y1="156" x2="556" y2="156" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#sign-pipeline-arrow)"/>
        <path d="M 492 196 L 528 196 Q 536 196 536 204 L 536 272 Q 536 280 544 280 L 556 280"
              fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#sign-pipeline-arrow)"/>
        <path d="M 492 228 L 508 228 Q 516 228 516 236 L 516 396 Q 516 404 524 404 L 556 404"
              fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#sign-pipeline-arrow)"/>

        <!-- 三道关依次串联 -->
        <line x1="736" y1="192" x2="736" y2="244" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#sign-pipeline-arrow)"/>
        <line x1="736" y1="316" x2="736" y2="368" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#sign-pipeline-arrow)"/>
        <line x1="736" y1="440" x2="736" y2="480" stroke="#bf4520" stroke-width="1.6" marker-end="url(#sign-pipeline-arrow-accent)"/>

        <!-- ===== 节点 ===== -->
        <!-- PC 侧 -->
        <rect x="44" y="116" width="208" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.75"/>
        <text class="n" x="60" y="140">PC 签发工具</text>
        <text class="m" x="60" y="159">iap_keygen.py · pack_iap.py</text>

        <rect x="44" y="196" width="208" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.5"/>
        <text class="n" x="60" y="220">私钥留在仓库之外</text>
        <text class="m" x="60" y="239">keys/iap_priv.pem</text>

        <!-- 通道 -->
        <rect x="300" y="136" width="192" height="112" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.6"/>
        <text class="n" x="316" y="164">传输通道</text>
        <text class="m" x="316" y="186">串口 USART1</text>
        <text class="m" x="316" y="206">TCP :8888</text>
        <text class="m" x="316" y="226">WiFi TFTP :69</text>

        <!-- 三道关 -->
        <rect x="556" y="120" width="360" height="72" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.75"/>
        <text class="n" x="572" y="146">① 收帧校验（bootloader）</text>
        <text class="m" x="572" y="166">iap_rx_poll · CRC32 → 验签</text>
        <text class="s" x="572" y="184">串口 / TCP / TFTP 三条通道共用一套状态机</text>

        <rect x="556" y="244" width="360" height="72" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.75"/>
        <text class="n" x="572" y="270">② 下载落槽前（app）</text>
        <text class="m" x="572" y="290">atk_mw8266d_net_img_verify</text>
        <text class="s" x="572" y="308">验签通过才写外部 Flash 槽并置 pending</text>

        <rect x="556" y="368" width="360" height="72" rx="6" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.6"/>
        <text class="n" x="572" y="394">③ go flash 擦写前（bootloader）</text>
        <text class="m" x="572" y="414">svc_install_pending · 七项校验的最后一关</text>
        <text class="s" x="572" y="432">验签通过才允许擦写内部 Flash 0x08020000</text>

        <!-- 终点 -->
        <rect x="556" y="480" width="360" height="56" rx="24" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.8"/>
        <text class="n" x="736" y="504" text-anchor="middle">写内部 Flash 并跳转</text>
        <text class="m" x="736" y="522" text-anchor="middle">运行位置 = 落盘位置 = 被验过的那 N 字节</text>

        <!-- ===== 注释 ===== -->
        <text class="nt" x="44" y="520">三道关验的是同一个签名：换个角度看，</text>
        <text class="nt" x="44" y="542">这是"传输后""存储后""即将执行前"的三次点名。</text>

        <!-- ===== 图例 ===== -->
        <line x1="56" y1="568" x2="924" y2="568" stroke="#2d3142" stroke-opacity="0.14" stroke-width="1"/>
        <text class="k" x="56" y="592">LEGEND</text>
        <rect x="136" y="580" width="14" height="12" rx="2" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.4"/>
        <text class="s" x="158" y="591">最后一道关：过了它才碰内部 Flash</text>
        <path d="M 468 586 L 504 586" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#sign-pipeline-arrow)"/>
        <text class="s" x="514" y="591">签名帧的流向</text>
      </svg>
