<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-labelledby="landevices-title landevices-desc">
<title id="landevices-title">三种接法与它们的转发依据</title>
<desc id="landevices-desc">三种接法与它们的转发依据</desc>
<rect width="1000" height="580" fill="#f5f5f5"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d75"/></marker>
<marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#bf4520"/></marker>
</defs>
<text x="40" y="46" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#2d3142" text-anchor="start" xml:space="preserve">三种接法与它们的转发依据</text>
<text x="40" y="70" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start" xml:space="preserve">接法不同，决定数据靠什么转发；只有路由器能跨网段</text>
<rect x="40" y="120" width="110" height="56" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="95.0" y="152.5968" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">网线直连</text>
<rect x="170" y="120" width="130" height="56" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="235.0" y="140.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">板子</text>
<text x="235.0" y="163.9032" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">192.168.16.30</text>
<path d="M302 148 L498 148" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="690" y="113" width="270" height="70" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="825.0" y="152.2432" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle" xml:space="preserve">同网段 · 不需网关 · 不能上网</text>
<text x="400" y="112" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle" xml:space="preserve">网线直连</text>
<rect x="40" y="240" width="110" height="56" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="95.0" y="272.59680000000003" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">经交换机</text>
<rect x="170" y="240" width="130" height="56" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="235.0" y="260.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">板子</text>
<text x="235.0" y="283.90319999999997" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">192.168.16.30</text>
<path d="M302 268 L348 268" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="350" y="240" width="130" height="56" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="415.0" y="260.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">交换机</text>
<text x="415.0" y="283.90319999999997" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">按 MAC 表转发</text>
<path d="M482 268 L528 268" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="530" y="240" width="130" height="56" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="595.0" y="260.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">PC</text>
<text x="595.0" y="283.90319999999997" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">192.168.16.100</text>
<rect x="690" y="233" width="270" height="70" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="825.0" y="272.24319999999994" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle" xml:space="preserve">同网段 · 不需网关 · 不能上网</text>
<rect x="40" y="360" width="110" height="56" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="95.0" y="392.59680000000003" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">经路由器</text>
<rect x="170" y="360" width="130" height="56" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="235.0" y="380.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">板子</text>
<text x="235.0" y="403.90319999999997" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">192.168.16.30</text>
<path d="M302 388 L348 388" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="350" y="360" width="130" height="56" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="415.0" y="380.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">路由器</text>
<text x="415.0" y="403.90319999999997" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">按路由表转发</text>
<path d="M482 388 L528 388" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="530" y="360" width="130" height="56" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="595.0" y="380.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">PC</text>
<text x="595.0" y="403.90319999999997" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">192.168.1.100</text>
<rect x="690" y="353" width="270" height="70" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="825.0" y="392.24319999999994" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle" xml:space="preserve">可跨网段 · 出网需网关 · 可上网</text>
<rect x="40" y="460" width="920" height="76" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1" stroke-dasharray="4,3"/>
<text x="500.0" y="490.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle" xml:space="preserve">交换机不隔离广播，所以同一台交换机下面就是同一个网段（同一个广播域）</text>
<text x="500.0" y="513.9032000000001" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">只有路由器能隔离广播域——这就是「一个网段」的划分依据</text>
</svg>
