<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 470" role="img" aria-labelledby="da-title da-desc" xmlns="http://www.w3.org/2000/svg" id="dp-ap-access-root">
  <title id="da-title">通过 AHB-AP 读目标内存的三步</title>
  <desc id="da-desc">先在 DP 的 SELECT 里选中 AP 与 bank，再依次写 CSW、TAR、DRW 完成一次 32 位读写，读数据需从 RDBUFF 取回</desc>

  <defs>
      <style>#dp-ap-access-root .title { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 20px; font-weight: 600; fill: #2d3142; }
      #dp-ap-access-root .sub { font-family: "Microsoft YaHei", sans-serif; font-size: 12px; fill: #78828f; }
      #dp-ap-access-root .box { fill: #ffffff; stroke: #ccd2da; stroke-width: 1.2; }
      #dp-ap-access-root .ap { fill: #f7f8fa; stroke: #ccd2da; stroke-width: 1.2; }
      #dp-ap-access-root .focal { fill: #fdf1ec; stroke: #bf4520; stroke-width: 1.4; }
      #dp-ap-access-root .name { font-family: "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
      #dp-ap-access-root .mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: #4f5d75; }
      #dp-ap-access-root .step { font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: #bf4520; }
      #dp-ap-access-root .note { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 12.5px; fill: #4f5d75; }</style>
    <marker id="dp-ap-access-da-ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#9aa4b2"/>
    </marker>
  </defs>

  <text class="title" x="24" y="38">通过 AHB-AP 读目标内存的三步</text>
  <text class="sub" x="896" y="38" text-anchor="end">DP 选路 → CSW 定宽 → TAR 定址 → DRW 触发</text>

  <!-- 步骤前的 DP 选择 -->
  <rect class="box" x="24" y="88" width="872" height="46" rx="6"/>
  <text class="mono" x="44" y="116">DP.SELECT = APSEL(0 = AHB-AP) + APBANKSEL(0..3)</text>
  <text class="sub" x="740" y="116">先选路，后访问</text>

  <!-- 四步 -->
  <rect class="ap" x="24" y="176" width="200" height="96" rx="6"/>
  <text class="step" x="40" y="198">STEP 1</text>
  <text class="name" x="40" y="222">CSW</text>
  <text class="sub" x="40" y="244">控制：32 位宽 / 地址自增</text>
  <text class="mono" x="40" y="262">0x2300_0012</text>

  <line x1="224" y1="224" x2="256" y2="224" stroke="#9aa4b2" stroke-width="1.3" marker-end="url(#dp-ap-access-da-ar)"/>

  <rect class="ap" x="260" y="176" width="200" height="96" rx="6"/>
  <text class="step" x="276" y="198">STEP 2</text>
  <text class="name" x="276" y="222">TAR</text>
  <text class="sub" x="276" y="244">写入目标地址</text>
  <text class="mono" x="276" y="262">例 0x0800_0000</text>

  <line x1="460" y1="224" x2="492" y2="224" stroke="#9aa4b2" stroke-width="1.3" marker-end="url(#dp-ap-access-da-ar)"/>

  <rect class="focal" x="496" y="176" width="200" height="96" rx="6"/>
  <text class="step" x="512" y="198">STEP 3</text>
  <text class="name" x="512" y="222">DRW</text>
  <text class="sub" x="512" y="244">读：发起一次读访问</text>
  <text class="sub" x="512" y="262">写：数据立即送出</text>

  <line x1="696" y1="224" x2="728" y2="224" stroke="#9aa4b2" stroke-width="1.3" marker-end="url(#dp-ap-access-da-ar)"/>

  <rect class="box" x="732" y="176" width="164" height="96" rx="6"/>
  <text class="name" x="748" y="204">AHB 传输</text>
  <text class="sub" x="748" y="228">AP 作为主设备</text>
  <text class="sub" x="748" y="248">在总线上完成</text>

  <!-- 读回路径 -->
  <path d="M814 272 V300 H596 V272" fill="none" stroke="#9aa4b2" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#dp-ap-access-da-ar)"/>
  <rect x="626" y="274" width="180" height="16" fill="#fafafa"/>
  <text class="sub" x="716" y="287" text-anchor="middle">读数据，从 RDBUFF 取回</text>

  <!-- 编者按 -->
  <line x1="24" y1="336" x2="896" y2="336" stroke="#dde2e8" stroke-width="1"/>
  <text class="note" x="24" y="360">写 DRW 的那一刻才真正产生 AHB 传输；CSW 与 TAR 只是把配置装进 AP，不产生总线动作。</text>
  <text class="note" x="24" y="382">AP 读是 posted 的：读 DRW 只发起访问，数据要从 DP 的 RDBUFF（0x0C）读回，否则拿到的是上一次的结果。</text>
  <text class="note" x="24" y="404">CSW 打开地址自增后，连续读一块内存只需写一次 TAR，反复读 DRW 即可——这就是调试器刷内存窗口的方式。</text>
  <text class="note" x="24" y="426">WAIT 应答（0b010）表示 AP 忙：目标在低功耗或被长事务占用，调试器会自动重试，连续 FAULT 才是真错误。</text>
</svg>
