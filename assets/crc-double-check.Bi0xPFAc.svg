<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crcd-title crcd-desc" id="crc-double-check-root">
        <title id="crcd-title">IAP 链路里的双层 CRC 防线</title>
        <desc id="crcd-desc">app.img 从打包到写入内部 Flash 要过两层 CRC：传输层的帧内载荷 CRC 挡链路误码，存储层的整帧 CRC 与升级记录比对，挡外部 Flash 槽内比特腐烂与掉电残缺。</desc>
        <defs>
      <style>#crc-double-check-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; }
      #crc-double-check-root { font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--color-ink); }
      #crc-double-check-root .diagram-container { width: 100%; overflow-x: auto; }
      #crc-double-check-root .n { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
      #crc-double-check-root .s { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
      #crc-double-check-root .m { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
      #crc-double-check-root .k { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
      #crc-double-check-root .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }
      #crc-double-check-root .tag { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #bf4520; }</style>
          <marker id="crc-double-check-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="crc-double-check-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <style>
          .n  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
          .s  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
          .m  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
          .k  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
          .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }
          .tag { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #bf4520; }
        </style>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== 连线（先画线） ===== -->
        <line x1="490" y1="108" x2="490" y2="136" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#crc-double-check-arrow)"/>
        <line x1="490" y1="192" x2="490" y2="220" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#crc-double-check-arrow)"/>
        <line x1="490" y1="276" x2="490" y2="304" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#crc-double-check-arrow)"/>
        <line x1="490" y1="360" x2="490" y2="388" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#crc-double-check-arrow)"/>
        <line x1="490" y1="444" x2="490" y2="472" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#crc-double-check-arrow)"/>

        <!-- 层1 侧框连线 -->
        <line x1="650" y1="248" x2="708" y2="248" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#crc-double-check-arrow)"/>
        <!-- 层2 侧框连线 -->
        <line x1="650" y1="416" x2="708" y2="416" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#crc-double-check-arrow)"/>

        <!-- ===== 节点 ===== -->
        <rect x="330" y="60" width="320" height="48" rx="24" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.8"/>
        <text class="n" x="490" y="82" text-anchor="middle">PC 打包：算出载荷 CRC</text>
        <text class="m" x="490" y="99" text-anchor="middle">pack_iap.py · 写进帧头偏移 12</text>

        <rect x="330" y="136" width="320" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.6"/>
        <text class="n" x="346" y="160">传输：WiFi / 串口 / TCP</text>
        <text class="m" x="346" y="179">误码在此发生 · 概率低但非零</text>

        <rect x="330" y="220" width="320" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.75"/>
        <text class="n" x="346" y="244">app 下载校验</text>
        <text class="m" x="346" y="263">重算载荷 CRC ↔ 帧头声明值</text>

        <rect x="330" y="304" width="320" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.75"/>
        <text class="n" x="346" y="328">写外部 Flash 槽 + 记账</text>
        <text class="m" x="346" y="347">整帧 CRC 存入升级记录 img_crc32</text>

        <rect x="330" y="388" width="320" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.75"/>
        <text class="n" x="346" y="412">go flash 搬运校验</text>
        <text class="m" x="346" y="431">载荷 CRC + 整帧 CRC ↔ 记录值</text>

        <rect x="330" y="472" width="320" height="56" rx="24" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.6"/>
        <text class="n" x="490" y="496" text-anchor="middle">写内部 Flash 0x08020000</text>
        <text class="m" x="490" y="515" text-anchor="middle">双重校验都通过才执行</text>

        <!-- 层1 侧框 -->
        <rect x="712" y="220" width="216" height="60" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.5"/>
        <text class="tag" x="728" y="240">LAYER 1 · 传输</text>
        <text class="s" x="728" y="262">拦链路误码：位翻转、断包</text>

        <!-- 层2 侧框 -->
        <rect x="712" y="388" width="216" height="60" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.5"/>
        <text class="tag" x="728" y="408">LAYER 2 · 存储</text>
        <text class="s" x="728" y="430">拦槽内腐烂：掉电残缺、位衰减</text>

        <!-- ===== 注释 ===== -->
        <text class="nt" x="60" y="250">两层用的都是同一个</text>
        <text class="nt" x="60" y="272">逐位 CRC32，只是覆盖的</text>
        <text class="nt" x="60" y="294">字节范围不同。</text>

        <!-- ===== 图例 ===== -->
        <line x1="56" y1="600" x2="924" y2="600" stroke="#2d3142" stroke-opacity="0.14" stroke-width="1"/>
        <text class="k" x="56" y="624">LEGEND</text>
        <rect x="136" y="612" width="14" height="12" rx="2" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.4"/>
        <text class="s" x="158" y="623">双重校验通过后的动作</text>
        <path d="M 364 618 L 400 618" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#crc-double-check-arrow)"/>
        <text class="s" x="410" y="623">该步骤所属防线</text>
        <path d="M 588 618 L 624 618" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#crc-double-check-arrow)"/>
        <text class="s" x="634" y="623">镜像的旅程</text>
      </svg>
