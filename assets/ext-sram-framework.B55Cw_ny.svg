<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="700" viewBox="0 0 1020 700" role="img" aria-labelledby="extsramFrameworkTitle extsramFrameworkDesc" id="ext-sram-framework-root">
  <title id="extsramFrameworkTitle">外部 SRAM-APP 的硬件框架与装载路径</title>
  <desc id="extsramFrameworkDesc">Cortex-M3 经 ICode/DCode 执行 Bootloader、经 System 总线访问 FSMC；暂存区镜像由 go sram 搬运到 NE3 外部 SRAM 执行，与 NE2 的 DM9000 共享读/写控制线。</desc>

  <rect x="0" y="0" width="1020" height="700" fill="#f5f5f5"/>
  <defs>
    <marker id="ext-sram-framework-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/>
    </marker>
    <marker id="ext-sram-framework-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
    </marker>
  </defs>

  <text x="40" y="36" font-family="'Geist Mono','Consolas',monospace" font-size="12" letter-spacing="2" fill="#4f5d75">LV065 · EXT-SRAM APP · FRAMEWORK</text>
  <text x="40" y="66" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#2d3142">外部 SRAM-APP 的硬件框架与装载路径</text>

  <!-- 连接线层：先画线，后画盒子 -->
  <g fill="none">
    <path d="M 360 176 L 360 216 L 180 216 L 180 252" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#ext-sram-framework-arrow)"/>
    <path d="M 480 176 L 480 252" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#ext-sram-framework-arrow)"/>
    <path d="M 620 176 L 620 216 L 830 216 L 830 252" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#ext-sram-framework-arrow)"/>
    <path d="M 740 356 L 740 400 L 655 400 L 655 436" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#ext-sram-framework-arrow)"/>
    <path d="M 830 356 L 830 436" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#ext-sram-framework-arrow)"/>
    <path d="M 180 356 L 180 644 L 870 644 L 870 534" stroke="#bf4520" stroke-width="1.8" marker-end="url(#ext-sram-framework-arrow-accent)"/>
    <path d="M 960 470 L 990 470 L 990 190 L 704 190" stroke="#bf4520" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ext-sram-framework-arrow-accent)"/>
  </g>

  <!-- 节点层 -->
  <g font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif">
    <rect x="300" y="96" width="400" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="320" y="126" font-size="13" font-weight="600" fill="#2d3142">Cortex-M3 内核</text>
    <text x="320" y="150" font-family="'Geist Mono','Consolas',monospace" font-size="12" fill="#4f5d75">ICode / DCode / System 三组总线接口</text>

    <rect x="40" y="256" width="280" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="60" y="284" font-size="13" font-weight="600" fill="#2d3142">内部 FLASH · 512KB</text>
    <text x="60" y="308" font-family="'Geist Mono','Consolas',monospace" font-size="12" fill="#4f5d75">Bootloader 0x08000000 · 128KB</text>
    <text x="60" y="330" font-family="'Geist Mono','Consolas',monospace" font-size="12" fill="#4f5d75">暂存区 0x08040000 · ≤256KB</text>

    <rect x="380" y="256" width="250" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="400" y="284" font-size="13" font-weight="600" fill="#2d3142">内部 SRAM · 64KB</text>
    <text x="400" y="308" font-size="12" fill="#4f5d75">APP 数据区 RW/ZI/堆/栈</text>
    <text x="400" y="330" font-family="'Geist Mono','Consolas',monospace" font-size="12" fill="#4f5d75">0x2000D000 起 · 掉电即失</text>

    <rect x="700" y="256" width="260" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="720" y="284" font-size="13" font-weight="600" fill="#2d3142">FSMC 控制器</text>
    <text x="720" y="308" font-size="12" fill="#4f5d75">AHB 从设备 · Bank1 NOR/SRAM</text>
    <text x="720" y="330" font-family="'Geist Mono','Consolas',monospace" font-size="12" fill="#4f5d75">复位后 FSMCEN=0 · 必须重配</text>

    <rect x="560" y="440" width="190" height="90" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="580" y="470" font-size="13" font-weight="600" fill="#2d3142">DM9000 网卡</text>
    <text x="580" y="492" font-family="'Geist Mono','Consolas',monospace" font-size="12" fill="#4f5d75">NE2 · 0x64000000</text>
    <text x="580" y="512" font-size="12" fill="#4f5d75">与 NE3 共享读写控制线</text>

    <rect x="780" y="440" width="180" height="90" rx="6" fill="#f7e3dc" stroke="#bf4520" stroke-width="1.4"/>
    <text x="800" y="470" font-size="13" font-weight="600" fill="#2d3142">外部 SRAM</text>
    <text x="800" y="492" font-family="'Geist Mono','Consolas',monospace" font-size="12" fill="#4f5d75">IS62WV51216 · 1MB</text>
    <text x="800" y="512" font-family="'Geist Mono','Consolas',monospace" font-size="12" fill="#4f5d75">NE3 · 0x68000000</text>
  </g>

  <!-- 箭头标签层（带遮罩） -->
  <g font-family="'Geist Mono','Consolas',monospace" font-size="12" fill="#4f5d75">
    <rect x="372" y="192" width="104" height="20" fill="#f5f5f5"/>
    <text x="374" y="207">ICode/DCode</text>
    <rect x="492" y="204" width="60" height="20" fill="#f5f5f5"/>
    <text x="494" y="219" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif">数据读写</text>
    <rect x="840" y="228" width="100" height="20" fill="#f5f5f5"/>
    <text x="844" y="243">SYSTEM 总线</text>
    <rect x="750" y="370" width="44" height="20" fill="#f5f5f5"/>
    <text x="754" y="385">NE2</text>
    <rect x="840" y="388" width="44" height="20" fill="#f5f5f5"/>
    <text x="844" y="403">NE3</text>
  </g>
  <g font-family="'Geist Mono','Consolas',monospace" font-size="12" font-weight="600" fill="#bf4520" text-anchor="middle">
    <rect x="756" y="593" width="88" height="20" fill="#f5f5f5"/>
    <text x="800" y="607">GO SRAM</text>
    <rect x="740" y="615" width="120" height="20" fill="#f5f5f5"/>
    <text x="800" y="629" font-weight="500">按帧头长度 memcpy</text>
    <rect x="806" y="164" width="88" height="20" fill="#f5f5f5"/>
    <text x="850" y="179" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" font-weight="500">运行期取指</text>
  </g>

  <!-- 互斥提示 -->
  <rect x="240" y="560" width="460" height="56" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="262" y="582" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#bf4520">网卡与外部 SRAM 共享 FSMC 读/写控制线，控制器内部串行互斥；</text>
  <text x="262" y="602" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#4f5d75">取指、载荷缓冲与网卡收发在同一控制器上排队，是主要的性能瓶颈。</text>

  <!-- 图例 -->
  <g font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#4f5d75">
    <line x1="40" y1="674" x2="72" y2="674" stroke="#4f5d75" stroke-width="1.4"/>
    <text x="80" y="679">总线连接</text>
    <line x1="150" y1="674" x2="182" y2="674" stroke="#bf4520" stroke-width="1.8"/>
    <text x="190" y="679">装载路径 GO SRAM</text>
    <line x1="320" y1="674" x2="352" y2="674" stroke="#bf4520" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="360" y="679">运行期取指</text>
    <rect x="450" y="666" width="28" height="16" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="488" y="679">存储 / 控制器</text>
    <rect x="600" y="666" width="28" height="16" rx="3" fill="#f7e3dc" stroke="#bf4520" stroke-width="1.4"/>
    <text x="638" y="679">APP 执行位置</text>
  </g>
</svg>
