<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="excflow-title excflow-desc" id="excflow-concept-root">
<title id="excflow-title">异常与中断打断执行流示意</title>
<desc id="excflow-desc">概念示意图：主程序沿时间轴顺序执行指令，DIV #0 指令引发同步异常、外设事件在指令边界送达触发异步中断，两者都跳转到各自的服务程序（以竖线段表示执行时段），处理完后沿返回线回到同一个断点继续执行原程序。</desc>
  <defs>
      
  </defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- main time axis -->
<path d="M 280,96 V 740" fill="none" stroke="#2d3142" stroke-width="1.2"/>
<polygon points="280,756 272,742 288,742" fill="#2d3142"/>
<path d="M 256,152 H 280" fill="none" stroke="#4f5d75" stroke-width="1"/>
<path d="M 256,220 H 280" fill="none" stroke="#4f5d75" stroke-width="1"/>
<path d="M 256,288 H 280" fill="none" stroke="#4f5d75" stroke-width="1"/>
<path d="M 264,520 H 280" fill="none" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.45"/>
<path d="M 256,588 H 280" fill="none" stroke="#4f5d75" stroke-width="1"/>
<path d="M 256,652 H 280" fill="none" stroke="#4f5d75" stroke-width="1"/>

<!-- jump / return lines -->
<path d="M 280,220 L 546,296" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,3"/>
<polygon points="560,300 544.3,303.9 548.7,288.5" fill="#4f5d75"/>
<path d="M 560,400 L 300,230" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,3"/>
<polygon points="288,222 304,223.1 295.2,236.3" fill="#4f5d75"/>

<path d="M 280,520 L 546,596" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5,3"/>
<polygon points="560,600 544.3,603.9 548.7,588.5" fill="#bf4520"/>
<path d="M 560,700 L 300,530" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5,3"/>
<polygon points="288,522 304,523.1 295.2,536.3" fill="#bf4520"/>

<!-- service program boxes: left edge doubles as the execution-time span -->
<rect x="560" y="300" width="360" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="560" y="600" width="360" height="100" rx="6" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/>
<path d="M 560,300 V 400" fill="none" stroke="#2d3142" stroke-width="3"/>
<path d="M 560,600 V 700" fill="none" stroke="#bf4520" stroke-width="3"/>

<!-- breakpoints -->
<circle cx="280" cy="220" r="5" fill="#2d3142"/>
<circle cx="280" cy="520" r="5" fill="#bf4520"/>

<!-- paper masks -->
<rect x="216" y="68" width="128" height="16" fill="#f5f5f5"/>
<rect x="288" y="756" width="72" height="16" fill="#f5f5f5"/>
<rect x="292" y="192" width="88" height="16" fill="#f5f5f5"/>
<rect x="292" y="492" width="88" height="16" fill="#f5f5f5"/>
<rect x="188" y="144" width="64" height="16" fill="#f5f5f5"/>
<rect x="188" y="212" width="64" height="16" fill="#f5f5f5"/>
<rect x="188" y="280" width="64" height="16" fill="#f5f5f5"/>
<rect x="172" y="512" width="80" height="16" fill="#f5f5f5"/>
<rect x="188" y="580" width="64" height="16" fill="#f5f5f5"/>
<rect x="188" y="644" width="64" height="16" fill="#f5f5f5"/>

<!-- instruction labels on axis -->
<g font-family="'Geist Mono',ui-monospace,monospace" font-size="11" text-anchor="end">
<text x="252" y="156" fill="#4f5d75">LDR</text>
<text x="252" y="224" fill="#2d3142" font-weight="600">DIV #0</text>
<text x="252" y="292" fill="#4f5d75">STR</text>
<text x="252" y="404" fill="#4f5d75">···</text>
<text x="252" y="592" fill="#4f5d75">LDR</text>
<text x="252" y="656" fill="#4f5d75">STR</text>
</g>

<!-- other labels -->
<g font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12">
<text x="280" y="80" fill="#2d3142" font-weight="600" text-anchor="middle">主程序执行流</text>
<text x="292" y="764" fill="#4f5d75">继续执行</text>
<text x="296" y="204" fill="#2d3142">① 同步异常</text>
<text x="296" y="504" fill="#bf4520">② 异步中断</text>
<text x="252" y="524" fill="#4f5d75" text-anchor="end">指令边界</text>
<text x="740" y="344" fill="#2d3142" font-weight="600" text-anchor="middle">异常服务程序 HardFault_Handler</text>
<text x="740" y="368" fill="#4f5d75" text-anchor="middle">同步：DIV #0 指令引发，必复现</text>
<text x="740" y="644" fill="#2d3142" font-weight="600" text-anchor="middle">中断服务程序 USART1_IRQHandler</text>
<text x="740" y="668" fill="#4f5d75" text-anchor="middle">异步：与指令无关，随时到达</text>
</g>

<text x="500" y="804" fill="#4f5d75" font-size="14" text-anchor="middle" font-family="'Instrument Serif','Noto Serif SC',serif">处理完返回断点，从被打断的地方继续——两种事件的响应机制完全一样</text>
</svg>
