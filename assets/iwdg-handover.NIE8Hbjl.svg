<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" role="img" aria-labelledby="hoTitle hoDesc" id="iwdg-handover-root">
  <title id="hoTitle">看门狗在跳转前后的移交</title>
  <desc id="hoDesc">Bootloader 初始化阶段不启动看门狗，初始化完成后使能并由主循环喂狗；收到 go 后跳转，看门狗继续倒计时但无人喂狗，直到 APP 用同一组参数重新装载并开始喂狗。</desc>

  <rect x="0" y="0" width="940" height="400" fill="#f5f5f5"/>
  <defs>
    <marker id="iwdg-handover-ha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
    </marker>
  </defs>

  <text x="60" y="36" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="10" letter-spacing="2" fill="#4f5d75">IWDG HANDOVER</text>

  <!-- 上层：谁在跑 -->
  <text x="60" y="72" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#4f5d75">谁在运行</text>
  <g font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12">
    <rect x="60" y="84" width="240" height="48" fill="#e7e7e7" stroke="#4f5d75" stroke-width="1"/>
    <text x="180" y="113" text-anchor="middle" fill="#2d3142">Bootloader 初始化</text>

    <rect x="300" y="84" width="220" height="48" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="410" y="113" text-anchor="middle" fill="#2d3142">命令行等待</text>

    <rect x="520" y="84" width="120" height="48" fill="#f7e3dc" stroke="#bf4520" stroke-width="1.2"/>
    <text x="580" y="113" text-anchor="middle" fill="#2d3142">APP 初始化</text>

    <rect x="640" y="84" width="240" height="48" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="760" y="113" text-anchor="middle" fill="#2d3142">APP 主循环</text>
  </g>

  <!-- 下层：看门狗状态 -->
  <text x="60" y="170" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#4f5d75">看门狗状态</text>
  <g font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12">
    <rect x="60" y="182" width="240" height="48" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="180" y="211" text-anchor="middle" fill="#4f5d75">未启动，不设防</text>

    <rect x="300" y="182" width="220" height="48" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="410" y="211" text-anchor="middle" fill="#2d3142">3 s 倒计时，500 ms 喂一次</text>

    <rect x="520" y="182" width="120" height="48" fill="#f7e3dc" stroke="#bf4520" stroke-width="1.4"/>
    <text x="580" y="205" text-anchor="middle" fill="#2d3142">计时继续</text>
    <text x="580" y="223" text-anchor="middle" fill="#bf4520">无人喂狗</text>

    <rect x="640" y="182" width="240" height="48" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="760" y="211" text-anchor="middle" fill="#2d3142">重新装载 3 s，100 ms 喂一次</text>
  </g>

  <!-- 关键事件 -->
  <g stroke-width="1.2">
    <line x1="300" y1="132" x2="300" y2="250" stroke="#2d3142" stroke-dasharray="4 3"/>
    <line x1="520" y1="132" x2="520" y2="250" stroke="#bf4520" stroke-width="2"/>
    <line x1="640" y1="132" x2="640" y2="250" stroke="#2d3142" stroke-dasharray="4 3"/>
  </g>

  <text x="294" y="150" text-anchor="end" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#2d3142">iwdg_start()</text>
  <text x="528" y="150" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#bf4520">go</text>
  <text x="648" y="150" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#2d3142">iwdg_start()</text>

  <!-- 责任归属 -->
  <text x="60" y="288" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#4f5d75">喂狗责任</text>
  <text x="180" y="288" text-anchor="middle" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75">无</text>
  <text x="410" y="288" text-anchor="middle" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#2d3142">Bootloader</text>
  <text x="580" y="288" text-anchor="middle" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#bf4520">无人接管</text>
  <text x="760" y="288" text-anchor="middle" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#2d3142">APP</text>

  <path d="M 520 320 L 640 320" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#iwdg-handover-ha)"/>
  <text x="580" y="340" text-anchor="middle" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#bf4520">这段必须在剩余窗口内走完</text>

  <text x="60" y="376" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75">IWDG 没有停止位：Bootloader 关不掉它，只能把喂狗责任交出去；APP 用同一组参数重新装载，计数器才回到满值。</text>
</svg>
