<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="pingjourney-title pingjourney-desc">
<title id="pingjourney-title">一次 ping 的两种走向</title>
<desc id="pingjourney-desc">一次 ping 的两种走向</desc>
<rect width="1000" height="600" fill="#f5f5f5"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d75"/></marker>
<marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#bf4520"/></marker>
</defs>
<text x="40" y="46" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#2d3142" text-anchor="start" xml:space="preserve">一次 ping 的两种走向</text>
<text x="40" y="70" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start" xml:space="preserve">同网段直接交换 ICMP，跨网段要交给默认网关；IP 头全程不变，MAC 逐跳重写</text>
<text x="40" y="116" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#bf4520" text-anchor="start" xml:space="preserve">场景一　直连 / 同交换机（同网段）</text>
<rect x="60" y="140" width="200" height="60" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="160.0" y="162.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">PC</text>
<text x="160.0" y="185.9032" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">192.168.16.100</text>
<rect x="740" y="140" width="200" height="60" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="840.0" y="162.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">板子</text>
<text x="840.0" y="185.9032" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">192.168.16.30</text>
<path d="M262 158 L738 158" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
<text x="500" y="148" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">① ARP 请求（广播）</text>
<path d="M738 192 L262 192" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="500" y="182" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle" xml:space="preserve">② ARP 应答（单播）　③④ ICMP 请求与应答往返</text>
<text x="40" y="256" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start" xml:space="preserve">场景二　跨网段（经路由器）</text>
<rect x="60" y="280" width="190" height="60" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="155.0" y="302.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">PC</text>
<text x="155.0" y="325.90319999999997" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">192.168.1.100</text>
<rect x="400" y="280" width="190" height="60" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="495.0" y="302.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">路由器</text>
<text x="495.0" y="325.90319999999997" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">192.168.1.1 / .16.1</text>
<rect x="740" y="280" width="190" height="60" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="835.0" y="302.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">板子</text>
<text x="835.0" y="325.90319999999997" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">192.168.16.30</text>
<path d="M252 310 L398 310" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="325" y="300" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle" xml:space="preserve">交给网关</text>
<path d="M592 310 L738 310" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="665" y="300" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle" xml:space="preserve">按路由表转发</text>
<rect x="40" y="400" width="920" height="76" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1" stroke-dasharray="4,3"/>
<text x="500.0" y="430.9368" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">关键差异</text>
<text x="500.0" y="454.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">同网段：帧里的目的 MAC 就是对方；跨网段：帧里的目的 MAC 是网关，但 IP 头里的目的地址仍是对方</text>
<rect x="40" y="500" width="920" height="76" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="500.0" y="530.9368" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#bf4520" text-anchor="middle" xml:space="preserve">排查顺序永远从下往上</text>
<text x="500.0" y="554.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">网口灯 → 网卡 ID → PC 地址是否 169.254 → 两边是否同网段 → ARP 表里有没有对方</text>
</svg>
