<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ota-upgrade-flow-title ota-upgrade-flow-desc" id="ota-upgrade-flow-root">
        <title id="ota-upgrade-flow-title">OTA 通用升级流程</title>
        <desc id="ota-upgrade-flow-desc">流程图：设备发现新版本后下载并校验升级包，写入非活动槽置 PENDING 标志重启，由 Bootloader 引导新固件，自检通过则确认转正，否则回滚到旧固件。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ota-upgrade-flow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace; }
      #ota-upgrade-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ota-upgrade-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #ota-upgrade-flow-root .diagram-container { overflow-x: visible; }</style>
          <marker id="ota-upgrade-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="ota-upgrade-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="ota-upgrade-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (drawn before boxes) -->
        <line x1="420" y1="152" x2="420" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ota-upgrade-flow-arrow)"/>
        <line x1="516" y1="120" x2="756" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ota-upgrade-flow-arrow)"/>
        <line x1="420" y1="256" x2="420" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ota-upgrade-flow-arrow)"/>
        <line x1="420" y1="352" x2="420" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ota-upgrade-flow-arrow)"/>
        <path d="M 516,320 H 842 Q 850,320 850,312 V 156" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ota-upgrade-flow-arrow)"/>
        <line x1="420" y1="464" x2="420" y2="558" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ota-upgrade-flow-arrow)"/>
        <line x1="516" y1="590" x2="756" y2="590" stroke="#bf4520" stroke-width="1.4" marker-end="url(#ota-upgrade-flow-arrow-accent)"/>
        <line x1="324" y1="590" x2="284" y2="590" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ota-upgrade-flow-arrow)"/>

        <!-- Arrow labels -->
        <rect x="622" y="98" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="638" y="110" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">否</text>

        <rect x="663" y="298" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="679" y="310" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">否</text>

        <rect x="622" y="568" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="638" y="580" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">是</text>

        <rect x="286" y="568" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="302" y="580" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">否</text>

        <!-- Diamond: 发现新版本? -->
        <polygon points="324,120 420,88 516,120 420,152" fill="#f5f5f5"/>
        <polygon points="324,120 420,88 516,120 420,152" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.03"/>
        <text x="420" y="125" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">发现新版本？</text>

        <!-- Node: 维持旧固件运行 -->
        <rect x="760" y="90" width="240" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="90" width="240" height="60" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="880" y="116" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">维持旧固件运行</text>
        <text x="880" y="136" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">无更新 · 校验失败</text>

        <!-- Node: 下载并校验升级包 -->
        <rect x="300" y="196" width="240" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="196" width="240" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="420" y="222" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">下载并校验升级包</text>
        <text x="420" y="242" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">断点续传 · 分块 CRC · 验签</text>

        <!-- Diamond: 校验通过? -->
        <polygon points="324,320 420,288 516,320 420,352" fill="#f5f5f5"/>
        <polygon points="324,320 420,288 516,320 420,352" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.03"/>
        <text x="420" y="325" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">校验通过？</text>

        <!-- Node: 写入非活动槽 -->
        <rect x="300" y="400" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="400" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="420" y="426" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">写入非活动槽</text>
        <text x="420" y="448" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">置 PENDING 标志后重启</text>

        <!-- Diamond: 自检通过? -->
        <polygon points="324,590 420,558 516,590 420,622" fill="#f5f5f5"/>
        <polygon points="324,590 420,558 516,590 420,622" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.03"/>
        <text x="420" y="595" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">自检通过？</text>

        <!-- Node: 确认转正 (focal, happy path) -->
        <rect x="760" y="560" width="240" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="560" width="240" height="60" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="880" y="586" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">确认转正</text>
        <text x="880" y="606" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">mark good</text>

        <!-- Node: 回滚到旧固件 -->
        <rect x="40" y="560" width="240" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="560" width="240" height="60" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="160" y="586" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">回滚到旧固件</text>
        <text x="160" y="606" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">试用超限 · 启动失败</text>
      </svg>
