<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ota-system-architecture-title ota-system-architecture-desc" id="ota-system-architecture-root">
        <title id="ota-system-architecture-title">OTA 升级系统的三个角色</title>
        <desc id="ota-system-architecture-desc">架构图：服务器端生成并策略化下发升级包，经传输通道送达设备端，由 OTA 代理写入非活动槽后交给 Bootloader 选槽引导。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ota-system-architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace; }
      #ota-system-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ota-system-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #ota-system-architecture-root .diagram-container { overflow-x: visible; }</style>
          <marker id="ota-system-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="ota-system-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="ota-system-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (drawn before arrows and nodes) -->
        <rect x="80" y="80" width="800" height="120" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="108" y="84" width="88" height="16" rx="2" fill="#f5f5f5"/>
        <text x="152" y="96" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">服务器端</text>

        <rect x="80" y="400" width="800" height="140" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="108" y="404" width="88" height="16" rx="2" fill="#f5f5f5"/>
        <text x="152" y="416" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">设备端</text>

        <!-- Arrows -->
        <line x1="740" y1="144" x2="590" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ota-system-architecture-arrow)"/>
        <line x1="480" y1="172" x2="480" y2="280" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#ota-system-architecture-arrow-link)"/>
        <line x1="480" y1="344" x2="480" y2="436" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ota-system-architecture-arrow)"/>
        <line x1="320" y1="464" x2="380" y2="464" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ota-system-architecture-arrow)"/>
        <line x1="580" y1="464" x2="636" y2="464" stroke="#bf4520" stroke-width="1.4" marker-end="url(#ota-system-architecture-arrow-accent)"/>

        <!-- Arrow labels -->
        <rect x="590" y="122" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="610" y="134" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">补丁</text>

        <rect x="488" y="222" width="80" height="16" rx="2" fill="#f5f5f5"/>
        <text x="528" y="234" fill="#2e5aa8" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">下发升级包</text>

        <rect x="488" y="372" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="508" y="384" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">传输</text>

        <rect x="338" y="440" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="354" y="452" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">触发</text>

        <rect x="588" y="472" width="44" height="16" rx="2" fill="#f5f5f5"/>
        <text x="610" y="484" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">置标志</text>

        <!-- Node: 版本管理 -->
        <rect x="120" y="116" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="116" width="200" height="56" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="220" y="140" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">版本管理</text>
        <text x="220" y="158" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">固件仓库</text>

        <!-- Node: 升级策略 -->
        <rect x="380" y="116" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="116" width="200" height="56" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="480" y="140" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">升级策略</text>
        <text x="480" y="158" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">灰度 · 分组</text>

        <!-- Node: 差分包生成 -->
        <rect x="640" y="116" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="640" y="116" width="200" height="56" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="740" y="140" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">差分包生成</text>
        <text x="740" y="158" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">bsdiff</text>

        <!-- Node: 传输通道 -->
        <rect x="380" y="280" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="280" width="200" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="480" y="308" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">传输通道</text>
        <text x="480" y="328" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">HTTPS / MQTT</text>

        <!-- Node: App -->
        <rect x="120" y="436" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="436" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="220" y="460" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">App</text>
        <text x="220" y="478" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">业务应用</text>

        <!-- Node: OTA 代理 -->
        <rect x="380" y="436" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="436" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="460" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">OTA 代理</text>
        <text x="480" y="478" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">下载 · 校验 · 写槽</text>

        <!-- Node: Bootloader (focal) -->
        <rect x="640" y="436" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="640" y="436" width="200" height="56" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="740" y="460" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Bootloader</text>
        <text x="740" y="478" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">选槽 · 引导 · 回滚</text>
      </svg>
