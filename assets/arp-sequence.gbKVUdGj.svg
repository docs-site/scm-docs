<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="arpseq-title arpseq-desc">
<title id="arpseq-title">ARP 请求与应答</title>
<desc id="arpseq-desc">ARP 请求与应答</desc>
<rect width="1000" height="560" fill="#f5f5f5"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d75"/></marker>
<marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#bf4520"/></marker>
</defs>
<text x="40" y="46" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#2d3142" text-anchor="start" xml:space="preserve">ARP：已知 IP，求 MAC</text>
<text x="40" y="70" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start" xml:space="preserve">请求用广播（因为还不知道对方 MAC），应答用单播；结果记进 ARP 缓存</text>
<rect x="100" y="100" width="220" height="46" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="210.0" y="127.2432" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">PC  192.168.16.100</text>
<rect x="680" y="100" width="220" height="46" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="790.0" y="127.2432" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">板子  192.168.16.30</text>
<path d="M210 146 L210 330" stroke="#c9ced8" stroke-width="1" fill="none" stroke-dasharray="4,4"/>
<path d="M790 146 L790 330" stroke="#c9ced8" stroke-width="1" fill="none" stroke-dasharray="4,4"/>
<path d="M210 200 L788 200" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
<text x="499" y="190" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">ARP 请求</text>
<text x="499" y="220" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">广播：目的 MAC = FF:FF:FF:FF:FF:FF，问「谁是 192.168.16.30」</text>
<path d="M790 286 L212 286" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="499" y="276" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">ARP 应答</text>
<text x="499" y="306" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">单播：我是，我的 MAC 是 02:00:00:A3:5C:1F</text>
<rect x="40" y="350" width="920" height="60" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="500.0" y="384.24319999999994" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle" xml:space="preserve">双方各自把「IP → MAC」写进 ARP 缓存（带老化时间），之后不再广播</text>
<rect x="40" y="430" width="920" height="100" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="54" y="461.27680000000004" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start" xml:space="preserve">PC 侧 ARP 缓存</text>
<text x="54" y="484.9232" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start" xml:space="preserve">192.168.16.30       02:00:00:A3:5C:1F       动态</text>
<text x="54" y="508.24320000000006" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start" xml:space="preserve">192.168.16.1        8C-16-45-2B-7A-11       动态</text>
</svg>
