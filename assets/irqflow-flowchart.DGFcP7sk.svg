<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 848" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="irqflow-title irqflow-desc" id="irqflow-flowchart-root">
      <title id="irqflow-title">中断响应完整流程</title>
      <desc id="irqflow-desc">流程图：外设事件置标志位并送入 NVIC 悬起，条件允许时硬件自动压栈、查向量表跳转执行中断服务函数，清标志位后经异常返回序列恢复原程序。</desc>
  <defs>
      
  </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows first (behind nodes) -->
      <path d="M 400,108 V 134" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <polygon points="400,148 392,134 408,134" fill="#4f5d75"/>
      <path d="M 400,200 V 226" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <polygon points="400,240 392,226 408,226" fill="#4f5d75"/>
      <path d="M 400,292 V 318" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <polygon points="400,332 392,318 408,318" fill="#4f5d75"/>
      <!-- decision NO: right -->
      <path d="M 520,376 H 566" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <polygon points="580,376 566,368 566,384" fill="#4f5d75"/>
      <!-- decision YES: down (happy path, accent) -->
      <path d="M 400,420 V 450" fill="none" stroke="#bf4520" stroke-width="1.2"/>
      <polygon points="400,464 392,450 408,450" fill="#bf4520"/>
      <path d="M 400,516 V 542" fill="none" stroke="#bf4520" stroke-width="1.2"/>
      <polygon points="400,556 392,542 408,542" fill="#bf4520"/>
      <path d="M 400,608 V 634" fill="none" stroke="#bf4520" stroke-width="1.2"/>
      <polygon points="400,648 392,634 408,634" fill="#bf4520"/>
      <path d="M 400,700 V 726" fill="none" stroke="#bf4520" stroke-width="1.2"/>
      <polygon points="400,740 392,726 408,726" fill="#bf4520"/>

      <!-- Branch labels -->
      <rect x="536" y="356" width="24" height="16" fill="#f5f5f5"/>
      <text x="548" y="368" fill="#4f5d75" font-size="12" text-anchor="middle"
            font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">否</text>
      <rect x="408" y="428" width="24" height="16" fill="#f5f5f5"/>
      <text x="420" y="440" fill="#bf4520" font-size="12"
            font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">是</text>

      <!-- Start oval -->
      <rect x="260" y="56" width="280" height="52" rx="26" fill="#f5f5f5"/>
      <rect x="260" y="56" width="280" height="52" rx="26" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
      <text x="400" y="80" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle"
            font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">外设事件发生</text>
      <text x="400" y="98" fill="#4f5d75" font-size="9" text-anchor="middle"
            font-family="'Geist Mono', ui-monospace, monospace">e.g. USART1 RXNE</text>

      <!-- Step: flag bit -->
      <rect x="260" y="148" width="280" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="260" y="148" width="280" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="172" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle"
            font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">外设状态寄存器置标志位</text>
      <text x="400" y="190" fill="#4f5d75" font-size="9" text-anchor="middle"
            font-family="'Geist Mono', ui-monospace, monospace">SR.RXNE = 1</text>

      <!-- Step: pending -->
      <rect x="260" y="240" width="280" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="260" y="240" width="280" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="264" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle"
            font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">中断请求送入 NVIC，置悬起位</text>
      <text x="400" y="282" fill="#4f5d75" font-size="9" text-anchor="middle"
            font-family="'Geist Mono', ui-monospace, monospace">ISPR -&gt; pending</text>

      <!-- Decision diamond -->
      <polygon points="400,332 520,376 400,420 280,376" fill="#f5f5f5"/>
      <polygon points="400,332 520,376 400,420 280,376" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="381" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle"
            font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">已使能且优先级允许？</text>

      <!-- Side box: pending wait -->
      <rect x="580" y="350" width="240" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="580" y="350" width="240" height="52" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.20"/>
      <text x="700" y="374" fill="#2d3142" font-size="12" text-anchor="middle"
            font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">继续悬起排队</text>
      <text x="700" y="392" fill="#4f5d75" font-size="9" text-anchor="middle"
            font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">条件满足后再响应，请求不丢失</text>

      <!-- Step: auto stack (focal) -->
      <rect x="260" y="464" width="280" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="260" y="464" width="280" height="52" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
      <text x="400" y="488" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle"
            font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">硬件自动压栈 8 个寄存器</text>
      <text x="400" y="506" fill="#4f5d75" font-size="9" text-anchor="middle"
            font-family="'Geist Mono', ui-monospace, monospace">{PC, xPSR, R0-R3, R12, LR}</text>

      <!-- Step: vector fetch -->
      <rect x="260" y="556" width="280" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="260" y="556" width="280" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="580" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle"
            font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">查向量表，跳转执行 ISR</text>
      <text x="400" y="598" fill="#4f5d75" font-size="9" text-anchor="middle"
            font-family="'Geist Mono', ui-monospace, monospace">vector -&gt; *_IRQHandler</text>

      <!-- Step: ISR body -->
      <rect x="260" y="648" width="280" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="260" y="648" width="280" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="672" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle"
            font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">ISR：清标志位 + 处理事件</text>
      <text x="400" y="690" fill="#4f5d75" font-size="9" text-anchor="middle"
            font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">漏清标志位 = 反复进中断</text>

      <!-- End oval -->
      <rect x="260" y="740" width="280" height="52" rx="26" fill="#f5f5f5"/>
      <rect x="260" y="740" width="280" height="52" rx="26" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
      <text x="400" y="764" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle"
            font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">异常返回，恢复原程序</text>
      <text x="400" y="782" fill="#4f5d75" font-size="9" text-anchor="middle"
            font-family="'Geist Mono', ui-monospace, monospace">BX LR -&gt; EXC_RETURN</text>

      <!-- Callout bottom-right -->
      <text x="840" y="832" fill="#4f5d75" font-size="14" text-anchor="end"
            font-family="'Instrument Serif', 'Noto Serif SC', serif">全程无需软件判断来源——硬件查表直达</text>
    </svg>
