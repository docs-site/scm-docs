<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dwt-snoop-title dwt-snoop-desc" id="dwt-snoop-root">
        <title id="dwt-snoop-title">DWT 旁路监听、地址比较与周期计数</title>
        <desc id="dwt-snoop-desc">内核经总线接口访问存储器的主通路照常通行，DWT 从这条通路旁路听取地址，交由地址比较器与周期计数器分别处理，产出调试事件与耗时读数。</desc>
        <defs>
      <style>#dwt-snoop-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #dwt-snoop-root { font-family: var(--font-sans); color: var(--color-ink); }
      #dwt-snoop-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#dwt-snoop-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="dwt-snoop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="dwt-snoop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="dwt-snoop-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: DWT block (drawn before arrows and nodes) -->
        <rect x="284" y="232" width="248" height="240" rx="8"
              fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="492" y="224" width="36" height="16" rx="2" fill="#f5f5f5"/>
        <text x="524" y="236" fill="#5a6580" font-size="12"
              font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="end" letter-spacing="0.08em">DWT</text>

        <!-- Arrows first (behind boxes) -->
        <line x1="300" y1="124" x2="380" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dwt-snoop-arrow)"/>
        <line x1="556" y1="124" x2="636" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dwt-snoop-arrow)"/>
        <!-- Snoop tap: branches off the memory path, passive and non-blocking -->
        <path d="M 340,124 V 280" fill="none" stroke="#bf4520" stroke-width="1.2"
              stroke-dasharray="4,3" marker-end="url(#dwt-snoop-arrow-accent)"/>
        <line x1="508" y1="316" x2="612" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dwt-snoop-arrow)"/>
        <line x1="508" y1="412" x2="612" y2="412" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dwt-snoop-arrow)"/>

        <!-- Arrow labels -->
        <rect x="252" y="188" width="80" height="20" rx="2" fill="#f5f5f5"/>
        <text x="326" y="203" fill="#bf4520" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              text-anchor="end">旁路“听”</text>

        <rect x="540" y="288" width="68" height="20" rx="2" fill="#f5f5f5"/>
        <text x="574" y="303" fill="#5a6580" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              text-anchor="middle">地址命中</text>

        <!-- Node: Cortex-M core -->
        <rect x="140" y="88" width="160" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="140" y="88" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="220" y="120" fill="#2d3142" font-size="13" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              text-anchor="middle">Cortex-M 内核</text>
        <text x="220" y="140" fill="#4f5d75" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              text-anchor="middle">取指 · 访存</text>

        <!-- Node: bus interface -->
        <rect x="380" y="88" width="176" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="88" width="176" height="72" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="468" y="120" fill="#2d3142" font-size="13" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              text-anchor="middle">总线接口</text>
        <text x="468" y="140" fill="#4f5d75" font-size="12"
              font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">AHB-Lite</text>

        <!-- Node: memory and peripherals -->
        <rect x="636" y="88" width="160" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="636" y="88" width="160" height="72" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="716" y="120" fill="#2d3142" font-size="13" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              text-anchor="middle">存储器 / 外设</text>
        <text x="716" y="140" fill="#4f5d75" font-size="12"
              font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">SRAM · MMIO</text>

        <!-- Node: address comparator (focal) -->
        <rect x="308" y="280" width="200" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="308" y="280" width="200" height="72" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="408" y="312" fill="#2d3142" font-size="13" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              text-anchor="middle">地址比较器</text>
        <text x="408" y="332" fill="#4f5d75" font-size="12"
              font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">DWT_COMP0–3</text>

        <!-- Node: cycle counter -->
        <rect x="308" y="376" width="200" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="308" y="376" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="408" y="408" fill="#2d3142" font-size="13" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              text-anchor="middle">周期计数器</text>
        <text x="408" y="428" fill="#4f5d75" font-size="12"
              font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">DWT_CYCCNT</text>

        <!-- Node: debug event -->
        <rect x="612" y="280" width="208" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="612" y="280" width="208" height="72" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="716" y="312" fill="#2d3142" font-size="13" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              text-anchor="middle">调试事件</text>
        <text x="716" y="332" fill="#4f5d75" font-size="12"
              font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">watchpoint · trace</text>

        <!-- Node: elapsed cycles -->
        <rect x="612" y="376" width="208" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="612" y="376" width="208" height="72" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="716" y="408" fill="#2d3142" font-size="13" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              text-anchor="middle">耗时读数</text>
        <text x="716" y="428" fill="#4f5d75" font-size="12"
              font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">ΔCYCCNT</text>

        <!-- Legend strip -->
        <line x1="40" y1="528" x2="920" y2="528" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="552" fill="#4f5d75" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">图例</text>

        <line x1="104" y1="548" x2="140" y2="548" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dwt-snoop-arrow)"/>
        <text x="150" y="552" fill="#4f5d75" font-size="12"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">主通路</text>

        <line x1="232" y1="548" x2="268" y2="548" stroke="#bf4520" stroke-width="1.2"
              stroke-dasharray="4,3" marker-end="url(#dwt-snoop-arrow-accent)"/>
        <text x="278" y="552" fill="#4f5d75" font-size="12"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">旁路监听 · 不阻塞主通路</text>
      </svg>
