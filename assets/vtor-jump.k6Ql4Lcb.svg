<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-labelledby="vtorTitle vtorDesc" id="vtor-jump-root">
  <title id="vtorTitle">向量表与 VTOR 重定位</title>
  <desc id="vtorDesc">跳转前后两张向量表的对照：Bootloader 位于 0x08000000，APP 位于 0x08020000，跳转时把 SCB 的 VTOR 指向 APP 向量表，异常取指地址随之为 VTOR 加异常号乘 4。</desc>

  <rect x="0" y="0" width="940" height="470" fill="#f5f5f5"/>
  <defs>
    <marker id="vtor-jump-va" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d3142"/>
    </marker>
    <marker id="vtor-jump-vac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
    </marker>
  </defs>

  <text x="60" y="36" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="10" letter-spacing="2" fill="#4f5d75">VECTOR TABLE &amp; VTOR</text>

  <!-- Bootloader 向量表 -->
  <g font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
    <text x="60" y="72" font-size="13" font-weight="600" fill="#2d3142">Bootloader 向量表</text>
    <text x="60" y="92" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" fill="#4f5d75">@ 0x08000000</text>
    <rect x="60" y="104" width="250" height="196" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  </g>
  <g font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" fill="#4f5d75">
    <text x="76" y="132">+0x00</text>
    <text x="76" y="162">+0x04</text>
    <text x="76" y="192">+0x08</text>
    <text x="76" y="222">+0x0C</text>
    <text x="76" y="252">+0x3C</text>
    <text x="76" y="282">…</text>
  </g>
  <g font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#2d3142">
    <text x="150" y="132">初始栈顶 MSP</text>
    <text x="150" y="162">Reset_Handler</text>
    <text x="150" y="192">NMI_Handler</text>
    <text x="150" y="222">HardFault_Handler</text>
    <text x="150" y="252">SysTick_Handler</text>
    <text x="150" y="282">（54 个外部中断）</text>
  </g>

  <!-- APP 向量表 -->
  <g font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
    <text x="630" y="72" font-size="13" font-weight="600" fill="#2d3142">APP 向量表</text>
    <text x="630" y="92" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" fill="#4f5d75">@ 0x08020000 / 0x20007000</text>
    <rect x="630" y="104" width="250" height="196" rx="6" fill="#f7e3dc" stroke="#bf4520" stroke-width="1.4"/>
  </g>
  <g font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" fill="#4f5d75">
    <text x="646" y="132">+0x00</text>
    <text x="646" y="162">+0x04</text>
    <text x="646" y="192">+0x08</text>
    <text x="646" y="222">+0x0C</text>
    <text x="646" y="252">+0x3C</text>
    <text x="646" y="282">…</text>
  </g>
  <g font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#2d3142">
    <text x="720" y="132">初始栈顶 MSP</text>
    <text x="720" y="162">Reset_Handler</text>
    <text x="720" y="192">NMI_Handler</text>
    <text x="720" y="222">HardFault_Handler</text>
    <text x="720" y="252">SysTick_Handler</text>
    <text x="720" y="282">（54 个外部中断）</text>
  </g>

  <!-- VTOR 切换 -->
  <rect x="390" y="150" width="180" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="480" y="178" text-anchor="middle" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" fill="#4f5d75">SCB-&gt;VTOR</text>
  <text x="480" y="204" text-anchor="middle" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#2d3142">跳转时改写</text>

  <path d="M 310 178 L 390 178" fill="none" stroke="#2d3142" stroke-width="1.2" marker-end="url(#vtor-jump-va)"/>
  <text x="350" y="168" text-anchor="middle" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75">跳转前</text>

  <path d="M 630 214 L 570 214" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#vtor-jump-vac)"/>
  <text x="600" y="204" text-anchor="middle" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#bf4520">跳转后</text>

  <path d="M 480 150 L 480 118" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#vtor-jump-vac)"/>
  <text x="492" y="136" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#bf4520">异常入口</text>

  <!-- 公式与结论 -->
  <rect x="60" y="330" width="820" height="110" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="82" y="362" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#2d3142">取指规则</text>
  <text x="82" y="390" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#2d3142">处理函数地址 = *(SCB-&gt;VTOR + 异常号 × 4)</text>
  <text x="82" y="414" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75">例：SysTick 异常号 15，VTOR = 0x08020000 时取 0x0802003C 处的地址；VTOR 没改就仍取 Bootloader 的处理函数。</text>
</svg>
