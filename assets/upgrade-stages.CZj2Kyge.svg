<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stages-title stages-desc" id="upgrade-stages-root">
        <title id="stages-title">升级的三个阶段</title>
        <desc id="stages-desc">升级分为下载落盘、重启搬运、运行确认三个阶段，前两阶段由 app 与 bootloader 分别主导，第三阶段人工确认关闭回滚窗口。</desc>
        <defs>
      <style>#upgrade-stages-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; }
      #upgrade-stages-root { font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--color-ink); }
      #upgrade-stages-root .diagram-container { width: 100%; overflow-x: auto; }
      #upgrade-stages-root .n { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
      #upgrade-stages-root .s { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
      #upgrade-stages-root .m { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
      #upgrade-stages-root .k { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
      #upgrade-stages-root .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }</style>
          <marker id="upgrade-stages-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="upgrade-stages-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <style>
          .n  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
          .s  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
          .m  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
          .k  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
          .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }
        </style>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- 阶段之间的连接 -->
        <line x1="332" y1="330" x2="356" y2="330" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#upgrade-stages-arrow)"/>
        <line x1="628" y1="330" x2="652" y2="330" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#upgrade-stages-arrow)"/>

        <!-- ============ 阶段一 ============ -->
        <rect x="56" y="132" width="276" height="380" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1.6"/>
        <text class="k" x="76" y="160">STAGE 1 · APP</text>
        <text class="n" x="76" y="186">下载与落盘</text>

        <circle cx="86" cy="222" r="9" fill="#bf4520" fill-opacity="0.12" stroke="#bf4520" stroke-width="1"/>
        <text class="m" x="86" y="226" text-anchor="middle">1</text>
        <text class="s" x="106" y="226">判断已连热点</text>

        <circle cx="86" cy="266" r="9" fill="#bf4520" fill-opacity="0.12" stroke="#bf4520" stroke-width="1"/>
        <text class="m" x="86" y="270" text-anchor="middle">2</text>
        <text class="s" x="106" y="270">ping TFTP 主机</text>

        <circle cx="86" cy="310" r="9" fill="#bf4520" fill-opacity="0.12" stroke="#bf4520" stroke-width="1"/>
        <text class="m" x="86" y="314" text-anchor="middle">3</text>
        <text class="s" x="106" y="314">下载进外部 SRAM</text>

        <circle cx="86" cy="354" r="9" fill="#bf4520" fill-opacity="0.12" stroke="#bf4520" stroke-width="1"/>
        <text class="m" x="86" y="358" text-anchor="middle">4</text>
        <text class="s" x="106" y="358">整帧七项校验</text>

        <circle cx="86" cy="398" r="9" fill="#bf4520" fill-opacity="0.12" stroke="#bf4520" stroke-width="1"/>
        <text class="m" x="86" y="402" text-anchor="middle">5</text>
        <text class="s" x="106" y="402">写非 active 槽</text>

        <circle cx="86" cy="442" r="9" fill="#bf4520" fill-opacity="0.12" stroke="#bf4520" stroke-width="1"/>
        <text class="m" x="86" y="446" text-anchor="middle">6</text>
        <text class="s" x="106" y="446">置 pending = 1</text>

        <text class="m" x="76" y="486">写 0x004000 或 0x044000</text>

        <!-- ============ 阶段二 ============ -->
        <rect x="356" y="132" width="272" height="380" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.6"/>
        <text class="k" x="376" y="160">STAGE 2 · BOOTLOADER</text>
        <text class="n" x="376" y="186">重启与搬运</text>

        <circle cx="386" cy="222" r="9" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text class="m" x="386" y="226" text-anchor="middle">1</text>
        <text class="s" x="406" y="226">reboot 回 bootloader</text>

        <circle cx="386" cy="266" r="9" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text class="m" x="386" y="270" text-anchor="middle">2</text>
        <text class="s" x="406" y="270">go flash 读 pending</text>

        <circle cx="386" cy="310" r="9" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text class="m" x="386" y="314" text-anchor="middle">3</text>
        <text class="s" x="406" y="314">整帧读槽入 SRAM</text>

        <circle cx="386" cy="354" r="9" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text class="m" x="386" y="358" text-anchor="middle">4</text>
        <text class="s" x="406" y="358">七项校验重算</text>

        <circle cx="386" cy="398" r="9" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text class="m" x="386" y="402" text-anchor="middle">5</text>
        <text class="s" x="406" y="402">写 0x08020000 + 回读</text>

        <circle cx="386" cy="442" r="9" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text class="m" x="386" y="446" text-anchor="middle">6</text>
        <text class="s" x="406" y="446">翻 active，清 pending</text>

        <text class="m" x="376" y="486">confirmed 归零，进回滚窗口</text>

        <!-- ============ 阶段三 ============ -->
        <rect x="652" y="132" width="272" height="380" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.6"/>
        <text class="k" x="672" y="160">STAGE 3 · APP</text>
        <text class="n" x="672" y="186">运行与确认</text>

        <circle cx="682" cy="222" r="9" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text class="m" x="682" y="226" text-anchor="middle">1</text>
        <text class="s" x="702" y="226">跳转新镜像</text>

        <circle cx="682" cy="266" r="9" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text class="m" x="682" y="270" text-anchor="middle">2</text>
        <text class="s" x="702" y="270">打印 NOT confirmed</text>

        <circle cx="682" cy="310" r="9" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text class="m" x="682" y="314" text-anchor="middle">3</text>
        <text class="s" x="702" y="314">人工自检功能</text>

        <circle cx="682" cy="354" r="9" fill="#bf4520" fill-opacity="0.12" stroke="#bf4520" stroke-width="1"/>
        <text class="m" x="682" y="358" text-anchor="middle">4</text>
        <text class="s" x="702" y="358">upd ok 关闭窗口</text>

        <circle cx="682" cy="398" r="9" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text class="m" x="682" y="402" text-anchor="middle">5</text>
        <text class="s" x="702" y="402">再 go flash 直接跳</text>

        <text class="m" x="672" y="486">confirmed = 1，稳定态</text>

        <!-- ============ 注释 ============ -->
        <text class="nt" x="56" y="546">三个阶段各管一段：app 只写外部槽和记录，bootloader 只写内部 Flash。</text>
        <text class="nt" x="56" y="568">这样任何一步掉电，内部 Flash 里的旧程序都还是完整的。</text>

        <!-- ============ 图例 ============ -->
        <line x1="56" y1="592" x2="924" y2="592" stroke="#2d3142" stroke-opacity="0.14" stroke-width="1"/>
        <text class="k" x="56" y="616">LEGEND</text>
        <circle cx="140" cy="611" r="7" fill="#bf4520" fill-opacity="0.12" stroke="#bf4520" stroke-width="1"/>
        <text class="s" x="156" y="616">关键动作</text>
        <circle cx="246" cy="611" r="7" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text class="s" x="262" y="616">常规动作</text>
      </svg>
