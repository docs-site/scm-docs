<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 450" role="img" aria-labelledby="fb-title fb-desc" xmlns="http://www.w3.org/2000/svg" id="fpb-breakpoint-root">
  <title id="fb-title">硬件断点：FPB 把指令换成 BKPT</title>
  <desc id="fb-desc">取指地址与 FP_COMP 比较，命中后该地址的指令被替换成 BKPT，内核进入调试停机；未命中则正常执行</desc>

  <defs>
      <style>#fpb-breakpoint-root .title { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 20px; font-weight: 600; fill: #2d3142; }
      #fpb-breakpoint-root .sub { font-family: "Microsoft YaHei", sans-serif; font-size: 12px; fill: #78828f; }
      #fpb-breakpoint-root .box { fill: #ffffff; stroke: #ccd2da; stroke-width: 1.2; }
      #fpb-breakpoint-root .cmp { fill: #f7f8fa; stroke: #ccd2da; stroke-width: 1.2; }
      #fpb-breakpoint-root .focal { fill: #fdf1ec; stroke: #bf4520; stroke-width: 1.4; }
      #fpb-breakpoint-root .name { font-family: "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
      #fpb-breakpoint-root .mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: #4f5d75; }
      #fpb-breakpoint-root .note { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 12.5px; fill: #4f5d75; }</style>
    <marker id="fpb-breakpoint-fb-ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#9aa4b2"/>
    </marker>
  </defs>

  <text class="title" x="24" y="38">硬件断点：FPB 把指令换成 BKPT</text>
  <text class="sub" x="896" y="38" text-anchor="end">Cortex-M3：6 个指令比较器 + 6 个断点</text>

  <!-- 主链 -->
  <rect class="box" x="24" y="150" width="170" height="80" rx="6"/>
  <text class="name" x="109" y="182" text-anchor="middle">取指地址</text>
  <text class="sub" x="109" y="204" text-anchor="middle">每条指令都过一遍</text>

  <line x1="194" y1="190" x2="228" y2="190" stroke="#9aa4b2" stroke-width="1.3" marker-end="url(#fpb-breakpoint-fb-ar)"/>

  <rect class="cmp" x="232" y="150" width="180" height="80" rx="6"/>
  <text class="name" x="322" y="182" text-anchor="middle">FPB 比较器</text>
  <text class="mono" x="322" y="204" text-anchor="middle">FP_COMP0~5</text>

  <line x1="412" y1="190" x2="446" y2="190" stroke="#9aa4b2" stroke-width="1.3" marker-end="url(#fpb-breakpoint-fb-ar)"/>

  <rect class="box" x="450" y="160" width="110" height="60" rx="6"/>
  <text class="name" x="505" y="196" text-anchor="middle">地址命中</text>

  <line x1="560" y1="190" x2="594" y2="190" stroke="#9aa4b2" stroke-width="1.3" marker-end="url(#fpb-breakpoint-fb-ar)"/>

  <rect class="focal" x="598" y="150" width="150" height="80" rx="6"/>
  <text class="name" x="673" y="182" text-anchor="middle">替换为 BKPT</text>
  <text class="mono" x="673" y="204" text-anchor="middle">0xBE00</text>

  <line x1="748" y1="190" x2="782" y2="190" stroke="#9aa4b2" stroke-width="1.3" marker-end="url(#fpb-breakpoint-fb-ar)"/>

  <rect class="box" x="786" y="150" width="110" height="80" rx="6"/>
  <text class="name" x="841" y="184" text-anchor="middle">内核停机</text>
  <text class="sub" x="841" y="206" text-anchor="middle">halt</text>

  <!-- 未命中的分支 -->
  <path d="M505 220 V276 H446" fill="none" stroke="#9aa4b2" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#fpb-breakpoint-fb-ar)"/>
  <rect x="514" y="228" width="76" height="16" fill="#fafafa"/>
  <text class="sub" x="518" y="241">未命中</text>

  <rect class="box" x="300" y="262" width="142" height="60" rx="6"/>
  <text class="name" x="371" y="288" text-anchor="middle">继续执行</text>
  <text class="sub" x="371" y="308" text-anchor="middle">原指令照常运行</text>

  <!-- 编者按 -->
  <line x1="24" y1="356" x2="896" y2="356" stroke="#dde2e8" stroke-width="1"/>
  <text class="note" x="24" y="380">FPB 只覆盖代码区 0x0000_0000 ~ 0x1FFF_FFFF，Flash（0x0800_0000）在内，内部 SRAM（0x2000_0000）不在。</text>
  <text class="note" x="24" y="402">6 个比较器就是 6 个硬件断点的硬上限：第 7 个断点只能在调试器里排队或替换掉一个。</text>
  <text class="note" x="24" y="424">有调试器接管时 BKPT 进调试状态（停机）；没有调试器时 BKPT 升级为 HardFault——裸跑固件里残留 BKPT 会死机。</text>
</svg>
