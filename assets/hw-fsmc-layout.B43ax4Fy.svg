<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="hwfsmc-title hwfsmc-desc">
<title id="hwfsmc-title">DM9000 与外部 SRAM 在 FSMC 总线上的连接</title>
<desc id="hwfsmc-desc">DM9000 与外部 SRAM 在 FSMC 总线上的连接</desc>
<rect width="1000" height="600" fill="#f5f5f5"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d75"/></marker>
<marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#bf4520"/></marker>
</defs>
<text x="40" y="46" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#2d3142" text-anchor="start" xml:space="preserve">DM9000 与外部 SRAM 在 FSMC 总线上的连接</text>
<text x="40" y="70" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start" xml:space="preserve">两者共用数据/地址/读写控制线，靠片选区分；只有中断与复位是普通 GPIO</text>
<rect x="40" y="196" width="200" height="140" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="140.0" y="258.9368" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">STM32F103ZET6</text>
<text x="140.0" y="282.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">FSMC 控制器</text>
<rect x="400" y="160" width="6" height="310" rx="3" fill="#2d3142"/>
<text x="403" y="148" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">FSMC 16 位总线</text>
<path d="M240 266 L398 266" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="384" y="366" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#4f5d75" text-anchor="end" xml:space="preserve">共用信号</text>
<text x="384" y="392" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="400" fill="#8a94a6" text-anchor="end" xml:space="preserve">D0 ~ D15</text>
<text x="384" y="414" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="400" fill="#8a94a6" text-anchor="end" xml:space="preserve">A7</text>
<text x="384" y="436" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="400" fill="#8a94a6" text-anchor="end" xml:space="preserve">NOE</text>
<text x="384" y="458" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="400" fill="#8a94a6" text-anchor="end" xml:space="preserve">NWE</text>
<rect x="560" y="156" width="400" height="104" rx="6" fill="#fdf1ec" stroke="#bf4520" stroke-width="1"/>
<text x="760.0" y="189.2768" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">DM9000 以太网控制器</text>
<text x="760.0" y="212.9232" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">片选 FSMC_NE2 = PG9    基址 0x64000000</text>
<text x="760.0" y="236.2432" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">命令口 base|0xFE   数据口 base|0x100（由 A7 决定）</text>
<path d="M406 208 L558 208" fill="none" stroke="#bf4520" stroke-width="1.7" marker-end="url(#arrowAccent)"/>
<text x="478" y="194" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">NE2</text>
<rect x="560" y="336" width="400" height="104" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="760.0" y="380.9368" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">IS62WV51216 外部 SRAM（1MB）</text>
<text x="760.0" y="404.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">片选 FSMC_NE3 = PG10    基址 0x68000000</text>
<path d="M406 388 L558 388" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="478" y="374" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">NE3</text>
<rect x="40" y="500" width="920" height="72" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1" stroke-dasharray="4,3"/>
<text x="500.0" y="528.9368" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">不经 FSMC 的两根线</text>
<text x="500.0" y="552.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">DM9000_INT = PG6（与 WIRELESS 的 NRF_IRQ 共用）    DM9000_RST = PD7（与 RS485_RE 共用）</text>
</svg>
