<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="channel-map-title channel-map-desc" id="channel-map-root">
        <title id="channel-map-title">调试与跟踪的四条数据通道</title>
        <desc id="channel-map-desc">四条通道并列：停机读内存走 SWD、芯片内统计走 SWD 读取、芯片外送走 SWO 或串口、芯片外测量用探头直接量引脚；只有第一条会暂停 CPU。</desc>
        <defs>
      <style>#channel-map-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #channel-map-root { font-family: var(--font-sans); color: var(--color-ink); }
      #channel-map-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#channel-map-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="channel-map-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="channel-map-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="channel-map-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Row 1: stop the CPU -->
        <line x1="528" y1="68" x2="648" y2="68" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#channel-map-arrow)"/>
        <rect x="556" y="40" width="64" height="20" rx="2" fill="#f5f5f5"/>
        <text x="588" y="55" fill="#4f5d75" font-size="12" font-weight="500" text-anchor="middle"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">SWD</text>

        <text x="40" y="64" fill="#bf4520" font-size="13" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">通道一 · 停机读内存</text>
        <text x="40" y="84" fill="#5a6580" font-size="12"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">唯一会暂停 CPU 的通道</text>

        <rect x="288" y="40" width="240" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="40" width="240" height="56" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="304" y="64" fill="#2d3142" font-size="13" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">断点 · 单步 · 变量窗口</text>
        <text x="304" y="84" fill="#4f5d75" font-size="12"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">调用栈、Fault 寄存器</text>

        <rect x="688" y="40" width="232" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="688" y="40" width="232" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="704" y="64" fill="#2d3142" font-size="13" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">Watch / Call Stack</text>
        <text x="704" y="84" fill="#4f5d75" font-size="12"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">停机才刷新</text>

        <!-- Row 2: counters inside the chip -->
        <line x1="528" y1="156" x2="648" y2="156" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#channel-map-arrow)"/>
        <rect x="556" y="128" width="64" height="20" rx="2" fill="#f5f5f5"/>
        <text x="588" y="143" fill="#4f5d75" font-size="12" font-weight="500" text-anchor="middle"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">SWD</text>

        <text x="40" y="152" fill="#2d3142" font-size="13" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">通道二 · 芯片内统计</text>
        <text x="40" y="172" fill="#5a6580" font-size="12"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">不停机，只拿到汇总值</text>

        <rect x="288" y="128" width="240" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="128" width="240" height="56" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="304" y="152" fill="#2d3142" font-size="13" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">DWT 计数器 · RTOS 统计</text>
        <text x="304" y="172" fill="#4f5d75" font-size="12"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">结果留在寄存器 / RAM</text>

        <rect x="688" y="128" width="232" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="688" y="128" width="232" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="704" y="152" fill="#2d3142" font-size="13" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">CYCCNT 读数、ps / top</text>
        <text x="704" y="172" fill="#4f5d75" font-size="12"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">按需读取，不连续</text>

        <!-- Row 3: program pushes data out -->
        <line x1="528" y1="244" x2="648" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#channel-map-arrow)"/>
        <rect x="524" y="216" width="128" height="20" rx="2" fill="#f5f5f5"/>
        <text x="588" y="231" fill="#4f5d75" font-size="12" font-weight="500" text-anchor="middle"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">SWO / UART</text>

        <text x="40" y="240" fill="#2d3142" font-size="13" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">通道三 · 芯片外送</text>
        <text x="40" y="260" fill="#5a6580" font-size="12"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">不停机，程序主动发包</text>

        <rect x="288" y="216" width="240" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="216" width="240" height="56" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="304" y="240" fill="#2d3142" font-size="13" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">ITM · printf</text>
        <text x="304" y="260" fill="#4f5d75" font-size="12"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">程序主动写数据包</text>

        <rect x="688" y="216" width="232" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="688" y="216" width="232" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="704" y="240" fill="#2d3142" font-size="13" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">Trace 窗口、串口助手</text>
        <text x="704" y="260" fill="#4f5d75" font-size="12"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">连续流，受带宽限制</text>

        <!-- Row 4: measure the pins directly -->
        <line x1="528" y1="332" x2="648" y2="332" stroke="#4f5d75" stroke-width="1.2"
              stroke-dasharray="4,3" marker-end="url(#channel-map-arrow)"/>
        <rect x="556" y="304" width="64" height="20" rx="2" fill="#f5f5f5"/>
        <text x="588" y="319" fill="#4f5d75" font-size="12" font-weight="500" text-anchor="middle"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">探头</text>

        <text x="40" y="328" fill="#2d3142" font-size="13" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">通道四 · 芯片外测量</text>
        <text x="40" y="348" fill="#5a6580" font-size="12"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">不经过任何调试通道</text>

        <rect x="288" y="304" width="240" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="304" width="240" height="56" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="304" y="328" fill="#2d3142" font-size="13" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">GPIO 翻转 · 引脚电平</text>
        <text x="304" y="348" fill="#4f5d75" font-size="12"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">探头直接搭在引脚上</text>

        <rect x="688" y="304" width="232" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="688" y="304" width="232" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="704" y="328" fill="#2d3142" font-size="13" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">逻辑分析仪 / 示波器</text>
        <text x="704" y="348" fill="#4f5d75" font-size="12"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">硬件连续采样，能抓毛刺</text>

        <!-- Column hint -->
        <text x="288" y="24" fill="#5a6580" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">芯片内部</text>
        <text x="688" y="24" fill="#5a6580" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">PC 端看到的东西</text>

        <!-- Closing notes -->
        <line x1="40" y1="376" x2="920" y2="376" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="400" fill="#4f5d75" font-size="13"
              font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', 'SimSun', serif"
              font-style="italic">前三条走调试链路（实线），第四条是探头直连芯片引脚（虚线）。</text>
        <text x="40" y="424" fill="#4f5d75" font-size="13"
              font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', 'SimSun', serif"
              font-style="italic">J-Scope、SystemView、MDK Logic Analyzer 只是第二、三条的前端，不构成新通道。</text>
      </svg>
