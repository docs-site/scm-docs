<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gof-title gof-desc" id="go-flash-flow-root">
        <title id="gof-title">go flash 的搬运决策</title>
        <desc id="gof-desc">go flash 先判断 pending 标志，为一时依次读槽、七项校验（含 Ed25519 验签）、写内部 Flash 并更新记录，任何一步失败都保留记录并跳回当前镜像。</desc>
        <defs>
      <style>#go-flash-flow-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; }
      #go-flash-flow-root { font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--color-ink); }
      #go-flash-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #go-flash-flow-root .n { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
      #go-flash-flow-root .s { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
      #go-flash-flow-root .m { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
      #go-flash-flow-root .k { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
      #go-flash-flow-root .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }</style>
          <marker id="go-flash-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="go-flash-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <style>
          .n  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
          .s  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
          .m  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
          .k  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
          .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }
        </style>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== 连线（先画线） ===== -->
        <line x1="490" y1="114" x2="490" y2="138" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#go-flash-flow-arrow)"/>

        <!-- 是：判断 -> 读槽 -->
        <line x1="490" y1="218" x2="490" y2="246" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#go-flash-flow-arrow)"/>
        <rect x="498" y="224" width="20" height="18" fill="#f5f5f5"/>
        <text class="s" x="508" y="238">是</text>

        <!-- 否：判断 -> 左框 -->
        <path d="M 378 178 L 200 178 Q 192 178 192 186 L 192 246"
              fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#go-flash-flow-arrow)"/>
        <rect x="286" y="168" width="20" height="18" fill="#f5f5f5"/>
        <text class="s" x="296" y="182">否</text>

        <!-- 主链 -->
        <line x1="490" y1="300" x2="490" y2="326" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#go-flash-flow-arrow)"/>
        <line x1="490" y1="392" x2="490" y2="418" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#go-flash-flow-arrow)"/>
        <line x1="490" y1="472" x2="490" y2="498" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#go-flash-flow-arrow)"/>
        <line x1="490" y1="552" x2="490" y2="586" stroke="#bf4520" stroke-width="1.6" marker-end="url(#go-flash-flow-arrow-accent)"/>

        <!-- 失败分支 -->
        <line x1="624" y1="360" x2="696" y2="360" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#go-flash-flow-arrow)"/>
        <rect x="628" y="350" width="60" height="18" fill="#f5f5f5"/>
        <text class="s" x="658" y="364" text-anchor="middle">校验失败</text>

        <!-- ===== 节点 ===== -->
        <rect x="360" y="70" width="260" height="44" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.6"/>
        <text class="n" x="490" y="98" text-anchor="middle">go flash</text>

        <polygon points="490,140 600,178 490,216 380,178" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.8"/>
        <text class="m" x="490" y="175" text-anchor="middle">pending == 1 ?</text>
        <text class="s" x="490" y="194" text-anchor="middle">有待安装槽</text>

        <rect x="360" y="248" width="260" height="52" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.75"/>
        <text class="n" x="376" y="270">整帧读入外部 SRAM</text>
        <text class="m" x="376" y="289">0x004000 / 0x044000 · 按 img_len</text>

        <rect x="360" y="328" width="260" height="64" rx="6" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.6"/>
        <text class="n" x="376" y="350">七项校验</text>
        <text class="m" x="376" y="370">魔数 长度 目标 尾标</text>
        <text class="m" x="376" y="386">载荷CRC 整帧CRC Ed25519 验签</text>

        <rect x="360" y="420" width="260" height="52" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.75"/>
        <text class="n" x="376" y="442">写内部 Flash</text>
        <text class="m" x="376" y="461">0x08020000 · 擦页 + 回读校验</text>

        <rect x="360" y="500" width="260" height="52" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.75"/>
        <text class="n" x="376" y="522">更新升级记录</text>
        <text class="m" x="376" y="541">active=pending_slot · pending=0</text>

        <rect x="360" y="588" width="260" height="48" rx="6" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.6"/>
        <text class="n" x="490" y="610" text-anchor="middle">跳转新镜像</text>
        <text class="m" x="490" y="627" text-anchor="middle">confirmed = 0，等人工确认</text>

        <!-- 左框：pending=0 -->
        <rect x="92" y="248" width="200" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.5"/>
        <text class="n" x="108" y="270">跳当前镜像</text>
        <text class="s" x="108" y="290">没有待安装的槽</text>

        <!-- 右框：失败 -->
        <rect x="700" y="326" width="212" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.5"/>
        <text class="n" x="716" y="348">保留记录，跳当前镜像</text>
        <text class="s" x="716" y="368">下次 go flash 自动重试</text>

        <!-- ===== 注释 ===== -->
        <text class="nt" x="92" y="446">读槽、校验、写 Flash 任一失败，</text>
        <text class="nt" x="92" y="468">内部 Flash 都还没被擦，旧程序完好。</text>

        <!-- ===== 图例 ===== -->
        <line x1="56" y1="650" x2="924" y2="650" stroke="#2d3142" stroke-opacity="0.14" stroke-width="1"/>
        <text class="k" x="56" y="674">LEGEND</text>
        <rect x="136" y="662" width="14" height="12" rx="2" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.4"/>
        <text class="s" x="158" y="673">关键步骤</text>
        <line x1="242" y1="668" x2="278" y2="668" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#go-flash-flow-arrow)"/>
        <text class="s" x="288" y="673">失败出口</text>
        <line x1="392" y1="668" x2="428" y2="668" stroke="#bf4520" stroke-width="1.6" marker-end="url(#go-flash-flow-arrow-accent)"/>
        <text class="s" x="438" y="673">成功路径</text>
      </svg>
