<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="rxpath-title rxpath-desc">
<title id="rxpath-title">收包路径：中断模式与轮询模式</title>
<desc id="rxpath-desc">收包路径：中断模式与轮询模式</desc>
<rect width="1000" height="560" fill="#f5f5f5"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d75"/></marker>
<marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#bf4520"/></marker>
</defs>
<text x="40" y="46" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#2d3142" text-anchor="start" xml:space="preserve">收包路径：中断模式与轮询模式</text>
<text x="40" y="70" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start" xml:space="preserve">两条路都汇到 ethernetif_input()，再交给协议栈</text>
<text x="40" y="108" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#bf4520" text-anchor="start" xml:space="preserve">中断模式   DM9000_RX_INT_MODE = 1</text>
<rect x="40" y="120" width="130" height="68" rx="6" fill="#fdf1ec" stroke="#bf4520" stroke-width="1"/>
<text x="105.0" y="146.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">PG6 下降沿</text>
<text x="105.0" y="169.9032" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">（DM9000_INT）</text>
<path d="M172 154 L188 154" fill="none" stroke="#bf4520" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="190" y="120" width="130" height="68" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="255.0" y="146.5832" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">EXTI9_5</text>
<text x="255.0" y="169.9032" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">IRQHandler</text>
<path d="M322 154 L338 154" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="340" y="120" width="130" height="68" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="405.0" y="146.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">回调读 ISR</text>
<text x="405.0" y="169.9032" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">并写 1 清除</text>
<path d="M472 154 L488 154" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="490" y="120" width="130" height="68" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="555.0" y="146.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">置软件标志</text>
<text x="555.0" y="169.9032" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">s_rx_flag = 1</text>
<text x="40" y="216" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start" xml:space="preserve">回调只做 O(1) 搬运：读寄存器、清标志、置标志；取包回到主循环</text>
<text x="40" y="258" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start" xml:space="preserve">轮询模式   DM9000_RX_INT_MODE = 0</text>
<rect x="40" y="270" width="150" height="68" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="115.0" y="296.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">主循环每 1ms</text>
<text x="115.0" y="319.90319999999997" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">无条件查 RX FIFO</text>
<text x="206" y="310" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start" xml:space="preserve">不走中断，逻辑简单；空转有开销</text>
<rect x="40" y="372" width="560" height="68" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="320.0" y="398.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">lwip_comm_poll()   每 1ms 由主循环调用</text>
<text x="320.0" y="421.90319999999997" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">有标志则 ethernetif_input()；随后 sys_check_timeouts() 驱动协议栈定时器</text>
<rect x="40" y="474" width="560" height="72" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="320.0" y="490.92319999999995" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">ethernetif_input()</text>
<text x="320.0" y="514.2432" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">循环 low_level_input() → DM9000_Receive_Packet() 直到 FIFO 取空</text>
<text x="320.0" y="537.5632" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">netif-&gt;input() → lwIP：etharp / ip4 / tcp</text>
<path d="M530 188 L530 372" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M115 338 L115 372" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M320 440 L320 474" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="644" y="120" width="316" height="178" rx="6" fill="#fdf1ec" stroke="#bf4520" stroke-width="1"/>
<text x="802.0" y="155.29680000000002" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#bf4520" text-anchor="middle" xml:space="preserve">中断模式的坑</text>
<text x="802.0" y="178.94320000000002" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">DM9000 的 INT 是电平保持型，</text>
<text x="802.0" y="202.2632" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">必须把 ISR 对应位写 1 清除，</text>
<text x="802.0" y="225.5832" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">INT 才会回到高电平。</text>
<text x="802.0" y="248.9032" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">漏掉这一步，下降沿只出现一次，</text>
<text x="802.0" y="272.22319999999996" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">此后所有包全丢。</text>
<rect x="644" y="372" width="316" height="174" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="802.0" y="416.9568" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">观测手段</text>
<text x="802.0" y="440.60319999999996" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">串口日志（常开）</text>
<text x="802.0" y="463.92319999999995" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">DM9000_NETDBG_EN 计数：</text>
<text x="802.0" y="487.24319999999994" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">EXTI 次数 / 取包数 / 丢弃数 / 发送数</text>
<text x="802.0" y="510.5632" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">DM9000_DbgPoll() 周期打印</text>
</svg>
