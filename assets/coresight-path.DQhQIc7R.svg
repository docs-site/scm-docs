<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 500" role="img" aria-labelledby="cp-title cp-desc" xmlns="http://www.w3.org/2000/svg" id="coresight-path-root">
  <title id="cp-title">CoreSight 访问路径：SWD 到总线的四跳</title>
  <desc id="cp-desc">调试主机经 SWD 两线进入 SWJ-DP，再经 AHB-AP 与 AHB 总线矩阵访问 Flash、SRAM、外设和内核调试寄存器，全程不经过 CPU</desc>

  <defs>
      <style>#coresight-path-root .title { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 20px; font-weight: 600; fill: #2d3142; }
      #coresight-path-root .sub { font-family: "Microsoft YaHei", sans-serif; font-size: 12px; fill: #78828f; }
      #coresight-path-root .node { fill: #ffffff; stroke: #ccd2da; stroke-width: 1.2; }
      #coresight-path-root .bridge { fill: #f7f8fa; stroke: #ccd2da; stroke-width: 1.2; }
      #coresight-path-root .dest { fill: #ffffff; stroke: #ccd2da; stroke-width: 1.2; }
      #coresight-path-root .focal { fill: #fdf1ec; stroke: #bf4520; stroke-width: 1.4; }
      #coresight-path-root .name { font-family: "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
      #coresight-path-root .mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: #4f5d75; }
      #coresight-path-root .lbl { font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: #4f5d75; }
      #coresight-path-root .note { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 12.5px; fill: #4f5d75; }</style>
    <marker id="coresight-path-cp-ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#9aa4b2"/>
    </marker>
  </defs>

  <text class="title" x="24" y="38">CoreSight 访问路径：SWD 到总线的四跳</text>
  <text class="sub" x="936" y="38" text-anchor="end">调试主机 → SWJ-DP → AHB-AP → 总线矩阵 → 目标</text>

  <!-- 调试主机 -->
  <rect class="node" x="24" y="206" width="150" height="88" rx="6"/>
  <text class="name" x="99" y="242" text-anchor="middle">调试主机</text>
  <text class="sub" x="99" y="266" text-anchor="middle">J-Link / ST-Link</text>

  <line x1="174" y1="250" x2="214" y2="250" stroke="#9aa4b2" stroke-width="1.3" marker-end="url(#coresight-path-cp-ar)"/>
  <rect x="180" y="228" width="30" height="18" fill="#fafafa"/>
  <text class="lbl" x="195" y="242" text-anchor="middle">SWD</text>

  <!-- SWJ-DP -->
  <rect class="bridge" x="220" y="206" width="150" height="88" rx="6"/>
  <text class="name" x="295" y="242" text-anchor="middle">SWJ-DP</text>
  <text class="mono" x="295" y="266" text-anchor="middle">IDCODE 0x1BA01477</text>

  <line x1="370" y1="250" x2="410" y2="250" stroke="#9aa4b2" stroke-width="1.3" marker-end="url(#coresight-path-cp-ar)"/>
  <rect x="378" y="228" width="24" height="18" fill="#fafafa"/>
  <text class="lbl" x="390" y="242" text-anchor="middle">AP</text>

  <!-- AHB-AP -->
  <rect class="focal" x="416" y="206" width="150" height="88" rx="6"/>
  <text class="name" x="491" y="242" text-anchor="middle">AHB-AP</text>
  <text class="mono" x="491" y="266" text-anchor="middle">CSW / TAR / DRW</text>

  <line x1="566" y1="250" x2="606" y2="250" stroke="#9aa4b2" stroke-width="1.3" marker-end="url(#coresight-path-cp-ar)"/>
  <rect x="572" y="228" width="32" height="18" fill="#fafafa"/>
  <text class="lbl" x="588" y="242" text-anchor="middle">AHB</text>

  <!-- 总线矩阵 -->
  <rect class="bridge" x="612" y="88" width="130" height="304" rx="6"/>
  <text class="name" x="677" y="232" text-anchor="middle">AHB 总线矩阵</text>
  <text class="sub" x="677" y="254" text-anchor="middle">总线主设备</text>

  <!-- 三个目标：直线出口，与各目标中心对齐 -->
  <line x1="742" y1="106" x2="774" y2="106" stroke="#9aa4b2" stroke-width="1.3" marker-end="url(#coresight-path-cp-ar)"/>
  <line x1="742" y1="238" x2="774" y2="238" stroke="#9aa4b2" stroke-width="1.3" marker-end="url(#coresight-path-cp-ar)"/>
  <line x1="742" y1="370" x2="774" y2="370" stroke="#9aa4b2" stroke-width="1.3" marker-end="url(#coresight-path-cp-ar)"/>

  <rect class="dest" x="780" y="64" width="156" height="84" rx="6"/>
  <text class="name" x="796" y="90">Flash / SRAM</text>
  <text class="mono" x="796" y="112">0x0800_0000</text>
  <text class="mono" x="796" y="132">0x2000_0000</text>

  <rect class="dest" x="780" y="196" width="156" height="84" rx="6"/>
  <text class="name" x="796" y="222">APB 外设</text>
  <text class="mono" x="796" y="244">0x4000_0000 起</text>

  <rect class="dest" x="780" y="328" width="156" height="84" rx="6"/>
  <text class="name" x="796" y="354">内核调试寄存器</text>
  <text class="mono" x="796" y="376">PPB 0xE000_ED00</text>

  <!-- 编者按 -->
  <line x1="24" y1="430" x2="936" y2="430" stroke="#dde2e8" stroke-width="1"/>
  <text class="note" x="24" y="454">AHB-AP 是总线主设备：读写直接落在总线上，不经过 CPU 取指、译码、执行。</text>
  <text class="note" x="24" y="476">因此 CPU 停住、跑飞进 HardFault 时，调试器仍能读栈、读外设、改内存——这是 SWD 相对 printf 的根本差别。</text>
</svg>
