<svg id="isr-vector-chain-root" viewBox="0 0 1280 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="isr-vector-chain-title isr-vector-chain-desc">
        <title id="isr-vector-chain-title">中断发生到 ISR 执行的符号决议链路</title>
        <desc id="isr-vector-chain-desc">流程图：外设中断经 NVIC 裁决后由硬件按 VTOR 查向量表取向量，向量表表项是启动文件里的符号地址；工程实现了同名强符号就执行用户函数，否则落入 Default_Handler 死循环。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap');
      #isr-vector-chain-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace; }
      #isr-vector-chain-root { font-family: var(--font-sans); color: var(--color-ink); }</style>

          <marker id="isr-vector-chain-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="isr-vector-chain-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows -->
        <line x1="420" y1="124" x2="420" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#isr-vector-chain-arrow)"/>
        <line x1="420" y1="240" x2="420" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#isr-vector-chain-arrow)"/>
        <line x1="420" y1="352" x2="420" y2="394" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#isr-vector-chain-arrow)"/>
        <line x1="530" y1="436" x2="764" y2="436" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#isr-vector-chain-arrow)"/>
        <line x1="420" y1="478" x2="420" y2="522" stroke="#bf4520" stroke-width="1.2" marker-end="url(#isr-vector-chain-arrow-accent)"/>

        <!-- Arrow labels -->
        <rect x="608" y="412" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="624" y="424" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">是</text>

        <rect x="428" y="486" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="444" y="498" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">否</text>

        <!-- Step: 外设中断触发 -->
        <rect x="270" y="60" width="300" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="270" y="60" width="300" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="420" y="88" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">外设中断触发</text>
        <text x="420" y="110" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">IRQ n · NVIC 裁决通过</text>

        <!-- Step: 硬件取向量 -->
        <rect x="270" y="168" width="300" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="270" y="168" width="300" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="420" y="196" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">硬件按 VTOR 查向量表</text>
        <text x="420" y="218" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace" text-anchor="middle">表地址 = VTOR + 4 × (16 + n)</text>

        <!-- Step: 查向量表 -->
        <rect x="270" y="284" width="300" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="270" y="284" width="300" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="420" y="312" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">表项 = 启动文件里的符号地址</text>
        <text x="420" y="336" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace" text-anchor="middle">__Vectors DCD XXX_IRQHandler</text>

        <!-- Diamond -->
        <polygon points="310,436 420,394 530,436 420,478" fill="#f5f5f5"/>
        <polygon points="310,436 420,394 530,436 420,478" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.03"/>
        <text x="420" y="441" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">实现了同名强符号？</text>

        <!-- Branch: 是 -->
        <rect x="764" y="404" width="424" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="764" y="404" width="424" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="976" y="430" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">执行用户的 XXX_IRQHandler</text>
        <text x="976" y="452" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">强符号覆盖弱别名 · 完成后 EXC_RETURN 自动出栈返回</text>

        <!-- Branch: 否 -->
        <rect x="250" y="522" width="340" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="250" y="522" width="340" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="420" y="548" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">落入 Default_Handler</text>
        <text x="420" y="570" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">B . 死循环 —— 忘写中断函数的卡死就出在这里</text>

        <text x="88" y="636" fill="#5a6580" font-size="12" font-weight="400" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">链接器决议：同一符号强弱并存时取强符号；向量表在链接期固定，符号名一个字符都不能改。</text>
      </svg>
