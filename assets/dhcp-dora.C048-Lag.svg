<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="dhcpdora-title dhcpdora-desc">
<title id="dhcpdora-title">DHCP 的 DORA 四步交互</title>
<desc id="dhcpdora-desc">DHCP 的 DORA 四步交互</desc>
<rect width="1000" height="620" fill="#f5f5f5"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d75"/></marker>
<marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#bf4520"/></marker>
</defs>
<text x="40" y="46" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#2d3142" text-anchor="start" xml:space="preserve">DHCP 的 DORA 四步交互</text>
<text x="40" y="70" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start" xml:space="preserve">客户端起步时没有 IP，用 0.0.0.0 与 255.255.255.255 广播绕开「先有鸡还是先有蛋」</text>
<rect x="120" y="100" width="200" height="46" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="220.0" y="127.2432" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">客户端（板子/PC）</text>
<rect x="700" y="100" width="200" height="46" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="800.0" y="127.2432" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">DHCP 服务器 :67</text>
<path d="M220 146 L220 430" stroke="#c9ced8" stroke-width="1" fill="none" stroke-dasharray="4,4"/>
<path d="M800 146 L800 430" stroke="#c9ced8" stroke-width="1" fill="none" stroke-dasharray="4,4"/>
<path d="M220 190 L800 190" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
<text x="510" y="180" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">① DHCP DISCOVER</text>
<text x="510" y="208" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">广播：源 0.0.0.0，目的 255.255.255.255</text>
<path d="M800 250 L220 250" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="510" y="240" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">② DHCP OFFER</text>
<text x="510" y="268" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">服务器给出候选地址 192.168.16.100</text>
<path d="M220 310 L800 310" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
<text x="510" y="300" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">③ DHCP REQUEST</text>
<text x="510" y="328" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">广播：我选它（同时让落选的服务器回收）</text>
<path d="M800 370 L220 370" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="510" y="360" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">④ DHCP ACK</text>
<text x="510" y="388" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">确认并下发掩码 / 网关 / DNS / 租约</text>
<rect x="40" y="452" width="920" height="60" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="500.0" y="486.24319999999994" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle" xml:space="preserve">拿到地址后先用免费 ARP 自查冲突，确认无冲突才正式启用</text>
<rect x="40" y="532" width="920" height="60" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1" stroke-dasharray="4,3"/>
<text x="500.0" y="566.2432000000001" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle" xml:space="preserve">租约：到 50% 单播续租（T1），到 87.5% 广播续租（T2），到期必须停止使用</text>
</svg>
