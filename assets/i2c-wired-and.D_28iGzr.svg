<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="wired-and-title wired-and-desc">
  <title id="wired-and-title">I2C 的线与（wired-AND）原理</title>
  <desc id="wired-and-desc">三个开漏输出并联在同一根 SDA 上，任一设备拉低总线即为低，全部释放时由上拉电阻拉高，右表列出 A、B 两设备输出与总线电平的真值关系。</desc>

  <rect x="0" y="0" width="1000" height="560" fill="#fbfaf8"/>

  <!-- 标题 -->
  <text x="48" y="40" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="500" letter-spacing="2" fill="#5a6580">WIRED-AND</text>
  <text x="48" y="78" font-family="'Instrument Serif', Georgia, 'Songti SC', serif" font-size="24" fill="#2d3142">I2C 的线与：多设备共享一根线却不冲突</text>

  <!-- 分区标题 -->
  <text x="48" y="120" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#2d3142">① 电气等效：三个开漏输出并联在同一根 SDA 上</text>
  <text x="600" y="120" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#2d3142">② 线与真值：任一为 0，总线即为 0</text>

  <!-- 电源轨 -->
  <text x="48" y="146" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="12" fill="#5a6580">VDD 3.3V</text>
  <line x1="48" y1="156" x2="500" y2="156" stroke="#4f5d75" stroke-width="1.2"/>

  <!-- 上拉电阻 -->
  <line x1="300" y1="156" x2="300" y2="168" stroke="#4f5d75" stroke-width="1.2"/>
  <rect x="292" y="168" width="16" height="44" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <line x1="300" y1="212" x2="300" y2="236" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="320" y="198" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="12" fill="#4f5d75">Rp</text>
  <text x="320" y="216" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" font-size="12" fill="#5a6580">拉高</text>

  <!-- SDA 总线（焦点） -->
  <text x="48" y="228" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="12" fill="#5a6580">SDA</text>
  <line x1="48" y1="236" x2="500" y2="236" stroke="#3451b2" stroke-width="2"/>
  <circle cx="180" cy="236" r="4" fill="#3451b2"/>
  <circle cx="300" cy="236" r="4" fill="#3451b2"/>
  <circle cx="420" cy="236" r="4" fill="#3451b2"/>

  <!-- 设备 1：主机 -->
  <line x1="180" y1="236" x2="180" y2="272" stroke="#4f5d75" stroke-width="1.2"/>
  <circle cx="180" cy="276" r="4" fill="#2d3142"/>
  <circle cx="180" cy="312" r="4" fill="#2d3142"/>
  <line x1="180" y1="276" x2="202" y2="306" stroke="#2d3142" stroke-width="1.5"/>
  <line x1="180" y1="316" x2="180" y2="340" stroke="#4f5d75" stroke-width="1.2"/>
  <line x1="162" y1="340" x2="198" y2="340" stroke="#4f5d75" stroke-width="1.5"/>
  <line x1="169" y1="346" x2="191" y2="346" stroke="#4f5d75" stroke-width="1.5"/>
  <line x1="176" y1="352" x2="184" y2="352" stroke="#4f5d75" stroke-width="1.5"/>

  <!-- 设备 2：从机 1 -->
  <line x1="300" y1="236" x2="300" y2="272" stroke="#4f5d75" stroke-width="1.2"/>
  <circle cx="300" cy="276" r="4" fill="#2d3142"/>
  <circle cx="300" cy="312" r="4" fill="#2d3142"/>
  <line x1="300" y1="276" x2="322" y2="306" stroke="#2d3142" stroke-width="1.5"/>
  <line x1="300" y1="316" x2="300" y2="340" stroke="#4f5d75" stroke-width="1.2"/>
  <line x1="282" y1="340" x2="318" y2="340" stroke="#4f5d75" stroke-width="1.5"/>
  <line x1="289" y1="346" x2="311" y2="346" stroke="#4f5d75" stroke-width="1.5"/>
  <line x1="296" y1="352" x2="304" y2="352" stroke="#4f5d75" stroke-width="1.5"/>

  <!-- 设备 3：从机 2 -->
  <line x1="420" y1="236" x2="420" y2="272" stroke="#4f5d75" stroke-width="1.2"/>
  <circle cx="420" cy="276" r="4" fill="#2d3142"/>
  <circle cx="420" cy="312" r="4" fill="#2d3142"/>
  <line x1="420" y1="276" x2="442" y2="306" stroke="#2d3142" stroke-width="1.5"/>
  <line x1="420" y1="316" x2="420" y2="340" stroke="#4f5d75" stroke-width="1.2"/>
  <line x1="402" y1="340" x2="438" y2="340" stroke="#4f5d75" stroke-width="1.5"/>
  <line x1="409" y1="346" x2="431" y2="346" stroke="#4f5d75" stroke-width="1.5"/>
  <line x1="416" y1="352" x2="424" y2="352" stroke="#4f5d75" stroke-width="1.5"/>

  <!-- 设备标签 -->
  <text x="180" y="384" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#2d3142">主机</text>
  <text x="180" y="404" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" font-size="12" fill="#5a6580">开漏输出级</text>
  <text x="300" y="384" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#2d3142">从机 1</text>
  <text x="300" y="404" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" font-size="12" fill="#5a6580">开漏输出级</text>
  <text x="420" y="384" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#2d3142">从机 2</text>
  <text x="420" y="404" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" font-size="12" fill="#5a6580">开漏输出级</text>

  <!-- 真值表 -->
  <text x="640" y="160" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">设备 A</text>
  <text x="720" y="160" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">设备 B</text>
  <text x="830" y="160" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">总线 SDA</text>

  <line x1="600" y1="172" x2="900" y2="172" stroke="#2d3142" stroke-width="1.2"/>
  <line x1="600" y1="208" x2="900" y2="208" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.14"/>
  <line x1="600" y1="244" x2="900" y2="244" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.14"/>
  <line x1="600" y1="280" x2="900" y2="280" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.14"/>
  <line x1="600" y1="316" x2="900" y2="316" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.14"/>

  <text x="640" y="196" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="13" fill="#4f5d75">0</text>
  <text x="720" y="196" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="13" fill="#4f5d75">0</text>
  <text x="830" y="196" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="13" font-weight="600" fill="#2d3142">0</text>

  <text x="640" y="232" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="13" fill="#4f5d75">0</text>
  <text x="720" y="232" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="13" fill="#4f5d75">1</text>
  <text x="830" y="232" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="13" font-weight="600" fill="#2d3142">0</text>

  <text x="640" y="268" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="13" fill="#4f5d75">1</text>
  <text x="720" y="268" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="13" fill="#4f5d75">0</text>
  <text x="830" y="268" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="13" font-weight="600" fill="#2d3142">0</text>

  <text x="640" y="304" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="13" fill="#4f5d75">1</text>
  <text x="720" y="304" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="13" fill="#4f5d75">1</text>
  <text x="830" y="304" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="13" font-weight="600" fill="#2d3142">1</text>

  <text x="600" y="364" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#2d3142">两设备示例：SDA = A · B（逻辑与）</text>
  <text x="600" y="392" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" font-size="12" fill="#4f5d75">任一设备拉低 → 总线为低</text>
  <text x="600" y="416" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" font-size="12" fill="#4f5d75">全部释放（高阻）→ Rp 拉高</text>

  <!-- 底部注释 -->
  <line x1="48" y1="452" x2="952" y2="452" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.14"/>
  <text x="48" y="492" font-family="'Instrument Serif', Georgia, 'Songti SC', serif" font-style="italic" font-size="15" fill="#2d3142">线与没有推挽对冲：开漏只能把线拉低、谁都推不高，于是低电平天然获胜——这正是 I2C 多主仲裁与时钟同步的物理基础。</text>
  <text x="48" y="524" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" font-size="12" fill="#5a6580">注意：若换成推挽输出，一方输出高、一方输出低，就会形成 VDD→GND 的直通通路，可能损坏器件。</text>
</svg>
