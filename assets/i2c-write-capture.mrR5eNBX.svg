  <svg viewBox="0 0 1080 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="i2c-write-capture-title i2c-write-capture-desc">
    <title id="i2c-write-capture-title">I2C 写操作波形：地址 0x3C 加两个数据字节 0x2E</title>
    <desc id="i2c-write-capture-desc">从起始条件开始的写事务片段：7 位地址 0111100 加写位 0，从机应答；随后连续两个字节 00101110（0x2E）各自带一个从机应答，SCL 周期 10us，约 100kHz；停止条件 P 未画出。</desc>
