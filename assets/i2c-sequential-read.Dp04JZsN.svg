    <title id="i2c-seq-read-title">I2C 连续读时序</title>
    <desc id="i2c-seq-read-desc">主机用伪写把从机地址指针移到目标地址, 再用重复起始 Sr 把方向换成读; 每收完一个字节回 ACK 要求继续送, 最后一个字节回 NACK, 然后发停止信号 P。</desc>
