<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sm-title sm-desc" id="slot-state-root">
        <title id="sm-title">升级记录的状态流转</title>
        <desc id="sm-desc">升级记录在稳定态、下载完成、待确认三个状态之间流转，go flash 搬运把镜像装上，upd ok 关闭回滚窗口。</desc>
        <defs>
      <style>#slot-state-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; }
      #slot-state-root { font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--color-ink); }
      #slot-state-root .diagram-container { width: 100%; overflow-x: auto; }
      #slot-state-root .n { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
      #slot-state-root .s { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
      #slot-state-root .m { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
      #slot-state-root .k { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
      #slot-state-root .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }</style>
          <marker id="slot-state-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="slot-state-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <style>
          .n  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
          .s  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
          .m  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
          .k  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
          .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }
        </style>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== 转移（先画线） ===== -->
        <!-- 稳定态 -> 下载完成 -->
        <line x1="302" y1="305" x2="384" y2="305" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#slot-state-arrow)"/>
        <rect x="304" y="286" width="80" height="18" fill="#f5f5f5"/>
        <text class="s" x="344" y="300" text-anchor="middle">upd update</text>

        <!-- 下载完成 -> 待确认 -->
        <line x1="612" y1="305" x2="694" y2="305" stroke="#bf4520" stroke-width="1.6" marker-end="url(#slot-state-arrow-accent)"/>
        <rect x="612" y="286" width="88" height="18" fill="#f5f5f5"/>
        <text class="s" x="656" y="300" text-anchor="middle">go flash 搬运</text>

        <!-- 待确认 -> 稳定态（上回路） -->
        <path d="M 808 260 L 808 176 Q 808 168 800 168 L 198 168 Q 190 168 190 176 L 190 254"
              fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#slot-state-arrow)"/>
        <rect x="460" y="158" width="76" height="18" fill="#f5f5f5"/>
        <text class="s" x="498" y="172" text-anchor="middle">upd ok 确认</text>

        <!-- 待确认 -> 下载完成（下回路） -->
        <path d="M 712 350 L 712 442 Q 712 450 704 450 L 508 450 Q 500 450 500 442 L 500 356"
              fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#slot-state-arrow)"/>
        <rect x="554" y="440" width="140" height="18" fill="#f5f5f5"/>
        <text class="s" x="624" y="454" text-anchor="middle">再下载新版本</text>

        <!-- ===== 状态节点 ===== -->
        <rect x="80" y="260" width="222" height="90" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2" stroke-opacity="0.8"/>
        <text class="k" x="96" y="284">STABLE</text>
        <text class="n" x="96" y="306">稳定态</text>
        <text class="m" x="96" y="328">confirmed = 1 · pending = 0</text>

        <rect x="390" y="260" width="222" height="90" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2" stroke-opacity="0.8"/>
        <text class="k" x="406" y="284">READY</text>
        <text class="n" x="406" y="306">下载完成</text>
        <text class="m" x="406" y="328">pending = 1 · 指向空闲槽</text>

        <rect x="700" y="260" width="222" height="90" rx="6" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.6"/>
        <text class="k" x="716" y="284">UNCONFIRMED</text>
        <text class="n" x="716" y="306">待确认</text>
        <text class="m" x="716" y="328">confirmed = 0 · pending = 0</text>

        <!-- ===== 注释 ===== -->
        <text class="nt" x="80" y="500">"待确认"就是回滚窗口：内部 Flash 已是新程序，但还没人担保它好使。</text>
        <text class="nt" x="80" y="522">目前没有自动回滚，未确认只影响记录语义；再下载会覆盖那份备份。</text>

        <!-- ===== 图例 ===== -->
        <line x1="56" y1="540" x2="924" y2="540" stroke="#2d3142" stroke-opacity="0.14" stroke-width="1"/>
        <text class="k" x="712" y="62">LEGEND</text>
        <rect x="788" y="50" width="14" height="12" rx="2" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.4"/>
        <text class="s" x="810" y="61">回滚窗口</text>
      </svg>
