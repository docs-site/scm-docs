CK（第 9 个时钟，从机拉低 SDA 表示收到）</text><polygon points="652.068,278.639,663.78,283.324,652.068,288.009,656.753,283.324" fill="#5A5A5A" style="stroke:#5A5A5A;stroke-width:1.171;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="54.478" y1="283.324" x2="659.095" y2="283.324" style="stroke:#5A5A5A;stroke-width:1.171;"/><text x="62.677" y="277.39" fill="#333" font-size="15.226" textLength="212.469" font-family="'Segoe UI'">寄存器（字）地址（9 个时钟）</text><polygon points="67.362,312.76,55.649,317.445,67.362,322.13,62.677,317.445" fill="#5A5A5A" style="stroke:#5A5A5A;stroke-width:1.171;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="60.334" y1="317.445" x2="664.951" y2="317.445" style="stroke:#5A5A5A;stroke-width:1.171;stroke-dasharray:2.343,2.343;"/><text x="74.389" y="311.512" fill="#333" font-size="15.226" textLength="31.032" font-family="'Segoe UI'">ACK</text><polygon points="652.068,346.882,663.78,351.567,652.068,356.252,656.753,351.567" fill="#5A5A5A" style="stroke:#5A5A5A;stroke-width:1.171;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="54.478" y1="351.567" x2="659.095" y2="351.567" style="stroke:#5A5A5A;stroke-width:1.171;"/><text x="62.677" y="345.634" fill="#333" font-size="15.226" textLength="583.535" font-family="'Segoe UI'">重复起始 Sr + 设备地址+R（9 个时钟：重新寻址、切换读方向，并保住总线控制权）</text><polygon points="67.362,381.004,55.649,385.689,67.362,390.374,62.677,385.689" fill="#5A5A5A" style="stroke:#5A5A5A;stroke-width:1.171;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="60.334" y1="385.689" x2="664.951" y2="385.689" style="stroke:#5A5A5A;stroke-width:1.171;stroke-dasharray:2.343,2.343;"/><text x="74.389" y="379.756" fill="#333" font-size="15.226" textLength="31.032" font-family="'Segoe UI'">ACK</text><rect x="11.713" y="419.829" width="696.575" height="3.514" fill="#FFF" style="stroke:#FFF;stroke-width:1.171;"/><line x1="11.713" y1="419.829" x2="708.287" y2="419.829" style="stroke:#000;stroke-width:0.586;"/><line x1="11.713" y1="423.343" x2="708.287" y2="423.343" s