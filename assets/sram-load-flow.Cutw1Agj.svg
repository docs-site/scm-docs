<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" role="img" aria-labelledby="loadTitle loadDesc" id="sram-load-flow-root">
  <title id="loadTitle">SRAM APP 的搬运与跳转流程</title>
  <desc id="loadDesc">go sram 依次做五件事：校验暂存区向量表、整块拷贝 24KB 到 SRAM、回读 CRC32 比对、再查 SRAM 向量表、最后切向量表与栈顶并跳转；任一判定失败则留在 Bootloader。</desc>

  <rect x="0" y="0" width="940" height="460" fill="#f5f5f5"/>
  <defs>
    <marker id="sram-load-flow-la" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
    </marker>
    <marker id="sram-load-flow-lm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/>
    </marker>
  </defs>

  <text x="40" y="36" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="10" letter-spacing="2" fill="#4f5d75">GO SRAM · LOAD FLOW</text>

  <!-- 左：两块介质 -->
  <g font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
    <text x="40" y="66" font-size="12" font-weight="600" fill="#4f5d75">介质之间的搬运</text>

    <rect x="40" y="82" width="360" height="92" rx="6" fill="#f7e3dc" stroke="#bf4520" stroke-width="1.4"/>
    <text x="60" y="110" font-size="13" font-weight="600" fill="#2d3142">内部 FLASH · 暂存区</text>
    <text x="60" y="132" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" fill="#4f5d75">0x08040000</text>
    <text x="60" y="154" font-size="12" fill="#4f5d75">源：收帧时落盘的镜像，掉电后仍在</text>

    <rect x="40" y="256" width="360" height="92" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="60" y="284" font-size="13" font-weight="600" fill="#2d3142">内部 SRAM · 运行容器</text>
    <text x="60" y="306" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" fill="#4f5d75">0x20007000</text>
    <text x="60" y="328" font-size="12" fill="#4f5d75">目的：24 KB，掉电即失</text>
  </g>

  <path d="M 220 174 L 220 256" fill="none" stroke="#bf4520" stroke-width="1.8" marker-end="url(#sram-load-flow-la)"/>
  <text x="236" y="206" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#bf4520">memcpy 24576 字节</text>
  <text x="236" y="226" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75">固定搬满整个容器，不按帧头长度</text>

  <!-- 右：五个步骤 -->
  <g font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
    <text x="470" y="66" font-size="12" font-weight="600" fill="#4f5d75">五个判定与动作</text>

    <circle cx="492" cy="100" r="11" fill="#2d3142"/>
    <text x="492" y="104" text-anchor="middle" font-size="12" fill="#ffffff">1</text>
    <text x="516" y="96" font-size="13" font-weight="600" fill="#2d3142">校验暂存区向量表</text>
    <text x="516" y="116" font-size="12" fill="#4f5d75">栈顶在内部 RAM，复位向量在 0x20007000 ~ 0x2000D000 且最低位为 1</text>

    <circle cx="492" cy="160" r="11" fill="#2d3142"/>
    <text x="492" y="164" text-anchor="middle" font-size="12" fill="#ffffff">2</text>
    <text x="516" y="156" font-size="13" font-weight="600" fill="#2d3142">整块拷贝</text>
    <text x="516" y="176" font-size="12" fill="#4f5d75">0x08040000 → 0x20007000，24576 字节逐字节搬</text>

    <circle cx="492" cy="220" r="11" fill="#2d3142"/>
    <text x="492" y="224" text-anchor="middle" font-size="12" fill="#ffffff">3</text>
    <text x="516" y="216" font-size="13" font-weight="600" fill="#2d3142">回读 CRC32 比对</text>
    <text x="516" y="236" font-size="12" fill="#4f5d75">对源与目的各算一次，不一致就判失败</text>

    <circle cx="492" cy="280" r="11" fill="#bf4520"/>
    <text x="492" y="284" text-anchor="middle" font-size="12" fill="#ffffff">4</text>
    <text x="516" y="276" font-size="13" font-weight="600" fill="#2d3142">iap_load_app(0x20007000)</text>
    <text x="516" y="296" font-size="12" fill="#4f5d75">再查一次向量表，这次查的是 SRAM 里的那一份</text>

    <circle cx="492" cy="340" r="11" fill="#bf4520"/>
    <text x="492" y="344" text-anchor="middle" font-size="12" fill="#ffffff">5</text>
    <text x="516" y="336" font-size="13" font-weight="600" fill="#2d3142">交权</text>
    <text x="516" y="356" font-size="12" fill="#4f5d75">停 SysTick 与串口中断 → VTOR → MSP → 跳 Reset_Handler</text>
  </g>

  <rect x="470" y="386" width="430" height="52" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="492" y="410" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#bf4520">任一步判定失败 → 打印原因，留在 Bootloader，不跳转</text>
  <text x="492" y="428" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" fill="#4f5d75">no sram-app image / sram load ... failed</text>

  <text x="40" y="410" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75">搬运长度取容器容量而非帧头长度：</text>
  <text x="40" y="430" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75">暂存区未写到的尾部是 0xFF，落在容器内不会被执行到。</text>
</svg>
