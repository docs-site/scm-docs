<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="double-copy-write-title double-copy-write-desc" id="double-copy-write-root">
        <title id="double-copy-write-title">双副本参数区的写入与掉电</title>
        <desc id="double-copy-write-desc">四个连续状态：两份副本序号相同时开始写入；写到一半掉电时被写的那份损坏、另一份仍完整可读；重新写入后新副本序号加一；最终两份同步为新序号。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap');
      #double-copy-write-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace; }
      #double-copy-write-root { font-family: var(--font-sans); color: var(--color-ink); }</style>
          <marker id="double-copy-write-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <line x1="292" y1="124" x2="332" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#double-copy-write-arrow)"/>
        <line x1="580" y1="124" x2="620" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#double-copy-write-arrow)"/>
        <line x1="868" y1="124" x2="908" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#double-copy-write-arrow)"/>

        <!-- ① 两份一致 -->
        <text x="168" y="60" fill="#5a6580" font-size="12" font-weight="500" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">① 起始，两份一致</text>
        <rect x="44" y="72" width="248" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.24" stroke-width="1"/>
        <text x="64" y="105" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">副本 1 · seq=7</text>
        <text x="272" y="105" fill="#4f5d75" font-size="12" text-anchor="end" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">完整</text>
        <text x="64" y="153" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">副本 2 · seq=7</text>
        <text x="272" y="153" fill="#4f5d75" font-size="12" text-anchor="end" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">完整</text>

        <!-- ② 写副本 2 时掉电 -->
        <text x="456" y="60" fill="#5a6580" font-size="12" font-weight="500" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">② 写副本 2 时掉电</text>
        <rect x="332" y="72" width="248" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.24" stroke-width="1"/>
        <text x="352" y="105" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">副本 1 · seq=7</text>
        <text x="560" y="105" fill="#4f5d75" font-size="12" text-anchor="end" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">完整</text>
        <text x="352" y="153" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">副本 2</text>
        <text x="560" y="153" fill="#bf4520" font-size="12" font-weight="500" text-anchor="end" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">损坏</text>

        <!-- ③ 重写另一份 -->
        <text x="744" y="60" fill="#5a6580" font-size="12" font-weight="500" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">③ 写副本 1 时掉电</text>
        <rect x="620" y="72" width="248" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.24" stroke-width="1"/>
        <text x="640" y="105" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">副本 1</text>
        <text x="848" y="105" fill="#bf4520" font-size="12" font-weight="500" text-anchor="end" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">损坏</text>
        <text x="640" y="153" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">副本 2 · seq=8</text>
        <text x="848" y="153" fill="#4f5d75" font-size="12" text-anchor="end" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">完整</text>

        <!-- ④ 两份同步 -->
        <text x="1032" y="60" fill="#5a6580" font-size="12" font-weight="500" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">④ 写入完成，两份同步</text>
        <rect x="908" y="72" width="248" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.24" stroke-width="1"/>
        <text x="928" y="105" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">副本 1 · seq=8</text>
        <text x="1136" y="105" fill="#4f5d75" font-size="12" text-anchor="end" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">完整</text>
        <text x="928" y="153" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">副本 2 · seq=8</text>
        <text x="1136" y="153" fill="#4f5d75" font-size="12" text-anchor="end" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">完整</text>

        <text x="44" y="212" fill="#5a6580" font-size="12" font-weight="400" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">规则：每次更新按固定顺序重写两份（先副本 2 后副本 1），新序号 = 旧序号 + 1；读取时取「序号大且校验通过」的那一份，因此任意时刻掉电至少有一份完整副本存活。</text>
</svg>
