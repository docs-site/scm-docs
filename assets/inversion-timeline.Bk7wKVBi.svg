<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 592" role="img" aria-labelledby="it-title it-desc" xmlns="http://www.w3.org/2000/svg" id="inversion-timeline-root">
  <title id="it-title">优先级反转时间线：semaphore 与 mutex 对比</title>
  <desc id="it-desc">上块 semaphore 无优先级继承，高优先级等锁 2097 毫秒；下块 mutex 优先级继承生效，等锁 698 毫秒。红色虚线标记关键事件时刻。</desc>
  <defs>
      <style>#inversion-timeline-root text { font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif; }
      #inversion-timeline-root .label { font-size: 13px; font-weight: 600; fill: #2d3142; }
      #inversion-timeline-root .sub { font-size: 12px; font-weight: 500; fill: #4f5d75; }
      #inversion-timeline-root .mono { font-family: Consolas, 'Courier New', monospace; font-size: 11px; fill: #4f5d75; }
      #inversion-timeline-root .note { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 13px; fill: #4f5d75; }
      #inversion-timeline-root .lane { font-size: 13px; font-weight: 600; fill: #2d3142; }
      #inversion-timeline-root .run { fill: #ffffff; stroke: #2d3142; stroke-width: 1.1; }
      #inversion-timeline-root .block { fill: #ebe8e3; stroke: #4f5d75; stroke-width: 1; stroke-dasharray: 4 3; }
      #inversion-timeline-root .stall { fill: #ebe8e3; }
      #inversion-timeline-root .inher { fill: #ffffff; stroke: #bf4520; stroke-width: 1.4; }
      #inversion-timeline-root .lock { fill: #eddad2; stroke: #bf4520; stroke-width: 1.1; }
      #inversion-timeline-root .evt { stroke: #bf4520; stroke-width: 1; stroke-dasharray: 3 3; }</style>
  </defs>

  <text class="label" x="40" y="28">优先级反转时间线：同一份代码，只换一把锁</text>
  <text class="sub" x="40" y="50">stm32f103 实测 · invLow 持锁 800 ms，invMid 忙等 2000 ms，invHigh t=100 来抢锁</text>

  <!-- 图例 -->
  <rect class="run" x="40" y="66" width="12" height="12"/>
  <text class="sub" x="58" y="77">运行</text>
  <rect class="block" x="104" y="66" width="12" height="12"/>
  <text class="sub" x="122" y="77">阻塞等锁</text>
  <rect class="stall" x="206" y="66" width="12" height="12"/>
  <text class="sub" x="224" y="77">就绪却抢不到 CPU</text>
  <rect class="inher" x="356" y="66" width="12" height="12"/>
  <text class="sub" x="374" y="77">继承抬升期</text>
  <rect class="lock" x="470" y="66" width="12" height="12"/>
  <text class="sub" x="488" y="77">持锁运行</text>
  <line x1="586" y1="66" x2="586" y2="78" class="evt"/>
  <text class="sub" x="594" y="77">事件时刻</text>

  <!-- ===== 块 A：semaphore ===== -->
  <text class="label" x="40" y="112">inv sem —— 无继承，反转敞开（high 实测 waited 2097 ms）</text>
  <text x="213" y="126" text-anchor="middle"><tspan class="mono">t=107 </tspan><tspan class="sub">H 阻塞</tspan></text>
  <text x="669" y="126" text-anchor="end"><tspan class="sub">mid 结束，low 还锁，high 醒 </tspan><tspan class="mono">t=2207</tspan></text>
  <line x1="213" y1="132" x2="213" y2="216" class="evt"/>
  <line x1="669" y1="132" x2="669" y2="264" class="evt"/>

  <text x="182" y="158" text-anchor="end"><tspan class="lane">invHigh</tspan><tspan class="sub"> · 高 33</tspan></text>
  <rect class="block" x="213" y="136" width="456" height="36"/>
  <text class="sub" x="441" y="158" text-anchor="middle">阻塞等锁 · waited 2097 ms</text>

  <text x="182" y="202" text-anchor="end"><tspan class="lane">invMid</tspan><tspan class="sub"> · 中 24</tspan></text>
  <rect class="run" x="235" y="180" width="434" height="36"/>
  <text class="sub" x="452" y="202" text-anchor="middle">忙等 2000 ms（不需要锁）</text>

  <text x="182" y="246" text-anchor="end"><tspan class="lane">invLow</tspan><tspan class="sub"> · 低 8</tspan></text>
  <rect class="lock" x="192" y="224" width="43" height="36"/>
  <text class="sub" x="213" y="246" text-anchor="middle">持锁</text>
  <rect class="stall" x="235" y="224" width="434" height="36"/>
  <text class="sub" x="452" y="246" text-anchor="middle">持锁却抢不到 CPU，无法释放</text>

  <line x1="190" y1="272" x2="690" y2="272" stroke="#2d3142" stroke-width="1"/>
  <line x1="190" y1="268" x2="190" y2="276" stroke="#2d3142" stroke-width="1"/>
  <text class="mono" x="190" y="290" text-anchor="middle">0</text>
  <line x1="299" y1="268" x2="299" y2="276" stroke="#4f5d75" stroke-width="1"/>
  <text class="mono" x="299" y="290" text-anchor="middle">500</text>
  <line x1="407" y1="268" x2="407" y2="276" stroke="#4f5d75" stroke-width="1"/>
  <text class="mono" x="407" y="290" text-anchor="middle">1000</text>
  <line x1="516" y1="268" x2="516" y2="276" stroke="#4f5d75" stroke-width="1"/>
  <text class="mono" x="516" y="290" text-anchor="middle">1500</text>
  <line x1="624" y1="268" x2="624" y2="276" stroke="#4f5d75" stroke-width="1"/>
  <text class="mono" x="624" y="290" text-anchor="middle">2000 ms</text>

  <!-- ===== 块 B：mutex ===== -->
  <text class="label" x="40" y="324">inv mutex —— 优先级继承生效（high 实测 waited 698 ms）</text>
  <text x="365" y="338" text-anchor="middle"><tspan class="mono">t=808 </tspan><tspan class="sub">L 还锁，H 醒</tspan></text>
  <text x="669" y="338" text-anchor="end"><tspan class="sub">mid 结束 </tspan><tspan class="mono">t=2207</tspan></text>
  <line x1="365" y1="344" x2="365" y2="472" class="evt"/>
  <line x1="669" y1="344" x2="669" y2="472" class="evt"/>

  <text x="182" y="366" text-anchor="end"><tspan class="lane">invHigh</tspan><tspan class="sub"> · 高 33</tspan></text>
  <rect class="block" x="213" y="344" width="152" height="36"/>
  <text class="sub" x="289" y="366" text-anchor="middle">阻塞等锁</text>
  <text class="sub" x="374" y="366" fill="#bf4520">got lock, waited 698 ms</text>

  <text x="182" y="410" text-anchor="end"><tspan class="lane">invMid</tspan><tspan class="sub"> · 中 24</tspan></text>
  <rect class="stall" x="213" y="388" width="153" height="36"/>
  <text class="sub" x="289" y="410" text-anchor="middle">被压排队</text>
  <rect class="run" x="366" y="388" width="303" height="36"/>
  <text class="sub" x="517" y="410" text-anchor="middle">忙等 2000 ms · 起步推迟到 t=812</text>

  <text x="182" y="454" text-anchor="end"><tspan class="lane">invLow</tspan><tspan class="sub"> · 低 8</tspan></text>
  <rect class="inher" x="192" y="432" width="173" height="36"/>
  <text class="sub" x="278" y="454" text-anchor="middle">持锁 · 被抬到 33</text>
  <rect class="stall" x="365" y="432" width="304" height="36"/>
  <text class="sub" x="517" y="454" text-anchor="middle">打印排队 · released lock 拖到 t=2207</text>

  <line x1="190" y1="480" x2="690" y2="480" stroke="#2d3142" stroke-width="1"/>
  <line x1="190" y1="476" x2="190" y2="484" stroke="#2d3142" stroke-width="1"/>
  <text class="mono" x="190" y="498" text-anchor="middle">0</text>
  <line x1="299" y1="476" x2="299" y2="484" stroke="#4f5d75" stroke-width="1"/>
  <text class="mono" x="299" y="498" text-anchor="middle">500</text>
  <line x1="407" y1="476" x2="407" y2="484" stroke="#4f5d75" stroke-width="1"/>
  <text class="mono" x="407" y="498" text-anchor="middle">1000</text>
  <line x1="516" y1="476" x2="516" y2="484" stroke="#4f5d75" stroke-width="1"/>
  <text class="mono" x="516" y="498" text-anchor="middle">1500</text>
  <line x1="624" y1="476" x2="624" y2="484" stroke="#4f5d75" stroke-width="1"/>
  <text class="mono" x="624" y="498" text-anchor="middle">2000 ms</text>

  <!-- 底部结论 -->
  <text class="sub" x="40" y="530">同一段代码只换一把锁：sem 版 high 等 2097 ms，mutex 版只等 698 ms —— 差距就是 mid 那 2000 ms 忙等</text>
  <text class="sub" x="40" y="552">继承的代价由 mid 承担：起步从 t=207 推迟到 t=812；收益归 high，等锁时间缩回临界区本身</text>
  <text class="sub" x="40" y="574">日志时刻不等于动作时刻：mutex 版 low 的锁在 t≈805 已归还，released lock 这行打印被压到 t=2207 才发出</text>
</svg>
