<svg id="hal-callback-layers-root" viewBox="0 0 1280 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hal-callback-layers-title hal-callback-layers-desc">
        <title id="hal-callback-layers-title">HAL 库的三层中断结构与回调命名对照</title>
        <desc id="hal-callback-layers-desc">分层图：向量表入口层 XXX_IRQHandler 调用 HAL 统一层 HAL_XXX_IRQHandler 完成判标志与清标志，再转发到用户回调层 HAL_XXX_Callback；右侧给出 UART、EXTI、定时器、DMA 四组命名对照。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap');
      #hal-callback-layers-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace; }
      #hal-callback-layers-root { font-family: var(--font-sans); color: var(--color-ink); }</style>

          <marker id="hal-callback-layers-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="hal-callback-layers-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (左侧层间) -->
        <line x1="368" y1="176" x2="368" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#hal-callback-layers-arrow)"/>
        <line x1="368" y1="320" x2="368" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#hal-callback-layers-arrow)"/>

        <!-- Arrow labels -->
        <rect x="376" y="188" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="396" y="200" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">调用</text>
        <rect x="376" y="332" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="396" y="344" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">转发</text>

        <!-- Layer 1 -->
        <rect x="88" y="72" width="560" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="88" y="72" width="560" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="112" y="92" width="140" height="22" rx="2" fill="#2d3142" fill-opacity="0.05"/>
        <text x="122" y="107" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">第 1 层 · 入口</text>
        <text x="368" y="146" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace" text-anchor="middle">XXX_IRQHandler</text>
        <text x="368" y="164" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">名字由启动文件向量表写死 · 一个向量对应一个名字</text>

        <!-- Layer 2 -->
        <rect x="88" y="216" width="560" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="88" y="216" width="560" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="112" y="236" width="200" height="22" rx="2" fill="#2d3142" fill-opacity="0.05"/>
        <text x="122" y="251" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">第 2 层 · HAL 统一处理</text>
        <text x="368" y="290" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace" text-anchor="middle">HAL_XXX_IRQHandler()</text>
        <text x="368" y="308" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">判标志 · 清标志 · 转发——用户不要再清一遍</text>

        <!-- Layer 3 (focal) -->
        <rect x="88" y="360" width="560" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="88" y="360" width="560" height="104" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="112" y="380" width="184" height="22" rx="2" fill="#bf4520" fill-opacity="0.08"/>
        <text x="122" y="395" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">第 3 层 · 用户回调</text>
        <text x="368" y="434" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace" text-anchor="middle">HAL_XXX_Callback()</text>
        <text x="368" y="452" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">HAL 里是 __weak 空函数 · 用户写同名函数即可生效</text>

        <!-- 右列：命名对照 -->
        <rect x="736" y="72" width="456" height="40" rx="6" fill="#2d3142" fill-opacity="0.05"/>
        <text x="964" y="98" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">命名对照 · 三层共用同一前缀</text>

        <rect x="736" y="124" width="456" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="736" y="124" width="456" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="760" y="152" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">USART1_IRQHandler</text>
        <text x="760" y="178" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">→ HAL_UART_IRQHandler</text>
        <text x="760" y="204" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">→ HAL_UART_RxCpltCallback / TxCpltCallback</text>

        <rect x="736" y="240" width="456" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="736" y="240" width="456" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="760" y="268" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">EXTI0_IRQHandler</text>
        <text x="760" y="294" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">→ HAL_GPIO_EXTI_IRQHandler</text>
        <text x="760" y="320" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">→ HAL_GPIO_EXTI_Callback(uint16_t GPIO_Pin)</text>

        <rect x="736" y="356" width="456" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="736" y="356" width="456" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="760" y="384" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">TIM3_IRQHandler</text>
        <text x="760" y="410" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">→ HAL_TIM_IRQHandler</text>
        <text x="760" y="436" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">→ HAL_TIM_PeriodElapsedCallback(TIM_HandleTypeDef*)</text>

        <rect x="736" y="472" width="456" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="736" y="472" width="456" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="760" y="500" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">DMA1_Channel1_IRQHandler</text>
        <text x="760" y="526" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">→ HAL_DMA_IRQHandler</text>
        <text x="760" y="552" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">→ HAL_DMA_XferCpltCallback(DMA_HandleTypeDef*)</text>

        <text x="88" y="632" fill="#5a6580" font-size="12" font-weight="400" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">用户只写第 3 层；第 1 层函数名一个字符都不能改，第 2 层已替你清标志——在回调里再清一遍反而会打架。</text>
      </svg>
