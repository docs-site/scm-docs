    <title id="i2c-read-capture-title">I2C 读操作波形：写命令 + 重复起始 Sr + 读回一个字节</title>
    <desc id="i2c-read-capture-desc">主机先发送写地址字节 0x3C 和命令字 0x31，收到应答后用重复起始 Sr 切换方向，再发送读地址字节 0x3D；从机应答后送出数据 0x68。两个地址字节对应的 7 位从机地址均为 0x1E。</desc>
