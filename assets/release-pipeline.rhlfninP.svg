<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="release-pipeline-title release-pipeline-desc" id="release-pipeline-root">
        <title id="release-pipeline-title">OTA 发布流水线与灰度策略</title>
        <desc id="release-pipeline-desc">流程图：代码提交后经 CI 构建、镜像签名、差分包生成进入制品库，再按灰度批次发布到设备，设备上报结果，异常率超阈值时暂停发布并回滚。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #release-pipeline-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace; }
      #release-pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #release-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      #release-pipeline-root .diagram-container { overflow-x: visible; }</style>
          <marker id="release-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="release-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="release-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Row 1 arrows -->
        <line x1="340" y1="232" x2="392" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#release-pipeline-arrow)"/>
        <line x1="600" y1="232" x2="652" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#release-pipeline-arrow)"/>
        <line x1="860" y1="232" x2="912" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#release-pipeline-arrow)"/>
        <line x1="1020" y1="264" x2="1020" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#release-pipeline-arrow)"/>

        <!-- Row 2 arrows (right to left) -->
        <line x1="920" y1="460" x2="868" y2="460" stroke="#bf4520" stroke-width="1.4" marker-end="url(#release-pipeline-arrow-accent)"/>
        <line x1="660" y1="460" x2="608" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#release-pipeline-arrow)"/>
        <line x1="400" y1="460" x2="348" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#release-pipeline-arrow)"/>

        <!-- Dashed return: 设备上报 -> 制品库 -->
        <path d="M 240,492 V 556 Q 240,564 248,564 H 1012 Q 1020,564 1020,556 V 496" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#release-pipeline-arrow)"/>

        <!-- Arrow labels -->
        <rect x="486" y="206" width="88" height="16" rx="2" fill="#f5f5f5"/>
        <text x="530" y="218" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">构建镜像</text>

        <rect x="932" y="206" width="88" height="16" rx="2" fill="#f5f5f5"/>
        <text x="976" y="218" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">写入制品库</text>

        <rect x="1028" y="332" width="88" height="16" rx="2" fill="#f5f5f5"/>
        <text x="1072" y="344" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">取包发布</text>

        <rect x="752" y="434" width="72" height="16" rx="2" fill="#f5f5f5"/>
        <text x="788" y="446" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">放量</text>

        <rect x="486" y="434" width="88" height="16" rx="2" fill="#f5f5f5"/>
        <text x="530" y="446" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">全量推送</text>

        <rect x="558" y="538" width="180" height="16" rx="2" fill="#f5f5f5"/>
        <text x="648" y="550" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">异常率超阈值则暂停并回滚</text>

        <!-- Node: 代码提交 -->
        <rect x="140" y="200" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="140" y="200" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240" y="226" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">代码提交</text>
        <text x="240" y="246" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">打 tag 触发流水线</text>

        <!-- Node: CI 构建 -->
        <rect x="400" y="200" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="200" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="226" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">CI 构建与测试</text>
        <text x="500" y="246" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">编译 · 单测 · 版本号注入</text>

        <!-- Node: 镜像签名 -->
        <rect x="660" y="200" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="660" y="200" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="760" y="226" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">离线签名</text>
        <text x="760" y="246" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">私钥在签名服务器</text>

        <!-- Node: 差分包生成 -->
        <rect x="920" y="200" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="920" y="200" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="1020" y="226" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">整包与差分包</text>
        <text x="1020" y="246" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">按历史版本批量生成</text>

        <!-- Node: 制品库 -->
        <rect x="920" y="428" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="920" y="428" width="200" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="1020" y="454" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">制品库</text>
        <text x="1020" y="474" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">版本 · 哈希 · 适用型号</text>

        <!-- Node: 灰度发布 (focal) -->
        <rect x="660" y="428" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="660" y="428" width="200" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="760" y="454" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">灰度发布</text>
        <text x="760" y="474" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">1% 到 10% 到 50% 分批</text>

        <!-- Node: 全量发布 -->
        <rect x="400" y="428" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="428" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="454" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">全量发布</text>
        <text x="500" y="474" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">观察窗口后放量</text>

        <!-- Node: 设备上报 -->
        <rect x="140" y="428" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="140" y="428" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240" y="454" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">设备上报</text>
        <text x="240" y="474" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">升级结果 · 成功率 · 重启次数</text>
      </svg>
