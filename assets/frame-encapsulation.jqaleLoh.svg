<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="fe-title fe-desc">
<title id="fe-title">逐层封装与以太网帧字段</title>
<desc id="fe-desc">发送时逐层加头，以及以太网帧的字段与长度</desc>
<rect width="1000" height="640" fill="#f5f5f5"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d75"/></marker>
<marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#bf4520"/></marker>
</defs>
<text x="40" y="46" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#2d3142" text-anchor="start" xml:space="preserve">逐层封装与以太网帧字段</text>
<text x="40" y="70" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start" xml:space="preserve">上半部分是一次 ping 应答的报文体，下半部分是交给网卡的以太网帧</text>

<text x="40" y="120" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start" xml:space="preserve">一、发送方向：逐层加头</text>

<rect x="40" y="140" width="200" height="76" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="140.0" y="170" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">以太网头</text>
<text x="140.0" y="192" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">14 字节</text>

<rect x="248" y="140" width="200" height="76" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="348.0" y="170" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">IP 头</text>
<text x="348.0" y="192" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">20 字节</text>

<rect x="456" y="140" width="160" height="76" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="536.0" y="170" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">ICMP 头</text>
<text x="536.0" y="192" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">8 字节</text>

<rect x="624" y="140" width="176" height="76" rx="6" fill="#fdf3ef" stroke="#bf4520" stroke-width="1"/>
<text x="712.0" y="170" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#bf4520" text-anchor="middle" xml:space="preserve">ICMP 数据</text>
<text x="712.0" y="192" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#bf4520" text-anchor="middle" xml:space="preserve">由 ping 程序填充</text>

<line x1="824" y1="178" x2="956" y2="178" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="890.0" y="168" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">发给网卡</text>

<text x="40" y="262" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start" xml:space="preserve">每一层只在自己的数据前面加一个头，层与层之间靠"整体当作数据"解耦</text>

<text x="40" y="330" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start" xml:space="preserve">二、以太网帧的字段构成</text>

<rect x="40" y="352" width="180" height="72" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="130.0" y="382" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">目的 MAC</text>
<text x="130.0" y="404" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">6 字节</text>

<rect x="228" y="352" width="180" height="72" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="318.0" y="382" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">源 MAC</text>
<text x="318.0" y="404" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">6 字节</text>

<rect x="416" y="352" width="140" height="72" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="486.0" y="382" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">类型</text>
<text x="486.0" y="404" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">2 字节</text>

<rect x="564" y="352" width="240" height="72" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="684.0" y="382" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">数据</text>
<text x="684.0" y="404" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">46 ~ 1500 字节</text>

<rect x="812" y="352" width="148" height="72" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="886.0" y="382" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle" xml:space="preserve">FCS 校验</text>
<text x="886.0" y="404" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle" xml:space="preserve">4 字节</text>

<line x1="40" y1="438" x2="960" y2="438" stroke="#d5d9e0" stroke-width="1"/>
<text x="40" y="462" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start" xml:space="preserve">前 14 字节是通常说的"以太网头"；FCS 由网卡硬件生成与校验，协议栈里看不到</text>

<text x="40" y="500" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start" xml:space="preserve">三、两级分流依据</text>

<rect x="40" y="522" width="440" height="76" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="60" y="550" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start" xml:space="preserve">以太网类型字段</text>
<text x="60" y="574" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start" xml:space="preserve">0x0800 交给 IP，0x0806 交给 ARP</text>

<rect x="500" y="522" width="460" height="76" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="1"/>
<text x="520" y="550" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start" xml:space="preserve">IP 头里的协议号字段</text>
<text x="520" y="574" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start" xml:space="preserve">1 交给 ICMP，6 交给 TCP，17 交给 UDP</text>
</svg>
