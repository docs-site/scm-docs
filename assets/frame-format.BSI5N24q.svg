<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="frame-format-title frame-format-desc" id="frame-format-root">
        <title id="frame-format-title">升级帧的字段布局</title>
        <desc id="frame-format-desc">帧格式示意图：从 SOH 起始，依次是命令码、序号、偏移、长度、可变长数据与 CRC16 校验尾，各字段下方标注占用字节数与帧内偏移。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap');
      #frame-format-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace; }
      #frame-format-root { font-family: var(--font-sans); color: var(--color-ink); }</style>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- 帧本体 -->
        <rect x="64" y="96" width="80" height="64" rx="4" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.28" stroke-width="1"/>
        <rect x="152" y="96" width="88" height="64" rx="4" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.28" stroke-width="1"/>
        <rect x="248" y="96" width="104" height="64" rx="4" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.28" stroke-width="1"/>
        <rect x="360" y="96" width="128" height="64" rx="4" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.28" stroke-width="1"/>
        <rect x="496" y="96" width="104" height="64" rx="4" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.28" stroke-width="1"/>
        <rect x="608" y="96" width="408" height="64" rx="4" fill="#bf4520" fill-opacity="0.07" stroke="#bf4520" stroke-width="1"/>
        <rect x="1024" y="96" width="112" height="64" rx="4" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.28" stroke-width="1"/>

        <text x="104" y="130" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">SOH</text>
        <text x="104" y="150" fill="#4f5d75" font-size="12" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">0x01 · 1 B</text>

        <text x="196" y="130" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">CMD</text>
        <text x="196" y="150" fill="#4f5d75" font-size="12" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">命令 · 1 B</text>

        <text x="300" y="130" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">SEQ</text>
        <text x="300" y="150" fill="#4f5d75" font-size="12" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">序号 · 2 B</text>

        <text x="424" y="130" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">OFFSET</text>
        <text x="424" y="150" fill="#4f5d75" font-size="12" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">偏移 · 4 B</text>

        <text x="548" y="130" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">LEN</text>
        <text x="548" y="150" fill="#4f5d75" font-size="12" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">长度 · 2 B</text>

        <text x="812" y="130" fill="#bf4520" font-size="13" font-weight="600" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">DATA</text>
        <text x="812" y="150" fill="#4f5d75" font-size="12" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">数据 · 0 ~ 512 B，长度由 LEN 给出</text>

        <text x="1080" y="130" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">CRC16</text>
        <text x="1080" y="150" fill="#4f5d75" font-size="12" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">校验 · 2 B</text>

        <!-- 帧内偏移 -->
        <text x="104" y="188" fill="#5a6580" font-size="12" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">0x00</text>
        <text x="196" y="188" fill="#5a6580" font-size="12" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">0x01</text>
        <text x="300" y="188" fill="#5a6580" font-size="12" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">0x02</text>
        <text x="424" y="188" fill="#5a6580" font-size="12" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">0x04</text>
        <text x="548" y="188" fill="#5a6580" font-size="12" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">0x08</text>
        <text x="812" y="188" fill="#5a6580" font-size="12" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">0x0A</text>
        <text x="1080" y="188" fill="#5a6580" font-size="12" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">帧尾</text>

        <text x="64" y="220" fill="#5a6580" font-size="12" font-weight="400" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">SOH 定界帧头，第 8 字节起的 LEN 决定 DATA 长度；宽度非等比例。</text>
</svg>
