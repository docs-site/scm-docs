<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-compare-title arch-compare-desc" id="arch-compare-root">
        <title id="arch-compare-title">冯·诺依曼结构与哈佛结构对比</title>
        <desc id="arch-compare-desc">左右对比两种体系结构：冯·诺依曼结构中 CPU 经单一总线访问混放程序与数据的统一存储器；哈佛结构中 CPU 经两条独立总线分别访问指令存储器与数据存储器，取指与数据访问并行。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #arch-compare-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #arch-compare-root { font-family: var(--font-sans); color: var(--color-ink); }
      #arch-compare-root .diagram-container { width: 100%; overflow-x: auto; }
      #arch-compare-root .diagram-container { overflow-x: visible; }</style>
          <marker id="arch-compare-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arch-compare-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arch-compare-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="arch-compare-arrow-start" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ zones（左右两个对比分区） ============ -->
        <rect x="64" y="104" width="400" height="336" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="76" y="106" width="124" height="21" rx="2" fill="#f5f5f5"/>
        <text x="138" y="121" fill="#5a6580" font-size="16" font-weight="500" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">冯·诺依曼结构</text>

        <rect x="496" y="104" width="400" height="336" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="510" y="106" width="76" height="21" rx="2" fill="#f5f5f5"/>
        <text x="548" y="121" fill="#5a6580" font-size="16" font-weight="500" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">哈佛结构</text>

        <!-- ============ arrows（先箭头后节点） ============ -->
        <!-- 左：CPU ↔ 统一存储器（单一总线） -->
        <line x1="224" y1="272" x2="304" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arch-compare-arrow-start)" marker-end="url(#arch-compare-arrow)"/>
        <!-- 右：CPU ↔ 指令存储器 -->
        <line x1="656" y1="256" x2="736" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arch-compare-arrow-start)" marker-end="url(#arch-compare-arrow)"/>
        <!-- 右：CPU ↔ 数据存储器 -->
        <line x1="656" y1="320" x2="736" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arch-compare-arrow-start)" marker-end="url(#arch-compare-arrow)"/>

        <!-- ============ nodes：左面板 ============ -->
        <rect x="104" y="240" width="120" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="104" y="240" width="120" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="164" y="268" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">CPU</text>
        <text x="164" y="287" fill="#4f5d75" font-size="13" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing="0.02em">CU · ALU</text>

        <rect x="304" y="240" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="304" y="240" width="144" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="376" y="268" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">统一存储器</text>
        <text x="376" y="287" fill="#4f5d75" font-size="13" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing="0.02em">PROGRAM + DATA</text>

        <!-- ============ nodes：右面板 ============ -->
        <rect x="536" y="224" width="120" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="536" y="224" width="120" height="104" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="596" y="272" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">CPU</text>
        <text x="596" y="291" fill="#4f5d75" font-size="13" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing="0.02em">CU · ALU</text>

        <rect x="736" y="228" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="736" y="228" width="144" height="56" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="808" y="252" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">指令存储器</text>
        <text x="808" y="271" fill="#4f5d75" font-size="13" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing="0.02em">PROGRAM</text>

        <rect x="736" y="292" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="736" y="292" width="144" height="56" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="808" y="316" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">数据存储器</text>
        <text x="808" y="335" fill="#4f5d75" font-size="13" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing="0.02em">DATA</text>

        <!-- ============ 编辑注解（斜体衬线） ============ -->
        <text x="264" y="410" fill="#5a6580" font-size="18" font-style="italic" font-family="'Instrument Serif','Noto Serif',serif" text-anchor="middle">取指与取数共用一条总线，只能分时进行</text>
        <text x="696" y="410" fill="#5a6580" font-size="18" font-style="italic" font-family="'Instrument Serif','Noto Serif',serif" text-anchor="middle">两条独立总线，取指与取数并行不悖</text>

        <!-- ============ legend（底部横条） ============ -->
        <line x1="64" y1="548" x2="896" y2="548" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <rect x="64" y="563" width="16" height="14" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="88" y="575" fill="#4f5d75" font-size="16" font-weight="500" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">中央处理器</text>
        <rect x="224" y="563" width="16" height="14" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="248" y="575" fill="#4f5d75" font-size="16" font-weight="500" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">存储器</text>
      </svg>
