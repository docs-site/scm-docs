<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crcb-title crcb-desc" id="crc-bitwise-root">
        <title id="crcb-title">CRC32 逐位算法流程</title>
        <desc id="crcb-desc">从初值 0xFFFFFFFF 开始，逐字节异或后做 8 次移位判断：最低位为 1 则右移并异或反射多项式 0xEDB88320；全部字节处理完再取反输出，与固件 iap_crc32 的实现一一对应。</desc>
        <defs>
      <style>#crc-bitwise-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; }
      #crc-bitwise-root { font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--color-ink); }
      #crc-bitwise-root .diagram-container { width: 100%; overflow-x: auto; }
      #crc-bitwise-root .n { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
      #crc-bitwise-root .s { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
      #crc-bitwise-root .m { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
      #crc-bitwise-root .k { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
      #crc-bitwise-root .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }</style>
          <marker id="crc-bitwise-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="crc-bitwise-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <style>
          .n  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
          .s  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
          .m  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
          .k  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
          .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }
        </style>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== 连线（先画线） ===== -->
        <line x1="490" y1="112" x2="490" y2="140" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#crc-bitwise-arrow)"/>

        <!-- 是：判断 -> 异或字节 -->
        <line x1="490" y1="232" x2="490" y2="264" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#crc-bitwise-arrow)"/>
        <rect x="498" y="238" width="20" height="18" fill="#f5f5f5"/>
        <text class="s" x="508" y="252">是</text>

        <!-- 异或字节 -> 内循环 -->
        <line x1="490" y1="312" x2="490" y2="340" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#crc-bitwise-arrow)"/>

        <!-- 内循环 -> 回到判断（循环回边） -->
        <path d="M 754 372 L 812 372 Q 820 372 820 364 L 820 188 Q 820 180 812 180 L 628 180"
              fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#crc-bitwise-arrow)"/>
        <rect x="828" y="266" width="108" height="18" fill="#f5f5f5"/>
        <text class="s" x="882" y="280" text-anchor="middle">处理下一字节</text>

        <!-- 否：判断 -> 取反输出（左侧绕行） -->
        <path d="M 358 186 L 156 186 Q 148 186 148 194 L 148 504 Q 148 512 156 512 L 356 512"
              fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#crc-bitwise-arrow)"/>
        <rect x="96" y="238" width="20" height="18" fill="#f5f5f5"/>
        <text class="s" x="106" y="252">否</text>

        <!-- ===== 节点 ===== -->
        <!-- 初始化 -->
        <rect x="368" y="64" width="244" height="48" rx="24" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.8"/>
        <text class="n" x="490" y="86" text-anchor="middle">初始化余数</text>
        <text class="m" x="490" y="103" text-anchor="middle">crc = 0xFFFFFFFF</text>

        <!-- 判断：还有字节吗 -->
        <polygon points="490,142 618,186 490,230 362,186" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.8"/>
        <text class="n" x="490" y="182" text-anchor="middle">还有字节吗</text>
        <text class="m" x="490" y="201" text-anchor="middle">i &lt; len ?</text>

        <!-- 逐字节异或 -->
        <rect x="360" y="264" width="260" height="48" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.75"/>
        <text class="n" x="376" y="286">异或进低 8 位</text>
        <text class="m" x="376" y="304">crc ^= data[i]</text>

        <!-- 内循环 8 次 -->
        <rect x="360" y="340" width="394" height="64" rx="6" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.6"/>
        <text class="n" x="376" y="364">内循环 8 次（每位的处理）</text>
        <text class="m" x="376" y="388">(crc &amp; 1) ? (crc &gt;&gt; 1) ^ 0xEDB88320 : crc &gt;&gt; 1</text>

        <!-- 取反输出 -->
        <rect x="360" y="488" width="260" height="48" rx="24" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.8"/>
        <text class="n" x="490" y="510" text-anchor="middle">取反输出 CRC32</text>
        <text class="m" x="490" y="527" text-anchor="middle">crc ^= 0xFFFFFFFF</text>

        <!-- ===== 注释 ===== -->
        <text class="nt" x="660" y="505">0xEDB88320 是 0x04C11DB7 的镜像写法，</text>
        <text class="nt" x="660" y="527">配套"右移"处理，省掉位序翻转。</text>

        <!-- ===== 图例 ===== -->
        <line x1="56" y1="576" x2="924" y2="576" stroke="#2d3142" stroke-opacity="0.14" stroke-width="1"/>
        <text class="k" x="56" y="600">LEGEND</text>
        <rect x="136" y="588" width="14" height="12" rx="2" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.4"/>
        <text class="s" x="158" y="599">核心步骤：移位 + 异或</text>
        <path d="M 316 594 L 352 594" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#crc-bitwise-arrow)"/>
        <text class="s" x="362" y="599">执行顺序</text>
        <path d="M 472 594 L 508 594" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4"/>
        <text class="s" x="518" y="599">循环回边（每字节一轮）</text>
      </svg>
