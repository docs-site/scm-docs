<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sgnv-title sgnv-desc" id="sign-verify-flow-root">
        <title id="sgnv-title">设备侧验签流程：ed25519_verify_parts</title>
        <desc id="sgnv-desc">整帧收齐后先做载荷 CRC32 比对挡误码，再取生效公钥、对签名 R 与公钥 A 及消息做 SHA512 得 k，最后用双标量点乘比较 [S]B 与 R+[k]A 的编码是否一致，任何一步失败都拒绝收帧。</desc>
        <defs>
      <style>#sign-verify-flow-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; }
      #sign-verify-flow-root { font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--color-ink); }
      #sign-verify-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #sign-verify-flow-root .n { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
      #sign-verify-flow-root .s { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
      #sign-verify-flow-root .m { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
      #sign-verify-flow-root .k { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
      #sign-verify-flow-root .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }</style>
          <marker id="sign-verify-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="sign-verify-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <style>
          .n  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
          .s  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
          .m  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
          .k  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
          .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }
        </style>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== 连线（先画线） ===== -->
        <line x1="430" y1="100" x2="430" y2="128" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#sign-verify-flow-arrow)"/>
        <line x1="430" y1="184" x2="430" y2="212" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#sign-verify-flow-arrow)"/>
        <line x1="430" y1="268" x2="430" y2="296" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#sign-verify-flow-arrow)"/>
        <line x1="430" y1="352" x2="430" y2="380" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#sign-verify-flow-arrow)"/>
        <line x1="430" y1="436" x2="430" y2="472" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#sign-verify-flow-arrow)"/>

        <!-- CRC 失败 -> 拒绝1 -->
        <line x1="596" y1="156" x2="696" y2="156" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#sign-verify-flow-arrow)"/>
        <rect x="604" y="146" width="60" height="18" fill="#f5f5f5"/>
        <text class="s" x="634" y="160" text-anchor="middle">不相等</text>

        <!-- 验签失败 -> 拒绝2 -->
        <line x1="582" y1="514" x2="696" y2="514" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#sign-verify-flow-arrow)"/>
        <rect x="590" y="504" width="60" height="18" fill="#f5f5f5"/>
        <text class="s" x="620" y="518" text-anchor="middle">对不上</text>

        <!-- 判断通过 -> 接受（accent） -->
        <line x1="430" y1="562" x2="430" y2="600" stroke="#bf4520" stroke-width="1.6" marker-end="url(#sign-verify-flow-arrow-accent)"/>
        <rect x="438" y="572" width="28" height="18" fill="#f5f5f5"/>
        <text class="s" x="452" y="586">一致</text>

        <!-- ===== 节点 ===== -->
        <rect x="308" y="56" width="244" height="44" rx="22" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.8"/>
        <text class="n" x="430" y="84" text-anchor="middle">整帧收齐（头 + 载荷 + 签名）</text>

        <rect x="300" y="128" width="260" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.75"/>
        <text class="n" x="316" y="152">载荷 CRC32 比对</text>
        <text class="m" x="316" y="171">帧头声明值 ↔ 实际重算值</text>

        <rect x="696" y="128" width="232" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.5"/>
        <text class="n" x="712" y="152">拒绝 · 误码</text>
        <text class="m" x="712" y="171">IAP_ERR_CRC / NET_ERR_HDR</text>

        <rect x="300" y="212" width="260" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.75"/>
        <text class="n" x="316" y="236">取生效公钥</text>
        <text class="m" x="316" y="255">iap_key_public()</text>

        <rect x="300" y="296" width="260" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.75"/>
        <text class="n" x="316" y="320">拼出验签消息</text>
        <text class="m" x="316" y="339">SHA512(R ‖ A ‖ 头部 ‖ 载荷)</text>

        <rect x="300" y="380" width="260" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.75"/>
        <text class="n" x="316" y="404">规约到群阶</text>
        <text class="m" x="316" y="423">k = hash 结果 mod L</text>

        <polygon points="430,474 582,514 430,554 278,514" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.8"/>
        <text class="n" x="430" y="510" text-anchor="middle">双标量点乘比对</text>
        <text class="m" x="430" y="530" text-anchor="middle">[S]·B == R + [k]·A ?</text>

        <rect x="696" y="486" width="232" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.5"/>
        <text class="n" x="712" y="510">拒绝 · 签名无效</text>
        <text class="m" x="712" y="529">IAP_ERR_SIGN / NET_ERR_SIGN</text>

        <rect x="300" y="600" width="260" height="48" rx="24" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.6"/>
        <text class="n" x="430" y="622" text-anchor="middle">接受，进入安装</text>
        <text class="m" x="430" y="639" text-anchor="middle">计数 +1 · 回执 RECV OK</text>

        <!-- ===== 注释 ===== -->
        <text class="nt" x="696" y="612">CRC 先行是刻意的：误码帧在这里出局，</text>
        <text class="nt" x="696" y="634">点乘只花在结构完好的帧上。</text>

        <!-- ===== 图例 ===== -->
        <line x1="56" y1="700" x2="924" y2="700" stroke="#2d3142" stroke-opacity="0.14" stroke-width="1"/>
        <text class="k" x="56" y="724">LEGEND</text>
        <rect x="136" y="712" width="14" height="12" rx="2" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.4"/>
        <text class="s" x="158" y="723">验签通过的唯一出口</text>
        <path d="M 344 718 L 380 718" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#sign-verify-flow-arrow)"/>
        <text class="s" x="390" y="723">两类独立的拒绝原因</text>
        <path d="M 560 718 L 596 718" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#sign-verify-flow-arrow)"/>
        <text class="s" x="606" y="723">主流程（自上而下）</text>
      </svg>
