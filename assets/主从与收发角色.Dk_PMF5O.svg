<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="i2c-roles-title i2c-roles-desc" id="i2c-roles-root">
        <title id="i2c-roles-title">主机·从机 与 发送器·接收器</title>
        <desc id="i2c-roles-desc">STM32（主机）与 AT24C02（从机）之间写事务和读事务的对照：主从角色始终不变，SCL 一直由 STM32 产生；发送器与接收器随读写方向互换，第 9 个时钟的 ACK/NACK 由当前的接收器给出。</desc>
        <defs>
      <style>#i2c-roles-root { --color-paper:   #fbfaf8;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #3451b2;
      --font-sans:     'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, 'Songti SC', serif;
      --font-mono:     ui-monospace, 'SFMono-Regular', Consolas, monospace; }
      #i2c-roles-root { font-family: var(--font-sans); color: var(--color-ink); }
      #i2c-roles-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#i2c-roles-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="i2c-roles-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="i2c-roles-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3451b2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#fbfaf8"/>

        <!-- ===== 生命线（先画，位于所有节点与标签之下） ===== -->
        <line x1="240" y1="128" x2="240" y2="520" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="720" y1="128" x2="720" y2="520" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>

        <!-- ===== 区域框 ===== -->
        <rect x="80" y="148" width="800" height="172" rx="4" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.22"/>
        <rect x="80" y="148" width="124" height="20" rx="2" fill="#fbfaf8" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="142" y="162" fill="#4f5d75" font-size="12" font-weight="500" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">写事务（主机发出）</text>

        <rect x="80" y="340" width="800" height="172" rx="4" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.22"/>
        <rect x="80" y="340" width="124" height="20" rx="2" fill="#fbfaf8" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="142" y="354" fill="#4f5d75" font-size="12" font-weight="500" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">读事务（从机发出）</text>

        <!-- ===== 箭头（水平直线；先画，位于节点之下） ===== -->
        <path d="M 244 220 L 712 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#i2c-roles-arrow)"/>
        <path d="M 716 292 L 248 292" fill="none" stroke="#3451b2" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#i2c-roles-arrow-accent)"/>
        <path d="M 716 412 L 248 412" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#i2c-roles-arrow)"/>
        <path d="M 244 484 L 712 484" fill="none" stroke="#3451b2" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#i2c-roles-arrow-accent)"/>

        <!-- ===== 发送器 / 接收器 小标签（贴在数据箭头起点与终点） ===== -->
        <rect x="268" y="196" width="60" height="18" rx="2" fill="#fbfaf8" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.20"/>
        <text x="298" y="210" fill="#4f5d75" font-size="12" font-weight="500" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">发送器</text>

        <rect x="632" y="196" width="60" height="18" rx="2" fill="#fbfaf8" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.20"/>
        <text x="662" y="210" fill="#4f5d75" font-size="12" font-weight="500" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">接收器</text>

        <rect x="632" y="388" width="60" height="18" rx="2" fill="#fbfaf8" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.20"/>
        <text x="662" y="402" fill="#4f5d75" font-size="12" font-weight="500" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">发送器</text>

        <rect x="268" y="388" width="60" height="18" rx="2" fill="#fbfaf8" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.20"/>
        <text x="298" y="402" fill="#4f5d75" font-size="12" font-weight="500" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">接收器</text>

        <!-- ===== 箭头主标签（不透明底 · 与 stroke 保持 6–10px 间隙） ===== -->
        <rect x="360" y="192" width="240" height="20" fill="#fbfaf8"/>
        <text x="480" y="206" fill="#5a6580" font-size="12" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">STM32 发出 · 数据位 D7→D0</text>

        <rect x="376" y="266" width="208" height="20" fill="#fbfaf8"/>
        <text x="480" y="280" fill="#3451b2" font-size="12" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">第 9 位：AT24C02 ACK</text>

        <rect x="360" y="384" width="240" height="20" fill="#fbfaf8"/>
        <text x="480" y="398" fill="#5a6580" font-size="12" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">AT24C02 发出 · 数据位 D7→D0</text>

        <rect x="340" y="458" width="280" height="20" fill="#fbfaf8"/>
        <text x="480" y="472" fill="#3451b2" font-size="12" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">第 9 位：STM32 ACK；末字节 NACK</text>

        <!-- ===== 节点（后画，覆盖箭头端点） ===== -->
        <rect x="140" y="40" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="152" y="52" width="52" height="18" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.05" stroke-opacity="0.30"/>
        <text x="178" y="65" fill="#2d3142" font-size="12" font-weight="500" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">主机</text>
        <text x="240" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">STM32</text>
        <text x="240" y="110" fill="#4f5d75" font-size="12" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">产生 SCL · START · STOP</text>

        <rect x="620" y="40" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="632" y="52" width="52" height="18" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.05" stroke-opacity="0.30"/>
        <text x="658" y="65" fill="#2d3142" font-size="12" font-weight="500" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">从机</text>
        <text x="720" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">AT24C02</text>
        <text x="720" y="110" fill="#4f5d75" font-size="12" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">被寻址 · 不产生 SCL</text>

        <!-- ===== 图例（底部 60px strip） ===== -->
        <line x1="40" y1="540" x2="920" y2="540" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="570" fill="#4f5d75" font-size="12" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" letter-spacing="0.14em">图例</text>

        <line x1="100" y1="566" x2="140" y2="566" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="152" y="570" fill="#4f5d75" font-size="12" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif">数据字节</text>

        <line x1="232" y1="566" x2="272" y2="566" stroke="#3451b2" stroke-width="1.2" stroke-dasharray="5,4"/>
        <text x="284" y="570" fill="#4f5d75" font-size="12" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif">ACK / NACK（接收器给出）</text>

        <rect x="472" y="556" width="16" height="16" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.05" stroke-opacity="0.30"/>
        <text x="496" y="570" fill="#4f5d75" font-size="12" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif">当前字节角色</text>

        <text x="628" y="570" fill="#4f5d75" font-size="12" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif">虚线 = 生命线 · 时间向下</text>
      </svg>
