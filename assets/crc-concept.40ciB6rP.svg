<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crcc-title crcc-desc" id="crc-concept-root">
        <title id="crcc-title">CRC32 的本质：模 2 除法求余数</title>
        <desc id="crcc-desc">发送端把消息看作被除数，用约定的 32 位生成多项式做模 2 除法，32 位余数就是 CRC32 并附在帧尾；接收端对整帧重除，余数不为零即判定传输出错。</desc>
        <defs>
      <style>#crc-concept-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; }
      #crc-concept-root { font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--color-ink); }
      #crc-concept-root .diagram-container { width: 100%; overflow-x: auto; }
      #crc-concept-root .n { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
      #crc-concept-root .s { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
      #crc-concept-root .m { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
      #crc-concept-root .k { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
      #crc-concept-root .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }</style>
          <marker id="crc-concept-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="crc-concept-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <style>
          .n  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
          .s  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
          .m  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
          .k  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
          .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }
        </style>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== 连线（先画线） ===== -->
        <line x1="296" y1="180" x2="344" y2="180" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#crc-concept-arrow)"/>
        <rect x="300" y="156" width="44" height="18" fill="#f5f5f5"/>
        <text class="s" x="322" y="170" text-anchor="middle">被除数</text>

        <line x1="624" y1="180" x2="672" y2="180" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#crc-concept-arrow)"/>
        <rect x="628" y="156" width="44" height="18" fill="#f5f5f5"/>
        <text class="s" x="650" y="170" text-anchor="middle">余数</text>

        <!-- 余数 -> 追加帧尾 -> 帧 -->
        <path d="M 812 224 L 812 300 Q 812 308 804 308 L 624 308"
              fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#crc-concept-arrow-accent)"/>
        <rect x="688" y="248" width="108" height="18" fill="#f5f5f5"/>
        <text class="s" x="742" y="262" text-anchor="middle">追加到帧尾</text>

        <!-- 帧 -> 接收端重算 -->
        <line x1="508" y1="308" x2="404" y2="308" stroke="#bf4520" stroke-width="1.6" marker-end="url(#crc-concept-arrow-accent)"/>

        <!-- 接收端重除 -> 余数==0 判断 -->
        <line x1="172" y1="356" x2="172" y2="396" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#crc-concept-arrow)"/>
        <rect x="182" y="366" width="44" height="18" fill="#f5f5f5"/>
        <text class="s" x="204" y="380" text-anchor="middle">比对</text>

        <!-- ===== 节点 ===== -->
        <!-- 上排：生成 CRC -->
        <rect x="48" y="132" width="248" height="96" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.6"/>
        <text class="n" x="64" y="164">原始数据</text>
        <text class="m" x="64" y="186">M(x) · x^32</text>
        <text class="s" x="64" y="208">任意长度的消息比特流</text>

        <rect x="348" y="132" width="272" height="96" rx="6" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.6"/>
        <text class="n" x="364" y="164">模 2 除法</text>
        <text class="m" x="364" y="186">G(x) = 0x04C11DB7</text>
        <text class="s" x="364" y="208">加法不进位、减法不借位，就是异或</text>

        <rect x="676" y="132" width="248" height="96" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.6"/>
        <text class="n" x="692" y="164">32 位余数</text>
        <text class="m" x="692" y="186">CRC32 = 4 bytes</text>
        <text class="s" x="692" y="208">消息定了，余数就唯一</text>

        <!-- 下排：校验回路 -->
        <rect x="376" y="260" width="248" height="96" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.75"/>
        <text class="n" x="392" y="292">完整帧</text>
        <text class="m" x="392" y="314">data || crc32</text>
        <text class="s" x="392" y="336">数据后面跟着 4 字节余数</text>

        <rect x="48" y="260" width="248" height="96" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.75"/>
        <text class="n" x="64" y="292">接收端重除</text>
        <text class="m" x="64" y="314">same G(x)</text>
        <text class="s" x="64" y="336">对整帧再做一次模 2 除法</text>

        <rect x="48" y="396" width="248" height="72" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.5"/>
        <text class="n" x="64" y="426">余数 == 0 ？</text>
        <text class="s" x="64" y="448">是：帧完好 · 否：误码，丢弃</text>

        <!-- ===== 注释 ===== -->
        <text class="nt" x="676" y="432">发送与接收约定同一个 G(x)，</text>
        <text class="nt" x="676" y="454">任何一位在途中翻转，余数几乎必然不再为零。</text>

        <!-- ===== 图例 ===== -->
        <line x1="56" y1="504" x2="924" y2="504" stroke="#2d3142" stroke-opacity="0.14" stroke-width="1"/>
        <text class="k" x="56" y="528">LEGEND</text>
        <rect x="136" y="516" width="14" height="12" rx="2" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.4"/>
        <text class="s" x="158" y="527">约定的生成多项式</text>
        <line x1="308" y1="522" x2="344" y2="522" stroke="#bf4520" stroke-width="1.6" marker-end="url(#crc-concept-arrow-accent)"/>
        <text class="s" x="354" y="527">CRC 的生成与校验路径</text>
        <line x1="548" y1="522" x2="584" y2="522" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#crc-concept-arrow)"/>
        <text class="s" x="594" y="527">普通数据流</text>
      </svg>
