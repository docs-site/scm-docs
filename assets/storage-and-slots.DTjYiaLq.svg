<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="slots-title slots-desc" id="storage-and-slots-root">
        <title id="slots-title">两套存储与 A/B 槽位</title>
        <desc id="slots-desc">内部 Flash 存放可执行程序，外部 SPI Flash 存放参数、升级记录与 A 槽 B 槽两份镜像，搬运方向由 B 槽指向内部 Flash 的 app 区。</desc>
        <defs>
      <style>#storage-and-slots-root { --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #bf4520; }
      #storage-and-slots-root { font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--color-ink); }
      #storage-and-slots-root .diagram-container { width: 100%; overflow-x: auto; }
      #storage-and-slots-root .n { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
      #storage-and-slots-root .s { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
      #storage-and-slots-root .m { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
      #storage-and-slots-root .k { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
      #storage-and-slots-root .al { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #bf4520; }
      #storage-and-slots-root .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }</style>
          <marker id="storage-and-slots-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="storage-and-slots-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <style>
          .n  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
          .s  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
          .m  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
          .k  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
          .al { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #bf4520; }
          .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }
        </style>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== 搬运路径（先画线，后画盒子） ===== -->
        <path d="M 604 420 L 568 420 Q 560 420 560 412 L 560 288 Q 560 280 552 280 L 348 280"
              fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#storage-and-slots-arrow-accent)"/>
        <rect x="391" y="258" width="86" height="18" fill="#f5f5f5"/>
        <text class="al" x="434" y="271" text-anchor="middle">go flash 搬运</text>

        <!-- ===== 内部 Flash 面板 ===== -->
        <text class="k" x="96" y="96">INTERNAL FLASH</text>
        <text class="n" x="96" y="120">STM32F103ZE 片上 512KB</text>

        <rect x="96" y="140" width="248" height="88" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.55"/>
        <text class="n" x="112" y="170">bootloader</text>
        <text class="m" x="112" y="192">0x08000000 · 128KB</text>
        <text class="s" x="112" y="212">上电先跑，收帧与跳转</text>

        <rect x="96" y="240" width="248" height="88" rx="6" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.6"/>
        <text class="n" x="112" y="270">flash app（运行区）</text>
        <text class="m" x="112" y="292">0x08020000 · 128KB</text>
        <text class="s" x="112" y="312">始终等于 active 槽内容</text>

        <rect x="96" y="340" width="248" height="72" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.35"/>
        <text class="n" x="112" y="368">SRAM app 暂存</text>
        <text class="m" x="112" y="390">0x08040000 · 128KB</text>

        <!-- ===== 外部 SPI Flash 面板 ===== -->
        <text class="k" x="604" y="96">EXTERNAL SPI FLASH</text>
        <text class="n" x="604" y="120">W25Q128 · 16MB</text>

        <rect x="604" y="140" width="288" height="48" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.45"/>
        <text class="n" x="620" y="162">设备参数区</text>
        <text class="m" x="620" y="180">sector 0-1 · 0x000000</text>

        <rect x="604" y="196" width="288" height="48" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.45"/>
        <text class="n" x="620" y="218">升级记录区</text>
        <text class="m" x="620" y="236">sector 2-3 · 0x002000</text>

        <rect x="604" y="252" width="288" height="88" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.75"/>
        <text class="n" x="620" y="280">镜像槽 A</text>
        <text class="m" x="620" y="302">0x004000 · sector 4-67</text>
        <text class="s" x="620" y="322">单槽 256KB</text>

        <rect x="604" y="348" width="288" height="104" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1.6"/>
        <text class="n" x="620" y="378">镜像槽 B</text>
        <text class="m" x="620" y="400">0x044000 · sector 68-131</text>
        <text class="s" x="620" y="420">单槽 256KB</text>
        <text class="s" x="620" y="438">本次 active 为空闲槽写入目标</text>

        <rect x="604" y="460" width="288" height="44" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.3"/>
        <text class="n" x="620" y="488">预留 / 自检区</text>

        <!-- ===== 注释 ===== -->
        <text class="nt" x="96" y="470">app 永远写"非 active 槽"，内部 Flash 只由 bootloader 改写。</text>
        <text class="nt" x="96" y="492">两侧镜像槽各留一份，掉电最坏只丢一次下载。</text>

        <!-- ===== 图例 ===== -->
        <line x1="96" y1="556" x2="884" y2="556" stroke="#2d3142" stroke-opacity="0.14" stroke-width="1"/>
        <text class="k" x="96" y="582">LEGEND</text>
        <rect x="176" y="570" width="14" height="12" rx="2" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.4"/>
        <text class="s" x="198" y="581">焦点区域</text>
        <rect x="278" y="570" width="14" height="12" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.55"/>
        <text class="s" x="300" y="581">普通区域</text>
        <line x1="386" y1="576" x2="424" y2="576" stroke="#bf4520" stroke-width="1.6" marker-end="url(#storage-and-slots-arrow-accent)"/>
        <text class="s" x="434" y="581">镜像搬运方向</text>
      </svg>
