<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bank-swap-mapping-title bank-swap-mapping-desc" id="bank-swap-mapping-root">
        <title id="bank-swap-mapping-title">Bank Swap 的地址映射交换</title>
        <desc id="bank-swap-mapping-desc">对比图：正常模式下 Bank 1 占据 0x08000000 运行、Bank 2 空闲待写；置位 BFB2 并复位后，硬件把 Bank 2 映射到 0x08000000 运行新固件，Bank 1 退居高位地址作为备份。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #bank-swap-mapping-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace; }
      #bank-swap-mapping-root { font-family: var(--font-sans); color: var(--color-ink); }
      #bank-swap-mapping-root .diagram-container { width: 100%; overflow-x: auto; }
      #bank-swap-mapping-root .diagram-container { overflow-x: visible; }</style>
          <marker id="bank-swap-mapping-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="bank-swap-mapping-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="bank-swap-mapping-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="80" y="140" width="480" height="420" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="108" y="144" width="176" height="16" rx="2" fill="#f5f5f5"/>
        <text x="196" y="156" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">正常模式 · FB_MODE = 0</text>

        <rect x="720" y="140" width="480" height="420" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="748" y="144" width="200" height="16" rx="2" fill="#f5f5f5"/>
        <text x="848" y="156" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">交换模式 · BFB2 置位并复位后</text>

        <!-- Arrow between modes -->
        <line x1="566" y1="340" x2="712" y2="340" stroke="#bf4520" stroke-width="1.4" marker-end="url(#bank-swap-mapping-arrow-accent)"/>
        <rect x="575" y="314" width="128" height="16" rx="2" fill="#f5f5f5"/>
        <text x="639" y="326" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">置位 BFB2 并复位</text>

        <!-- Left: Bank 1 (running) -->
        <rect x="120" y="220" width="400" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="220" width="400" height="80" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="320" y="250" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Bank 1 映射到 0x08000000</text>
        <text x="320" y="274" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">当前运行固件，中断向量表固定在此</text>

        <!-- Left: Bank 2 (idle) -->
        <rect x="120" y="380" width="400" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="380" width="400" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="410" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Bank 2 映射到 0x08040000</text>
        <text x="320" y="434" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">空闲，OTA 时写入新固件</text>

        <!-- Right: Bank 2 (running) -->
        <rect x="760" y="220" width="400" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="220" width="400" height="80" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="960" y="250" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Bank 2 映射到 0x08000000</text>
        <text x="960" y="274" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">新固件在同一个运行地址启动</text>

        <!-- Right: Bank 1 (backup) -->
        <rect x="760" y="380" width="400" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="380" width="400" height="80" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="960" y="410" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Bank 1 映射到 0x08040000</text>
        <text x="960" y="434" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">旧固件原地保留，可随时切回</text>
      </svg>
