<?xml version="1.0" encoding="UTF-8"?>

<svg id="iap-jump-flowchart-root" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iap-jump-flowchart-title iap-jump-flowchart-desc">
        <title id="iap-jump-flowchart-title">IAP 跳转 APP 的执行流程</title>
        <desc id="iap-jump-flowchart-desc">流程图：展示 IAP 从上电复位、Bootloader 判断是否更新，到 iap_load_app 校验栈顶、取向量、设置 MSP 后跳转，APP 复位中断设置 VTOR 并进入 main 死循环的完整执行流程。图中标注：跳转是软件行为，只改 MSP、VTOR、PC，芯片并未复位。</desc>
        <defs>
          <marker id="iap-jump-flowchart-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="iap-jump-flowchart-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="iap-jump-flowchart-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows -->
        <path d="M 560,128 V 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#iap-jump-flowchart-arrow)"/>
        <path d="M 560,216 V 248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#iap-jump-flowchart-arrow)"/>
        <path d="M 688,296 H 840" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#iap-jump-flowchart-arrow)"/>
        <path d="M 960,324 V 348 Q 960,356 952,356 H 640 Q 632,356 632,364 V 392" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#iap-jump-flowchart-arrow)"/>
        <path d="M 560,344 V 392" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#iap-jump-flowchart-arrow)"/>
        <path d="M 560,456 V 488" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#iap-jump-flowchart-arrow-accent)"/>
        <path d="M 560,552 V 584" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#iap-jump-flowchart-arrow)"/>

        <!-- Arrow labels -->
        <rect x="752" y="272" width="24" height="16" rx="2" fill="#f5f5f5"/>
        <text x="764" y="283" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">是</text>
        <rect x="570" y="352" width="24" height="16" rx="2" fill="#f5f5f5"/>
        <text x="582" y="363" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">否</text>

        <!-- 1 start oval -->
        <rect x="420" y="80" width="280" height="48" rx="24" fill="#f5f5f5"/>
        <rect x="420" y="80" width="280" height="48" rx="24" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="560" y="101" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">上电复位</text>
        <text x="560" y="117" fill="#4f5d75" font-size="11" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">0X08000000</text>

        <!-- 2 bootloader main -->
        <rect x="420" y="160" width="280" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="420" y="160" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="560" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">Bootloader main()</text>
        <text x="560" y="204" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">检查是否需要更新</text>

        <!-- 3 decision diamond -->
        <polygon points="560,248 688,296 560,344 432,296" fill="#f5f5f5"/>
        <polygon points="560,248 688,296 560,344 432,296" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="560" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">需要更新 APP？</text>

        <!-- 4 update APP -->
        <rect x="840" y="268" width="240" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="840" y="268" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="960" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">接收 bin 写入 FLASH</text>
        <text x="960" y="312" fill="#4f5d75" font-size="11" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">UART / USB / CAN</text>

        <!-- 5 iap_load_app (focal) -->
        <rect x="420" y="392" width="280" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="420" y="392" width="280" height="64" rx="6" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1.2"/>
        <text x="560" y="416" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">iap_load_app() 跳转</text>
        <text x="560" y="436" fill="#4f5d75" font-size="11" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">CHECK SP → VECTOR → __set_MSP</text>

        <!-- 6 APP reset handler -->
        <rect x="420" y="488" width="280" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="420" y="488" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="560" y="512" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">APP 复位中断 Reset_Handler</text>
        <text x="560" y="532" fill="#4f5d75" font-size="11" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">SystemInit() → __main() → main()</text>

        <!-- 标注：软件跳转 ≠ 芯片复位 -->
        <path d="M 740,486 L 706,444" fill="none" stroke="#bf4520" stroke-width="1" stroke-dasharray="4 3"/>
        <rect x="740" y="424" width="440" height="124" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="762" y="450" fill="#bf4520" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">这一步是软件跳转，不是芯片复位</text>
        <text x="762" y="478" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">改的只有 MSP、VTOR、PC 三个寄存器</text>
        <text x="762" y="500" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">外设与时钟仍是 Bootloader 离开时的状态</text>
        <text x="762" y="522" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">SRAM 不清零，中断使能也不复位</text>

        <!-- 7 end oval -->
        <rect x="420" y="584" width="280" height="48" rx="24" fill="#f5f5f5"/>
        <rect x="420" y="584" width="280" height="48" rx="24" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="560" y="605" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">APP main() 死循环</text>
        <text x="560" y="621" fill="#4f5d75" font-size="11" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">VTOR = 0X08000000 + X</text>

        <!-- Legend -->
        <line x1="64" y1="660" x2="1216" y2="660" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="64" y="682" fill="#4f5d75" font-size="10" font-family="'Geist Mono',ui-monospace,monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="170" y="670" width="28" height="16" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
        <text x="208" y="682" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">开始 / 结束</text>
        <rect x="330" y="670" width="28" height="16" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
        <text x="368" y="682" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">执行步骤</text>
        <polygon points="460,678 476,670 492,678 476,686" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
        <text x="504" y="682" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">条件判断</text>
        <rect x="600" y="670" width="28" height="16" rx="3" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="0.8"/>
        <text x="638" y="682" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">跳转关键步</text>
      </svg>
