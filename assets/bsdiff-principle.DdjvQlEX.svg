<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bsdiff-principle-title bsdiff-principle-desc" id="bsdiff-principle-root">
        <title id="bsdiff-principle-title">差分升级：服务器生成补丁，设备端重建镜像</title>
        <desc id="bsdiff-principle-desc">数据流图：服务器用 bsdiff 对旧镜像与新镜像求差异生成差分包，网络中只下发差分包，设备端用 bspatch 以本地旧镜像为底重建出新镜像并写入目标槽。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #bsdiff-principle-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace; }
      #bsdiff-principle-root { font-family: var(--font-sans); color: var(--color-ink); }
      #bsdiff-principle-root .diagram-container { width: 100%; overflow-x: auto; }
      #bsdiff-principle-root .diagram-container { overflow-x: visible; }</style>
          <marker id="bsdiff-principle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="bsdiff-principle-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="bsdiff-principle-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="40" y="120" width="560" height="440" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="68" y="124" width="192" height="16" rx="2" fill="#f5f5f5"/>
        <text x="164" y="136" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">服务器端 · 离线生成一次</text>

        <rect x="680" y="120" width="560" height="440" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="708" y="124" width="192" height="16" rx="2" fill="#f5f5f5"/>
        <text x="804" y="136" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">设备端 · 每次升级执行</text>

        <!-- Arrows: left zone -->
        <line x1="170" y1="234" x2="170" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bsdiff-principle-arrow)"/>
        <line x1="430" y1="234" x2="430" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bsdiff-principle-arrow)"/>
        <line x1="300" y1="364" x2="300" y2="436" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bsdiff-principle-arrow)"/>

        <!-- Cross-zone arrow -->
        <path d="M 450,472 H 700 V 340 Q 700,332 708,332 H 786" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#bsdiff-principle-arrow-link)"/>
        <rect x="509" y="448" width="132" height="16" rx="2" fill="#f5f5f5"/>
        <text x="575" y="460" fill="#2e5aa8" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">仅下发差分包</text>

        <!-- Arrows: right zone -->
        <line x1="810" y1="234" x2="810" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bsdiff-principle-arrow)"/>
        <line x1="900" y1="364" x2="900" y2="436" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bsdiff-principle-arrow)"/>

        <!-- Node: 旧镜像 V1 -->
        <rect x="70" y="170" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="70" y="170" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="170" y="196" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">旧镜像 V1</text>
        <text x="170" y="216" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">线上版本</text>

        <!-- Node: 新镜像 V2 -->
        <rect x="330" y="170" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="330" y="170" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="430" y="196" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">新镜像 V2</text>
        <text x="430" y="216" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">待发布版本</text>

        <!-- Node: bsdiff -->
        <rect x="150" y="300" width="300" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="150" y="300" width="300" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="300" y="326" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">bsdiff 求差异</text>
        <text x="300" y="346" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">ctrl + diff + extra</text>

        <!-- Node: 差分包 (focal) -->
        <rect x="150" y="440" width="300" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="150" y="440" width="300" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="300" y="466" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">差分包 V1 → V2</text>
        <text x="300" y="486" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">约为整包体积的 5% ~ 30%</text>

        <!-- Node: 本地旧镜像 -->
        <rect x="710" y="170" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="710" y="170" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="810" y="196" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">本地旧镜像 V1</text>
        <text x="810" y="216" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">只读，必须逐字节匹配</text>

        <!-- Node: bspatch -->
        <rect x="790" y="300" width="220" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="790" y="300" width="220" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="900" y="326" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">bspatch 重建</text>
        <text x="900" y="346" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">按控制块拼装新镜像</text>

        <!-- Node: 新镜像写入目标槽 -->
        <rect x="790" y="440" width="220" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="790" y="440" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="900" y="466" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">新镜像 V2</text>
        <text x="900" y="486" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">写入目标槽并校验</text>
      </svg>
