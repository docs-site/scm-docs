<?xml version="1.0" encoding="UTF-8"?>

<svg id="magic-window-root" xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" role="img" aria-labelledby="magic-window-mwTitle magic-window-mwDesc">
  <title id="magic-window-mwTitle">滑窗匹配魔数的过程</title>
  <desc id="magic-window-mwDesc">接收端维持 8 字节窗口，每来一个新字节整体左移一位；当窗口内容与 IAPBIN02 完全相等时命中，进入头部接收阶段。</desc>

  <rect x="0" y="0" width="940" height="360" fill="#f5f5f5"/>

  <text x="60" y="36" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="10" letter-spacing="2" fill="#4f5d75">MAGIC SLIDING WINDOW</text>
  <text x="60" y="62" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#2d3142">窗口固定 8 字节，来一个新字节整体左移一位</text>

  <!-- 行 1 -->
  <text x="60" y="104" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75">窗口 1</text>
  <g font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" fill="#2d3142">
    <rect x="140" y="84" width="52" height="36" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="166" y="108" text-anchor="middle">20</text>
    <rect x="192" y="84" width="52" height="36" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="218" y="108" text-anchor="middle">61</text>
    <rect x="244" y="84" width="52" height="36" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="270" y="108" text-anchor="middle">62</text>
    <rect x="296" y="84" width="52" height="36" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="322" y="108" text-anchor="middle">49</text>
    <rect x="348" y="84" width="52" height="36" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="374" y="108" text-anchor="middle">41</text>
    <rect x="400" y="84" width="52" height="36" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="426" y="108" text-anchor="middle">50</text>
    <rect x="452" y="84" width="52" height="36" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="478" y="108" text-anchor="middle">42</text>
    <rect x="504" y="84" width="52" height="36" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="530" y="108" text-anchor="middle">49</text>
  </g>
  <text x="576" y="108" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75">≠ IAPBIN02，继续扫描</text>

  <!-- 行 2 -->
  <text x="60" y="176" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75">窗口 2</text>
  <g font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" fill="#2d3142">
    <rect x="140" y="156" width="52" height="36" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="166" y="180" text-anchor="middle">62</text>
    <rect x="192" y="156" width="52" height="36" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="218" y="180" text-anchor="middle">49</text>
    <rect x="244" y="156" width="52" height="36" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="270" y="180" text-anchor="middle">41</text>
    <rect x="296" y="156" width="52" height="36" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="322" y="180" text-anchor="middle">50</text>
    <rect x="348" y="156" width="52" height="36" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="374" y="180" text-anchor="middle">42</text>
    <rect x="400" y="156" width="52" height="36" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="426" y="180" text-anchor="middle">49</text>
    <rect x="452" y="156" width="52" height="36" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="478" y="180" text-anchor="middle">4E</text>
    <rect x="504" y="156" width="52" height="36" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="530" y="180" text-anchor="middle">30</text>
  </g>
  <text x="576" y="180" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75">前缀错位，仍不命中</text>

  <!-- 行 3 命中 -->
  <text x="60" y="248" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#bf4520">窗口 3</text>
  <g font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" fill="#2d3142">
    <rect x="140" y="228" width="52" height="36" fill="#f7e3dc" stroke="#bf4520" stroke-width="1.2"/>
    <text x="166" y="252" text-anchor="middle">49 I</text>
    <rect x="192" y="228" width="52" height="36" fill="#f7e3dc" stroke="#bf4520" stroke-width="1.2"/>
    <text x="218" y="252" text-anchor="middle">41 A</text>
    <rect x="244" y="228" width="52" height="36" fill="#f7e3dc" stroke="#bf4520" stroke-width="1.2"/>
    <text x="270" y="252" text-anchor="middle">50 P</text>
    <rect x="296" y="228" width="52" height="36" fill="#f7e3dc" stroke="#bf4520" stroke-width="1.2"/>
    <text x="322" y="252" text-anchor="middle">42 B</text>
    <rect x="348" y="228" width="52" height="36" fill="#f7e3dc" stroke="#bf4520" stroke-width="1.2"/>
    <text x="374" y="252" text-anchor="middle">49 I</text>
    <rect x="400" y="228" width="52" height="36" fill="#f7e3dc" stroke="#bf4520" stroke-width="1.2"/>
    <text x="426" y="252" text-anchor="middle">4E N</text>
    <rect x="452" y="228" width="52" height="36" fill="#f7e3dc" stroke="#bf4520" stroke-width="1.2"/>
    <text x="478" y="252" text-anchor="middle">30 0</text>
    <rect x="504" y="228" width="52" height="36" fill="#f7e3dc" stroke="#bf4520" stroke-width="1.2"/>
    <text x="530" y="252" text-anchor="middle">32 2</text>
  </g>
  <text x="576" y="246" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#bf4520">命中魔数</text>
  <text x="576" y="266" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75">转入 HEADER，等 12 字节</text>


  <text x="60" y="306" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75">命中后的 8 字节就是头部的前 8 字节；紧接着的 12 字节（长度 / CRC32 / 目标地址）装入 s_header，攒齐再解析。</text>
  <text x="60" y="332" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75">每命中失败一次只丢弃窗口最左 1 字节，不做整段回退——所以主机中途重启、丢半帧都能自己重新对齐。</text>
</svg>
