<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sgnf-title sgnf-desc" id="sign-frame-root">
        <title id="sgnf-title">第三版帧格式与签名覆盖范围</title>
        <desc id="sgnf-desc">IAPBIN03 帧由头部 20 字节、载荷 N 字节、Ed25519 签名 64 字节和尾标 8 字节组成；签名覆盖头部与载荷，改动长度、CRC32 或目标地址都会导致验签失败，签名自身与尾标不参与签名。</desc>
        <defs>
      <style>#sign-frame-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; }
      #sign-frame-root { font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--color-ink); }
      #sign-frame-root .diagram-container { width: 100%; overflow-x: auto; }
      #sign-frame-root .n { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
      #sign-frame-root .s { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
      #sign-frame-root .m { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
      #sign-frame-root .k { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
      #sign-frame-root .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }</style>
          <marker id="sign-frame-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="sign-frame-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <style>
          .n  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
          .s  { font-family: 'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
          .m  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 11px; font-weight: 400; fill: #4f5d75; }
          .k  { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
          .nt { font-family: 'Instrument Serif','Noto Serif',serif; font-size: 13px; font-style: italic; fill: #4f5d75; }
        </style>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== 连线（先画线） ===== -->
        <!-- 覆盖范围括线（accent） -->
        <path d="M 70 128 L 70 108 Q 70 100 78 100 L 582 100 Q 590 100 590 108 L 590 128"
              fill="none" stroke="#bf4520" stroke-width="1.6"/>
        <rect x="212" y="68" width="236" height="18" fill="#f5f5f5"/>
        <text class="n" x="330" y="82" text-anchor="middle">被签名的消息（SHA512 的输入）</text>

        <!-- 不参与签名括线（muted 虚线） -->
        <path d="M 598 248 L 598 268 Q 598 276 606 276 L 902 276 Q 910 276 910 268 L 910 248"
              fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
        <rect x="664" y="268" width="180" height="18" fill="#f5f5f5"/>
        <text class="s" x="754" y="282" text-anchor="middle">信封：不参与签名（72B）</text>

        <!-- 改动 -> 验签失败 -->
        <line x1="386" y1="240" x2="386" y2="296" stroke="#bf4520" stroke-width="1.6" marker-end="url(#sign-frame-arrow-accent)"/>
        <rect x="394" y="258" width="152" height="18" fill="#f5f5f5"/>
        <text class="s" x="470" y="272" text-anchor="middle">改任一字节（含头部）</text>

        <!-- ===== 帧分段条 ===== -->
        <rect x="70" y="152" width="112" height="88" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="n" x="126" y="186" text-anchor="middle">帧头</text>
        <text class="m" x="126" y="206" text-anchor="middle">IAPBIN03</text>
        <text class="m" x="126" y="224" text-anchor="middle">20 B</text>

        <rect x="182" y="152" width="408" height="88" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="n" x="386" y="186" text-anchor="middle">载荷 = app.bin 全部字节</text>
        <text class="m" x="386" y="206" text-anchor="middle">N bytes</text>
        <text class="s" x="386" y="224" text-anchor="middle">向量表 + 代码 + 数据，一个不漏</text>

        <rect x="590" y="152" width="212" height="88" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.6"/>
        <text class="n" x="696" y="186" text-anchor="middle">Ed25519 签名</text>
        <text class="m" x="696" y="206" text-anchor="middle">R‖S · 64 B</text>
        <text class="s" x="696" y="224" text-anchor="middle">私钥才算得出</text>

        <rect x="802" y="152" width="108" height="88" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="n" x="856" y="186" text-anchor="middle">尾标</text>
        <text class="m" x="856" y="206" text-anchor="middle">IAPEOF03</text>
        <text class="m" x="856" y="224" text-anchor="middle">8 B</text>

        <!-- ===== 结果框与要点框 ===== -->
        <rect x="70" y="296" width="308" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.6"/>
        <text class="n" x="86" y="320">验签失败 · IAP_ERR_SIGN</text>
        <text class="s" x="86" y="342">拒绝收帧：不写槽、不记账、不擦写</text>

        <rect x="70" y="376" width="308" height="60" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.5"/>
        <text class="n" x="86" y="400">整帧总长公式</text>
        <text class="m" x="86" y="420">total = N + 20 + 64 + 8 = N + 92</text>

        <rect x="412" y="376" width="308" height="60" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.5"/>
        <text class="n" x="428" y="400">头部锁死三件事</text>
        <text class="m" x="428" y="420">长度 N · CRC32 · 目标地址</text>

        <!-- ===== 注释 ===== -->
        <text class="nt" x="620" y="48">换一个地方安装、换一段代码，</text>
        <text class="nt" x="620" y="70">签名都会当场对不上——头部也被签了。</text>

        <!-- ===== 图例 ===== -->
        <line x1="56" y1="470" x2="924" y2="470" stroke="#2d3142" stroke-opacity="0.14" stroke-width="1"/>
        <text class="k" x="56" y="494">LEGEND</text>
        <rect x="136" y="482" width="14" height="12" rx="2" fill="#fbf1ed" stroke="#bf4520" stroke-width="1.4"/>
        <text class="s" x="158" y="493">签名字段</text>
        <path d="M 244 488 L 280 488" fill="none" stroke="#bf4520" stroke-width="1.6"/>
        <text class="s" x="290" y="493">被签名的消息范围</text>
        <path d="M 452 488 L 488 488" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
        <text class="s" x="498" y="493">不参与签名的信封</text>
        <path d="M 660 488 L 696 488" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#sign-frame-arrow-accent)"/>
        <text class="s" x="706" y="493">改动被拦下的路径</text>
      </svg>
