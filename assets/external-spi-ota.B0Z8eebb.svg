<?xml version="1.0" encoding="UTF-8"?>
<svg id="external-spi-ota-root" viewBox="0 0 1280 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="external-spi-ota-title external-spi-ota-desc">
        <title id="external-spi-ota-title">外挂 SPI Flash 的升级布局</title>
        <desc id="external-spi-ota-desc">布局示意图：内部 Flash 只有 Bootloader 和一个 App 区，外部 SPI Flash 划出新固件暂存区、旧固件备份区与日志参数区；下载先落外部暂存区，再备份当前 App、烧写新固件到内部 App 区，启动失败时从备份区回滚。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap');
      #external-spi-ota-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace; }
      #external-spi-ota-root { font-family: var(--font-sans); color: var(--color-ink); }</style>

          <marker id="external-spi-ota-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="external-spi-ota-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- 列头 -->
        <text x="72" y="72" fill="#5a6580" font-size="13" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">内部 Flash</text>
        <text x="640" y="72" fill="#5a6580" font-size="13" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">外部 SPI Flash · <tspan font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace" font-size="12">W25Q64 / W25Q128</tspan></text>

        <!-- 三条通路 -->
        <line x1="640" y1="208" x2="520" y2="208" stroke="#bf4520" stroke-width="1.4" marker-end="url(#external-spi-ota-arrow-accent)"/>
        <rect x="556" y="190" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text x="584" y="202" fill="#bf4520" font-size="12" font-weight="500" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">③ 烧写</text>

        <line x1="520" y1="272" x2="640" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#external-spi-ota-arrow)"/>
        <rect x="556" y="254" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text x="584" y="266" fill="#4f5d75" font-size="12" font-weight="500" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">② 备份</text>

        <line x1="640" y1="296" x2="520" y2="296" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#external-spi-ota-arrow)"/>
        <rect x="556" y="306" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text x="584" y="318" fill="#4f5d75" font-size="12" font-weight="500" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">④ 恢复</text>

        <!-- 内部 Flash -->
        <rect x="72" y="96" width="448" height="68" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1"/>
        <text x="92" y="124" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">Bootloader</text>
        <text x="92" y="146" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">选槽、校验、跳转、恢复通道</text>

        <rect x="72" y="180" width="448" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.32" stroke-width="1"/>
        <text x="92" y="232" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">App 区（约 490 KB）</text>
        <text x="92" y="256" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">唯一运行区，③ 新固件写入这里</text>

        <!-- 外部 SPI Flash -->
        <rect x="640" y="96" width="448" height="52" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1"/>
        <text x="660" y="118" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">日志 / 参数</text>
        <text x="660" y="138" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">升级状态、断点与版本记录</text>

        <rect x="640" y="180" width="448" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1"/>
        <text x="660" y="208" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">新固件暂存区</text>
        <text x="660" y="230" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">① 下载并校验后先落在这里</text>

        <rect x="640" y="264" width="448" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1"/>
        <text x="660" y="292" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">旧固件备份区</text>
        <text x="660" y="314" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">② 备份当前 App，④ 失败从这里回滚</text>

        <!-- 脚注 -->
        <rect x="72" y="356" width="3" height="44" fill="#bf4520"/>
        <text x="88" y="372" fill="#4f5d75" font-size="13" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">内部 Flash 几乎全给 App；回滚靠外部备份区，不必在片内留第二份</text>
        <text x="88" y="394" fill="#5a6580" font-size="12" font-weight="400" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">代价：SPI 读写比内部 Flash 慢（复制 400 KB 需数秒），且需处理坏块与寿命</text>
      </svg>
