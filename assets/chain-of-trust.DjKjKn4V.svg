<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chain-of-trust-title chain-of-trust-desc" id="chain-of-trust-root">
        <title id="chain-of-trust-title">安全启动与 OTA 的信任链</title>
        <desc id="chain-of-trust-desc">信任链图：厂商公钥哈希烧录在 eFuse 作为信任根，BootROM 逐级验签 Bootloader、应用固件，OTA 升级包同样用这把公钥验签后才允许写入。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #chain-of-trust-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace; }
      #chain-of-trust-root { font-family: var(--font-sans); color: var(--color-ink); }
      #chain-of-trust-root .diagram-container { width: 100%; overflow-x: auto; }
      #chain-of-trust-root .diagram-container { overflow-x: visible; }</style>
          <marker id="chain-of-trust-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="chain-of-trust-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="chain-of-trust-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows -->
        <line x1="540" y1="148" x2="540" y2="202" stroke="#bf4520" stroke-width="1.4" marker-end="url(#chain-of-trust-arrow-accent)"/>
        <line x1="540" y1="278" x2="540" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#chain-of-trust-arrow)"/>
        <line x1="540" y1="408" x2="540" y2="462" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#chain-of-trust-arrow)"/>
        <line x1="900" y1="500" x2="748" y2="500" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#chain-of-trust-arrow-link)"/>

        <!-- Arrow labels -->
        <rect x="548" y="164" width="88" height="16" rx="2" fill="#f5f5f5"/>
        <text x="592" y="176" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">公钥验签</text>

        <rect x="548" y="294" width="140" height="16" rx="2" fill="#f5f5f5"/>
        <text x="618" y="306" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">验签通过才执行</text>

        <rect x="548" y="424" width="140" height="16" rx="2" fill="#f5f5f5"/>
        <text x="618" y="436" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">验签通过才执行</text>

        <rect x="780" y="478" width="104" height="16" rx="2" fill="#f5f5f5"/>
        <text x="832" y="490" fill="#2e5aa8" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">同一公钥验签</text>

        <!-- Node: 信任根 (focal) -->
        <rect x="340" y="80" width="400" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="340" y="80" width="400" height="68" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="540" y="108" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">信任根：厂商公钥哈希</text>
        <text x="540" y="130" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">烧录在 eFuse / OTP，不可篡改</text>

        <!-- Node: BootROM -->
        <rect x="340" y="210" width="400" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="340" y="210" width="400" height="68" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="540" y="238" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">BootROM</text>
        <text x="540" y="260" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">掩膜在芯片内，无法修改</text>

        <!-- Node: SPL / Bootloader -->
        <rect x="340" y="340" width="400" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="340" y="340" width="400" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="540" y="368" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">SPL / Bootloader</text>
        <text x="540" y="390" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">校验并引导下一级</text>

        <!-- Node: 应用固件 -->
        <rect x="340" y="470" width="400" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="340" y="470" width="400" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="540" y="498" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">应用固件 / Kernel</text>
        <text x="540" y="520" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">运行后被信任的业务代码</text>

        <!-- Node: OTA 升级包 -->
        <rect x="900" y="466" width="320" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="900" y="466" width="320" height="68" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="1060" y="494" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">OTA 升级包</text>
        <text x="1060" y="516" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">含负载摘要与厂商签名</text>
      </svg>
