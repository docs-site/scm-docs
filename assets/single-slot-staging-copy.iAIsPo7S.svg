<?xml version="1.0" encoding="UTF-8"?>
<svg id="single-slot-staging-copy-root" viewBox="0 0 1280 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="single-slot-staging-copy-title single-slot-staging-copy-desc">
        <title id="single-slot-staging-copy-title">单 App 区 + 暂存复制</title>
        <desc id="single-slot-staging-copy-desc">示意图：Flash 分为 Bootloader、唯一的 App 区、暂存区与参数区四段；新固件先落到暂存区，置标志重启后由 Bootloader 擦除 App 区并逐页复制，复制一开始旧固件即被破坏，是掉电变砖的窗口。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap');
      #single-slot-staging-copy-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace; }
      #single-slot-staging-copy-root { font-family: var(--font-sans); color: var(--color-ink); }</style>

          <marker id="single-slot-staging-copy-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- 分区条 -->
        <rect x="72" y="96" width="136" height="72" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1"/>
        <text x="88" y="128" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">Bootloader</text>
        <text x="88" y="150" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">16 KB</text>

        <rect x="208" y="96" width="384" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.32" stroke-width="1"/>
        <text x="228" y="128" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">App 区（唯一）</text>
        <text x="228" y="150" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">240 KB · 链接地址固定，唯一运行区</text>

        <rect x="592" y="96" width="384" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1"/>
        <text x="612" y="128" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">暂存区</text>
        <text x="612" y="150" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">240 KB · 新固件落点；复制阶段只读</text>

        <rect x="976" y="96" width="232" height="72" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1"/>
        <text x="996" y="128" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">参数区</text>
        <text x="996" y="150" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">标志 + 断点记录</text>

        <text x="72" y="188" fill="#5a6580" font-size="12" font-weight="400" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">示意，非等比例</text>

        <!-- 四步流程 -->
        <line x1="340" y1="272" x2="364" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#single-slot-staging-copy-arrow)"/>
        <line x1="628" y1="272" x2="652" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#single-slot-staging-copy-arrow)"/>
        <line x1="916" y1="272" x2="940" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#single-slot-staging-copy-arrow)"/>

        <rect x="76" y="224" width="264" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.28" stroke-width="1"/>
        <circle cx="104" cy="252" r="10" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-opacity="0.35" stroke-width="1"/>
        <text x="104" y="257" fill="#4f5d75" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">1</text>
        <text x="128" y="250" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">下载并校验</text>
        <text x="128" y="274" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">写进暂存区，App 区不动</text>

        <rect x="364" y="224" width="264" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.28" stroke-width="1"/>
        <circle cx="392" cy="252" r="10" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-opacity="0.35" stroke-width="1"/>
        <text x="392" y="257" fill="#4f5d75" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">2</text>
        <text x="416" y="250" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">置标志并重启</text>
        <text x="416" y="274" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">参数区写下"待复制"</text>

        <rect x="652" y="224" width="264" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.28" stroke-width="1"/>
        <circle cx="680" cy="252" r="10" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-opacity="0.35" stroke-width="1"/>
        <text x="680" y="257" fill="#4f5d75" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">3</text>
        <text x="704" y="250" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">擦除并逐页复制</text>
        <text x="704" y="274" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">暂存区 → App 区</text>

        <rect x="940" y="224" width="264" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.28" stroke-width="1"/>
        <circle cx="968" cy="252" r="10" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-opacity="0.35" stroke-width="1"/>
        <text x="968" y="257" fill="#4f5d75" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace">4</text>
        <text x="992" y="250" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">回读校验并跳转</text>
        <text x="992" y="274" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">通过才更新参数区</text>

        <!-- 掉电窗口标注 -->
        <path d="M652 340 V332 H916 V340" fill="none" stroke="#bf4520" stroke-width="1.2"/>
        <text x="784" y="364" fill="#bf4520" font-size="12" font-weight="500" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">第 3 步一开始旧固件就被擦除，此刻掉电即变砖</text>

        <text x="76" y="396" fill="#5a6580" font-size="12" font-weight="400" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">兜底：复制阶段暂存区只读，复制失败可重来；暂存区也损坏时停在恢复通道，等上位机重发</text>
      </svg>
