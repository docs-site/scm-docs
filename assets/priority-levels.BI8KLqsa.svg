<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 590" role="img" aria-labelledby="pl-title pl-desc" xmlns="http://www.w3.org/2000/svg" id="priority-levels-root">
  <title id="pl-title">本工程的任务优先级阶梯</title>
  <desc id="pl-desc">FreeRTOS 数值越大优先级越高：IDLE 为 0，Tmr Svc 为 2，heartbeatTask 为 8，shellTask 为 9，invMid 为 24，defaultTask 为 25，invHigh 为 33；高数值任务无条件抢占低数值任务。</desc>
  <defs>
      <style>#priority-levels-root text { font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif; }
      #priority-levels-root .label { font-size: 13px; font-weight: 600; fill: #2d3142; }
      #priority-levels-root .label-mut { font-size: 13px; font-weight: 600; fill: #4f5d75; }
      #priority-levels-root .label-acc { font-size: 13px; font-weight: 600; fill: #bf4520; }
      #priority-levels-root .sub { font-size: 12px; font-weight: 500; fill: #4f5d75; }
      #priority-levels-root .mono { font-family: Consolas, 'Courier New', monospace; font-size: 11px; fill: #4f5d75; }
      #priority-levels-root .dot-k { fill: #ebe8e3; stroke: #4f5d75; stroke-width: 1.2; }
      #priority-levels-root .dot-a { fill: #ffffff; stroke: #2d3142; stroke-width: 1.4; }
      #priority-levels-root .dot-d { fill: #eddad2; stroke: #bf4520; stroke-width: 1.4; }</style>
  </defs>

  <text class="label" x="40" y="28">本工程的任务优先级阶梯</text>
  <text class="sub" x="40" y="50">数值来自 ps 与 freertos.c 实测 · FreeRTOS 规定数值越大优先级越高，0 是空闲任务</text>

  <!-- 数值轴 -->
  <line x1="130" y1="86" x2="130" y2="470" stroke="#2d3142" stroke-width="1.2"/>
  <text class="mono" x="118" y="470" text-anchor="end">0</text>
  <line x1="124" y1="466" x2="136" y2="466" stroke="#2d3142" stroke-width="1"/>
  <text class="mono" x="118" y="411" text-anchor="end">2</text>
  <line x1="124" y1="407" x2="136" y2="407" stroke="#2d3142" stroke-width="1"/>
  <text class="mono" x="118" y="337" text-anchor="end">8</text>
  <line x1="124" y1="333" x2="136" y2="333" stroke="#2d3142" stroke-width="1"/>
  <text class="mono" x="118" y="282" text-anchor="end">9</text>
  <line x1="124" y1="278" x2="136" y2="278" stroke="#2d3142" stroke-width="1"/>
  <text class="mono" x="118" y="213" text-anchor="end">24</text>
  <line x1="124" y1="209" x2="136" y2="209" stroke="#2d3142" stroke-width="1"/>
  <text class="mono" x="118" y="158" text-anchor="end">25</text>
  <line x1="124" y1="154" x2="136" y2="154" stroke="#2d3142" stroke-width="1"/>
  <text class="mono" x="118" y="89" text-anchor="end">33</text>
  <line x1="124" y1="85" x2="136" y2="85" stroke="#2d3142" stroke-width="1"/>

  <!-- 刻度引线与任务 -->
  <circle class="dot-k" cx="130" cy="466" r="5"/>
  <line x1="138" y1="466" x2="200" y2="466" stroke="#4f5d75" stroke-width="1"/>
  <text class="label-mut" x="210" y="470">IDLE</text>
  <text class="sub" x="280" y="470">空闲任务，永远最低</text>

  <circle class="dot-k" cx="130" cy="407" r="5"/>
  <line x1="138" y1="407" x2="200" y2="407" stroke="#4f5d75" stroke-width="1"/>
  <text class="label-mut" x="210" y="411">Tmr Svc</text>
  <text class="sub" x="280" y="411">定时器服务任务</text>

  <circle class="dot-a" cx="130" cy="328" r="5"/>
  <line x1="138" y1="328" x2="200" y2="328" stroke="#2d3142" stroke-width="1"/>
  <text class="label" x="210" y="332">heartbeatTask</text>
  <text class="sub" x="350" y="332">osPriorityLow</text>
  <circle class="dot-d" cx="130" cy="342" r="5"/>
  <line x1="138" y1="342" x2="200" y2="342" stroke="#bf4520" stroke-width="1"/>
  <text class="label-acc" x="210" y="346">invLow</text>
  <text class="sub" x="280" y="346">持锁者，与 heartbeat 同级</text>

  <circle class="dot-a" cx="130" cy="278" r="5"/>
  <line x1="138" y1="278" x2="200" y2="278" stroke="#2d3142" stroke-width="1"/>
  <text class="label" x="210" y="282">shellTask</text>
  <text class="sub" x="280" y="282">串口命令行</text>

  <circle class="dot-d" cx="130" cy="209" r="5"/>
  <line x1="138" y1="209" x2="200" y2="209" stroke="#bf4520" stroke-width="1"/>
  <text class="label-acc" x="210" y="213">invMid</text>
  <text class="sub" x="280" y="213">中优先级，不需要锁</text>

  <circle class="dot-a" cx="130" cy="154" r="5"/>
  <line x1="138" y1="154" x2="200" y2="154" stroke="#2d3142" stroke-width="1"/>
  <text class="label" x="210" y="158">defaultTask</text>
  <text class="sub" x="320" y="158">LED 与命令队列</text>

  <circle class="dot-d" cx="130" cy="85" r="5"/>
  <line x1="138" y1="85" x2="200" y2="85" stroke="#bf4520" stroke-width="1"/>
  <text class="label-acc" x="210" y="89">invHigh</text>
  <text class="sub" x="280" y="89">演示中的最高优先级</text>

  <!-- 图例 -->
  <rect class="dot-k" x="40" y="500" width="10" height="10"/>
  <text class="sub" x="56" y="509">内核任务</text>
  <rect class="dot-a" x="150" y="500" width="10" height="10"/>
  <text class="sub" x="166" y="509">应用任务</text>
  <rect class="dot-d" x="244" y="500" width="10" height="10"/>
  <text class="sub" x="260" y="509">inv 演示任务（跑完自删）</text>

  <!-- 底部规则 -->
  <text class="sub" x="40" y="530">调度器每个 tick 在就绪任务里挑数值最大者：33 抢 25、25 抢 9、9 抢 8，切换立即发生，不打商量</text>
  <text class="sub" x="40" y="552">数值相同才按时间片轮流跑（本工程 tick = 1 ms）；heartbeatTask 与 invLow 同为 8，但前者每 5 s 只醒一次</text>
  <text class="sub" x="40" y="574">高优先级"抢 CPU"只看数值，与它是否需要某个共享资源无关——这正是优先级反转的土壤</text>
</svg>
