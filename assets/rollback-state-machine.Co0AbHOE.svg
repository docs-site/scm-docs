<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rollback-state-machine-title rollback-state-machine-desc" id="rollback-state-machine-root">
        <title id="rollback-state-machine-title">固件槽位生命周期状态机</title>
        <desc id="rollback-state-machine-desc">状态图：固件从运行已确认槽进入下载态，校验通过后置为待试用，自检通过则确认转正，自检失败或超限则回滚到旧槽；下载或校验失败直接回到运行态。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #rollback-state-machine-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace; }
      #rollback-state-machine-root { font-family: var(--font-sans); color: var(--color-ink); }
      #rollback-state-machine-root .diagram-container { width: 100%; overflow-x: auto; }
      #rollback-state-machine-root .diagram-container { overflow-x: visible; }</style>
          <marker id="rollback-state-machine-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="rollback-state-machine-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="rollback-state-machine-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Transitions: main spine -->
        <line x1="640" y1="68" x2="640" y2="84" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rollback-state-machine-arrow)"/>
        <line x1="640" y1="150" x2="640" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rollback-state-machine-arrow)"/>
        <line x1="640" y1="290" x2="640" y2="364" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rollback-state-machine-arrow)"/>
        <line x1="640" y1="430" x2="640" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rollback-state-machine-arrow)"/>
        <line x1="640" y1="570" x2="640" y2="622" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rollback-state-machine-arrow)"/>

        <!-- Transition: PENDING -> ROLLBACK -->
        <line x1="760" y1="400" x2="912" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rollback-state-machine-arrow)"/>

        <!-- Transition: ROLLBACK -> RUNNING (dashed return) -->
        <path d="M 1040,370 V 128 Q 1040,120 1032,120 H 764" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#rollback-state-machine-arrow)"/>

        <!-- Transition: DOWNLOADING -> RUNNING (dashed return) -->
        <path d="M 520,260 H 388 Q 380,260 380,252 V 128 Q 380,120 388,120 H 512" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#rollback-state-machine-arrow)"/>

        <!-- Transition labels -->
        <rect x="648" y="176" width="68" height="16" rx="2" fill="#f5f5f5"/>
        <text x="682" y="188" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">发现新版本</text>

        <rect x="648" y="316" width="104" height="16" rx="2" fill="#f5f5f5"/>
        <text x="700" y="328" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">校验通过并重启</text>

        <rect x="648" y="456" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text x="676" y="468" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">自检通过</text>

        <rect x="792" y="378" width="104" height="16" rx="2" fill="#f5f5f5"/>
        <text x="844" y="390" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">自检失败或超限</text>

        <rect x="1048" y="200" width="68" height="16" rx="2" fill="#f5f5f5"/>
        <text x="1082" y="212" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">切回旧槽</text>

        <rect x="280" y="176" width="104" height="16" rx="2" fill="#f5f5f5"/>
        <text x="332" y="188" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">下载或校验失败</text>

        <!-- Start dot -->
        <circle cx="640" cy="62" r="6" fill="#2d3142"/>

        <!-- End ring -->
        <circle cx="640" cy="634" r="8" fill="none" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="640" cy="634" r="5" fill="#2d3142"/>

        <!-- State: 运行已确认固件 -->
        <rect x="520" y="90" width="240" height="60" rx="8" fill="#f5f5f5"/>
        <rect x="520" y="90" width="240" height="60" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="640" y="116" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">运行已确认固件</text>
        <text x="640" y="136" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">active_slot</text>

        <!-- State: 下载到非活动槽 -->
        <rect x="520" y="230" width="240" height="60" rx="8" fill="#f5f5f5"/>
        <rect x="520" y="230" width="240" height="60" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="640" y="256" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">下载到非活动槽</text>
        <text x="640" y="276" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">分块校验 · 断点续传</text>

        <!-- State: 待试用 -->
        <rect x="520" y="370" width="240" height="60" rx="8" fill="#f5f5f5"/>
        <rect x="520" y="370" width="240" height="60" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="640" y="396" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">待试用（PENDING）</text>
        <text x="640" y="416" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">pending_slot · boot_count</text>

        <!-- State: 确认转正 (focal) -->
        <rect x="520" y="510" width="240" height="60" rx="8" fill="#f5f5f5"/>
        <rect x="520" y="510" width="240" height="60" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="640" y="536" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">确认转正</text>
        <text x="640" y="556" fill="#4f5d75" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">mark good</text>

        <!-- State: 回滚到旧槽 -->
        <rect x="920" y="370" width="240" height="60" rx="8" fill="#f5f5f5"/>
        <rect x="920" y="370" width="240" height="60" rx="8" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="1040" y="396" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">回滚到旧槽</text>
        <text x="1040" y="416" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">清除 pending 标志与计数</text>
      </svg>
